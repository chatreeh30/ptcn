<script>
/* =====================================================================
   ส่วนที่ 1: เชื่อมต่อ Python (Pyodide)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=String.raw;
let py=null,pyReady=false,pyRun=null,pyShell=null,pyShellReset=null;

const RUNNER=String.raw`
import sys, io, json, builtins
from contextlib import redirect_stdout

class _Limit(BaseException):
    pass

_SKIP = ('module', 'function', 'builtin_function_or_method', 'type', 'method')

def _vals(items, skip_obj):
    d = {}
    for k, v in items:
        if k.startswith('__') or v is skip_obj:
            continue
        tn = type(v).__name__
        if tn in _SKIP:
            continue
        try:
            r = repr(v)
        except Exception:
            r = '?'
        if len(r) > 90:
            r = r[:87] + '...'
        d[k] = [tn, r]
    return d

def _err_info(e):
    line = 0
    tb = e.__traceback__
    while tb is not None:
        if tb.tb_frame.f_code.co_filename == '<student>':
            line = tb.tb_lineno
        tb = tb.tb_next
    return {'kind': 'run', 'type': type(e).__name__, 'msg': str(e), 'line': line}

def _run(src, inputs_json):
    inputs = json.loads(inputs_json)
    out = io.StringIO()
    steps = []
    hits = {}
    g = {'__name__': '__main__', '__builtins__': builtins}
    def _input(prompt=''):
        out.write('\x03' + str(prompt) + '\x04')
        if not inputs:
            raise EOFError('__NO_INPUT__')
        v = inputs.pop(0)
        out.write('\x01' + v + '\x02\n')
        return v
    g['input'] = _input
    count = [0]
    def _tracer(frame, event, arg):
        if frame.f_code.co_filename != '<student>':
            return None
        if event == 'line':
            count[0] += 1
            ln = frame.f_lineno
            hits[ln] = hits.get(ln, 0) + 1
            if count[0] > 30000:
                raise _Limit('__STEP_LIMIT__')
            if out.tell() > 20000:
                raise _Limit('__OUT_LIMIT__')
            if len(steps) < 1000:
                st = {'line': ln, 'vars': _vals(list(frame.f_globals.items()), _input), 'out': out.tell()}
                if not frame.f_code.co_name.startswith('<'):
                    st['fn'] = frame.f_code.co_name
                    st['loc'] = _vals(list(frame.f_locals.items()), _input)
                steps.append(st)
        return _tracer
    res = {'err': None, 'hits': {}}
    try:
        code = compile(src, '<student>', 'exec')
    except SyntaxError as e:
        res['err'] = {'kind': 'syntax', 'type': type(e).__name__, 'msg': str(e.msg), 'line': e.lineno or 0, 'offset': e.offset or 0, 'text': (e.text or '').rstrip('\r\n')}
        res['out'] = ''
        res['steps'] = []
        res['final'] = {}
        return json.dumps(res, ensure_ascii=False)
    old = sys.gettrace()
    try:
        with redirect_stdout(out):
            sys.settrace(_tracer)
            try:
                exec(code, g)
            finally:
                sys.settrace(old)
    except SystemExit:
        pass
    except BaseException as e:
        res['err'] = _err_info(e)
    res['out'] = out.getvalue()
    res['steps'] = steps
    res['hits'] = hits
    res['final'] = _vals(list(g.items()), _input)
    return json.dumps(res, ensure_ascii=False)

_shells = {}

def _shell(sid, line):
    g = _shells.get(sid)
    if g is None:
        g = {'__name__': '__main__', '__builtins__': builtins}
        _shells[sid] = g
    def _noinput(prompt=''):
        raise RuntimeError('__SHELL_INPUT__')
    g['input'] = _noinput
    out = io.StringIO()
    err = None
    count = [0]
    def _tr(frame, event, arg):
        if frame.f_code.co_filename != '<shell>':
            return None
        if event == 'line':
            count[0] += 1
            if count[0] > 20000:
                raise _Limit('__STEP_LIMIT__')
        return _tr
    old = sys.gettrace()
    try:
        with redirect_stdout(out):
            try:
                code = compile(line, '<shell>', 'eval')
                is_eval = True
            except SyntaxError:
                code = compile(line, '<shell>', 'exec')
                is_eval = False
            v = None
            sys.settrace(_tr)
            try:
                if is_eval:
                    v = eval(code, g)
                else:
                    exec(code, g)
            finally:
                sys.settrace(old)
            if v is not None:
                print(repr(v))
    except BaseException as e:
        msg = e.msg if isinstance(e, SyntaxError) else str(e)
        err = {'type': type(e).__name__, 'msg': str(msg)}
    return json.dumps({'out': out.getvalue(), 'err': err}, ensure_ascii=False)

def _shell_reset(sid):
    _shells.pop(sid, None)
`;

async function initPy(){
  const st=$('#pystatus');
  st.className='status st-load';
  st.innerHTML='⏳ กำลังโหลด Python ... (ครั้งแรกใช้เวลาประมาณ 10-30 วินาที และต้องต่ออินเทอร์เน็ต) ระหว่างนี้อ่านเนื้อหาไปก่อนได้เลย';
  try{
    if(typeof loadPyodide!=='function')throw new Error('โหลดไฟล์ pyodide.js ไม่ได้ (ตรวจการเชื่อมต่ออินเทอร์เน็ต)');
    py=await loadPyodide();
    py.runPython(RUNNER);
    pyRun=py.globals.get('_run');
    pyShell=py.globals.get('_shell');
    pyShellReset=py.globals.get('_shell_reset');
    const ver=py.runPython('import sys; sys.version.split()[0]');
    pyReady=true;
    st.className='status st-ok';
    st.innerHTML=`✅ Python ${esc(ver)} พร้อมใช้งานแล้ว`;
  }catch(e){
    st.className='status st-err';
    st.innerHTML=`❌ โหลด Python ไม่สำเร็จ: ${esc(e.message||e)} <button class="btn" id="retry">ลองโหลดใหม่</button>`;
    $('#retry').onclick=()=>location.reload();
  }
}
function runPy(src,inputText){
  const lines=(inputText||'').replace(/\r/g,'').split('\n');
  while(lines.length&&lines[lines.length-1]==='')lines.pop();
  try{return JSON.parse(pyRun(src,JSON.stringify(lines)));}
  catch(e){return{out:'',steps:[],final:{},hits:{},err:{kind:'run',type:'InternalError',msg:String(e),line:0}};}
}

/* =====================================================================
   ส่วนที่ 2: แปลข้อผิดพลาดเป็นภาษาไทย
   ===================================================================== */
const PY_KW=['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield'];
const BUILTIN_NAMES=['print','input','int','float','str','bool','type','len','round','abs','max','min','sum','range','list','sorted','enumerate','True','False','None'];
function thaiErr(e,names,src){
  const t=e.type||'Error',m=e.msg||'';let k;
  const R=(h,d)=>({h,d});
  src=src||'';
  if(m==='__NO_INPUT__')return R('ไม่มีข้อมูลให้ input() อ่าน','โปรแกรมเรียก <code>input()</code> มากกว่าจำนวนข้อมูลที่เตรียมไว้ ให้เพิ่มข้อมูลในช่อง "ข้อมูลที่จะพิมพ์ให้ input()" <b>บรรทัดละ 1 ค่า</b> (ถ้า input() อยู่ใน loop ต้องเตรียมข้อมูลให้พอทุกรอบ)');
  if(m==='__STEP_LIMIT__'||m==='__OUT_LIMIT__')return R('โปรแกรมวนไม่รู้จบ (infinite loop) 🔁',`${m==='__OUT_LIMIT__'?'แสดงผลเกิน 20,000 ตัวอักษร':'ทำงานเกิน 30,000 ขั้นตอน'} จึงถูกหยุดไว้ ตรวจว่า ① ตัวแปรในเงื่อนไขของ <code>while</code> ถูกเปลี่ยนค่าใน loop หรือไม่ (เช่น ลืม <code>i += 1</code>) ② เงื่อนไขมีโอกาสเป็น False จริงหรือไม่ ③ ถ้าใช้ <code>while True:</code> ต้องมี <code>break</code> ที่ทำงานได้จริง`);
  if(m==='__SHELL_INPUT__')return R('ใช้ input() ใน Shell นี้ไม่ได้','ให้ลองคำสั่ง input() ในกล่อง "ลองรันดู" แทน');
  if(t==='IndentationError'||t==='TabError'){
    if((k=/expected an indented block after (?:'(\w+)' statement|function definition)/.exec(m)))
      return R(`ลืมย่อหน้าคำสั่งใต้ ${k[1]?esc(k[1]):'def'}`,'บรรทัดที่ลงท้ายด้วย <code>:</code> ต้องตามด้วยคำสั่งอย่างน้อย 1 บรรทัดที่<b>ย่อหน้าเข้าไป 4 ช่อง</b> (กด Tab) เพื่อบอกว่าคำสั่งนั้นอยู่ "ข้างใน" if / for / while / def');
    if(/unexpected indent/.test(m))return R('ย่อหน้าเกินมา','บรรทัดนี้ย่อหน้าเข้าไป ทั้งที่บรรทัดก่อนหน้าไม่ได้ลงท้ายด้วย : ให้ลบช่องว่างหน้าบรรทัดให้ตรงกับบรรทัดอื่นในบล็อกเดียวกัน');
    if(/unindent does not match/.test(m))return R('ระยะย่อหน้าไม่ตรงกับระดับใดเลย','เช่น บรรทัดบนย่อหน้า 4 ช่อง แต่บรรทัดนี้ 3 หรือ 5 ช่อง ทุกบรรทัดในบล็อกเดียวกันต้องย่อหน้าเท่ากันเป๊ะ (แนะนำใช้ 4 ช่องเสมอ)');
    if(t==='TabError')return R('ปนการกด Tab กับเคาะ Space','ให้ใช้แบบเดียวกันทั้งไฟล์ (ในเว็บนี้ปุ่ม Tab ใส่ช่องว่าง 4 ช่องให้แล้ว)');
    return R('การย่อหน้าไม่ถูกต้อง','ตรวจช่องว่างหน้าบรรทัด คำสั่งในบล็อกเดียวกันต้องย่อหน้าเท่ากัน');
  }
  if(t==='SyntaxError'){
    const tx=(e.text||'').trim();
    if(/expected ':'/.test(m))return R('ลืมเครื่องหมายโคลอน ( : )','บรรทัดที่ขึ้นต้นด้วย <code>if</code> <code>elif</code> <code>else</code> <code>for</code> <code>while</code> <code>def</code> <b>ต้องลงท้ายด้วย :</b> เสมอ เช่น <code>if x &gt; 0:</code> และ <code>else:</code> นี่คือข้อผิดพลาดอันดับ 1 ของบทนี้!');
    if(/Maybe you meant '==' or ':=' instead of '='|Maybe you meant '=='/.test(m))return R('ใช้ = ในเงื่อนไข ต้องใช้ ==','<code>=</code> คือการเก็บค่าลงตัวแปร ส่วน <code>==</code> คือการเปรียบเทียบว่าเท่ากันหรือไม่ ในเงื่อนไขของ if / elif / while ต้องใช้ <code>==</code> เช่น <code>if x == 10:</code>');
    if(/'break' outside loop/.test(m))return R('ใช้ break นอก loop','break ใช้ได้เฉพาะภายใน for หรือ while ตรวจว่า break ย่อหน้าเข้าไปอยู่ในบล็อกของ loop แล้วหรือยัง');

  if(t==='UnboundLocalError'){

        return R(`'${esc(n)}' ถูกสร้างไว้ภายในฟังก์ชัน (ตัวแปร local)`,`ตัวแปรที่สร้างในฟังก์ชันใช้ได้เฉพาะในฟังก์ชันนั้น พอฟังก์ชันจบก็หายไป ถ้าต้องการค่าออกมาข้างนอก ให้ใช้ <code>return</code> แล้วเก็บผลไว้ เช่น <code>result = my_func()</code> (หรือถ้าตัวแปรนี้ถูกสร้างใน if ที่ไม่ได้ทำงาน มันก็จะไม่มีอยู่จริงเช่นกัน)`);

    if((k=/'(\w+)' object is not callable/.exec(m)))return R(`ค่าชนิด ${esc(k[1])} ถูกเรียกเหมือนเป็นฟังก์ชัน`,'มักเกิดจากตั้งชื่อตัวแปรทับชื่อคำสั่ง เช่น <code>sum = 0</code> แล้วเรียก <code>sum(nums)</code> อีก หรือใช้ ( ) แทน [ ] เช่น <code>nums(0)</code> ต้องเป็น <code>nums[0]</code>');

  }
  if(t==='IndexError'){
    if(/pop from empty list/.test(m))return R('pop() จาก list ที่ว่างเปล่า','list ไม่มีสมาชิกเหลือแล้ว ตรวจด้วย <code>if len(nums) &gt; 0:</code> ก่อน');

    if((k=/'list' object has no attribute '(\w+)'/.exec(m)))return R(`list ไม่มีคำสั่ง .${esc(k[1])}()`,['push','add'].includes(k[1])?'ถ้าต้องการเพิ่มสมาชิกต่อท้าย ให้ใช้ <code>.append()</code>':'คำสั่งที่ใช้บ่อย: append, insert, remove, pop, sort, reverse, index, count');

    return R('เรียกคำสั่งที่ข้อมูลชนิดนี้ไม่มี','ตรวจการสะกดชื่อคำสั่งหลังจุด และชนิดของข้อมูล');

  return R(`เกิดข้อผิดพลาดชนิด ${esc(t)}`,'อ่านข้อความภาษาอังกฤษด้านล่างประกอบ');

function errBox(e,names,src){
  const t=thaiErr(e,names,src);
  const syn=e.kind==='syntax';
  let h=`<div class="box err"><b>${syn?'❌ เขียนผิดไวยากรณ์ โปรแกรมยังไม่ได้เริ่มทำงานเลย':'❌ โปรแกรมหยุดทำงานกลางทาง'}</b>${e.line?` · <b>บรรทัดที่ ${e.line}</b>`:''}<br>🧩 <b>${t.h}</b><br>${t.d}`;
  if(syn&&e.text)h+=`<pre class="show">${esc(e.text)}\n${esc(' '.repeat(Math.max(0,(e.offset||1)-1))+'^')}</pre>`;
  if(!/^__/.test(e.msg||''))h+=`<div class="eng">Python บอกว่า: <code>${esc(e.type)}: ${esc(e.msg)}</code></div>`;
  return h+'</div>';
}
function lint(src){
  const w=[];
  src.split('\n').forEach((l,i)=>{
    const code=l.replace(/#.*$/,'');
    if(/==\s*("[^"]*"|'[^']*'|\d+)\s+or\s+("[^"]*"|'[^']*'|\d+)\s*:/.test(code))
      w.push({line:i+1,msg:'เงื่อนไขแบบ x == "a" or "b" จะเป็นจริงเสมอ! ต้องเขียนเต็มทั้งสองข้าง เช่น x == "a" or x == "b"'});
    const m=/^\s*(print|input|int|float|str|len|sum|max|min|list|range|type)\s*=[^=]/.exec(code);
    if(m)w.push({line:i+1,msg:`ตั้งชื่อตัวแปรว่า ${m[1]} ซ้ำกับคำสั่งของ Python ทำให้ใช้ ${m[1]}() ไม่ได้อีก ควรเปลี่ยนชื่อ เช่น total หรือ my_list`});
    if(/\w+\s*=\s*\w+\.append\s*\(/.test(code))w.push({line:i+1,msg:'append() แก้ไข list เดิมและให้ผลเป็น None ไม่ต้องเก็บผลลัพธ์ใส่ตัวแปร ให้เขียนแค่ nums.append(x)'});
  });
  if(/while\s+True\s*:/.test(src)&&!/\bbreak\b/.test(src))w.push({line:0,msg:'มี while True: แต่ไม่มี break เลย loop นี้จะวนไม่รู้จบ'});
  return w;
}

function showResult(host,r,src,openStep){
  const names=Object.keys(r.final||{});
  const syn=r.err&&r.err.kind==='syntax';
  let h='';
  if(!syn)h+=`<div class="tlabel">🖥️ หน้าจอผลลัพธ์ (ตัวอักษรสีเหลือง = สิ่งที่ผู้ใช้พิมพ์ให้ input())</div><div class="term mono">${fmtOut(r.out)||'<span style="color:#64748b">(ไม่มีอะไรแสดง)</span>'}</div>`;
  h+=r.err?errBox(r.err,names,src):'<div class="box good">✅ โปรแกรมทำงานสำเร็จ</div>';
  const w=lint(src);
  if(w.length)h+=`<div class="box warn"><b>⚠️ ข้อสังเกต</b><ul>${w.map(x=>`<li>${x.line?'บรรทัดที่ '+x.line+': ':''}${esc(x.msg)}</li>`).join('')}</ul></div>`;
  if(!syn&&r.steps&&r.steps.length)h+=`<details class="stpwrap" ${openStep?'open':''}><summary>👣 ดูการทำงานทีละบรรทัด ค่าของตัวแปร และจำนวนครั้งที่แต่ละบรรทัดทำงาน</summary><div class="stp"></div></details>`;
  host.innerHTML=h;
  const sh=$('.stp',host);
  if(sh)mkStepper(sh,r,src);
}
function varTable(cur,prev,cmp,changes,prefix){
  const names=Object.keys(cur);
  if(!names.length)return '<div class="tlabel">(ยังไม่มีตัวแปร)</div>';
  return `<table class="vt"><tr><th>ชื่อ</th><th>ชนิด</th><th>ค่า</th></tr>${names.map(n=>{
    const ty=cur[n][0],rep=cur[n][1];let cls='',note='';
    if(cmp&&!(n in prev)){cls='new';note='<span class="tag newv">ใหม่!</span>';changes.push(`${prefix}สร้าง <code>${esc(n)}</code> = <code>${esc(rep)}</code>`);}
    else if(cmp&&(prev[n][1]!==rep||prev[n][0]!==ty)){cls='chg';note=` <span class="was">(เดิม ${esc(prev[n][1])})</span>`;changes.push(`${prefix}<code>${esc(n)}</code> เปลี่ยนจาก <code>${esc(prev[n][1])}</code> เป็น <code>${esc(rep)}</code>`);}
    return `<tr><td class="${cls}"><code>${esc(n)}</code></td><td class="${cls}"><span class="tag ${esc(ty)}">${esc(ty)}</span></td><td class="${cls} mono">${esc(rep)}${note}</td></tr>`;
  }).join('')}</table>`;
}
function mkStepper(host,r,src){
  const lines=src.split('\n');
  const outArr=Array.from(r.out||'');
  const hits=r.hits||{};
  const views=r.steps.map(s=>({line:s.line,vars:s.vars,out:s.out,fn:s.fn||null,loc:s.loc||null}));
  views.push({line:null,vars:r.final||{},out:outArr.length,end:true,fn:null,loc:null});
  const trunc=r.steps.length>=1000;
  let k=0;
  host.innerHTML=`<div class="stp-ctl"><button class="btn" data-a="first">⏮ เริ่ม</button><button class="btn" data-a="prev">◀ ย้อน</button><span class="stp-n"></span><button class="btn go" data-a="next">ถัดไป ▶</button><button class="btn" data-a="last">จบ ⏭</button></div>
  <div class="box warn smsg"></div>
  <div class="stp-grid"><div><div class="tlabel">โค้ด (➜ = บรรทัดที่กำลังจะทำ · แถบเขียว = เพิ่งทำเสร็จ · ×n = บรรทัดนี้ทำงานทั้งหมดกี่ครั้ง)</div><div class="scode"></div></div>
  <div><div class="svars"></div><div class="tlabel">🖥️ หน้าจอ ณ ขั้นนี้</div><div class="term mono sout"></div></div></div>`;
  const draw=()=>{
    const v=views[k],pv=k>0?views[k-1]:null;
    const doneL=pv?pv.line:null,nextL=v.end?null:v.line;
    const badL=(v.end&&r.err)?r.err.line:null;
    $('.scode',host).innerHTML=lines.map((l,i)=>{
      const n=i+1;let c='',a='';
      if(n===badL){c='bad';a='✖';}else if(n===nextL){c='next';a='➜';}else if(n===doneL)c='done';
      const hc=hits[n]?'×'+hits[n]:'';
      return `<div class="sl ${c}"><span class="sa">${a}</span><span class="sn">${n}</span><span class="hc">${hc}</span><span>${esc(l)||' '}</span></div>`;
    }).join('');
    const changes=[];
    let vh='';
    if(v.fn){
      const prevLoc=(pv&&pv.fn===v.fn&&pv.loc)?pv.loc:{};
      vh+=`<div class="loc"><div class="tlabel">📦 ตัวแปรภายในฟังก์ชัน <b>${esc(v.fn)}()</b> (local · จะหายไปเมื่อฟังก์ชันจบ)</div>${varTable(v.loc||{},prevLoc,!!pv,changes,'[ใน '+esc(v.fn)+'] ')}</div>`;
    }
    vh+=`<div class="tlabel">📦 ตัวแปรของโปรแกรมหลัก (global)</div>${varTable(v.vars,pv?pv.vars:{},!!pv,changes,'')}`;
    $('.svars',host).innerHTML=vh;
    $('.sout',host).innerHTML=fmtOut(outArr.slice(0,v.out).join(''))||'<span style="color:#64748b">(ว่าง)</span>';
    let msg;
    if(k===0)msg='▶ ยังไม่เริ่มทำงาน ลูกศร ➜ ชี้บรรทัดแรกที่จะทำ กด "ถัดไป" เพื่อให้ Python ทำทีละบรรทัด (ลองทายก่อนกดทุกครั้ง!)';
    else if(v.end&&r.err)msg=`❌ ระหว่างทำบรรทัดที่ ${r.err.line} เกิดข้อผิดพลาด โปรแกรมจึงหยุดทันที`;
    else if(v.fn&&pv.fn!==v.fn)msg=`📞 บรรทัดที่ ${doneL} เรียกฟังก์ชัน <code>${esc(v.fn)}()</code> โปรแกรมจึงกระโดดเข้าไปทำในฟังก์ชัน${changes.length?' · '+changes.join(', '):''}`;
    else{
      msg=(!v.fn&&pv.fn)?`↩️ ฟังก์ชัน <code>${esc(pv.fn)}()</code> ทำงานจบแล้ว กลับมาทำต่อที่โปรแกรมหลัก (ตัวแปร local ถูกลบทิ้ง)`:`✔ ทำบรรทัดที่ ${doneL} เสร็จแล้ว`;
      const shown=v.out>pv.out;
      if(changes.length)msg+=': '+changes.join(', ')+(shown?' และแสดงผลบนหน้าจอ':'');
      else msg+=shown?' (แสดงผลบนหน้าจอ)':' (ไม่มีตัวแปรเปลี่ยน)';
      if(v.end)msg+=' · 🏁 จบโปรแกรม';
    }
    if(trunc&&v.end)msg+=' (บันทึกทีละขั้นไว้เฉพาะ 1,000 ขั้นแรก แต่ตัวเลข ×n นับครบทุกครั้ง)';
    $('.smsg',host).innerHTML=msg;
    $('.stp-n',host).textContent=`ขั้น ${k} / ${views.length-1}`;
    host.querySelector('[data-a=first]').disabled=k===0;
    host.querySelector('[data-a=prev]').disabled=k===0;
    host.querySelector('[data-a=next]').disabled=k===views.length-1;
    host.querySelector('[data-a=last]').disabled=k===views.length-1;
  };
  host.querySelectorAll('.stp-ctl button').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='first')k=0;else if(a==='prev')k=Math.max(0,k-1);else if(a==='next')k=Math.min(views.length-1,k+1);else k=views.length-1;
    draw();
  });
  draw();
}

let progress={};

const notReady='<div class="box warn">⏳ Python ยังโหลดไม่เสร็จ รอสักครู่แล้วกดใหม่ (ดูสถานะที่แถบด้านบนสุด)</div>';

function mkEditor(host,cfg){
  const hasIn=cfg.input!==undefined;
  host.innerHTML=`<textarea class="code" spellcheck="false" wrap="off"></textarea>${hasIn?'<label class="lab">⌨️ ข้อมูลที่จะพิมพ์ให้ input() (บรรทัดละ 1 ค่า เรียงตามลำดับที่ input() ถูกเรียก)<textarea class="inbox mono"></textarea></label>':''}<div class="tlabel">💡 กด Enter หลังบรรทัดที่ลงท้ายด้วย : จะย่อหน้าให้อัตโนมัติ · Tab = ย่อหน้า · Shift+Tab = ลดย่อหน้า · Ctrl+Enter = รัน</div><div class="btns"><button class="btn go run">▶ รันโปรแกรม</button><button class="btn rs">↺ เริ่มใหม่</button></div><div class="res"></div>`;
  const ta=$('textarea.code',host),inp=$('.inbox',host),res=$('.res',host);
  ta.value=cfg.code;ta.rows=Math.min(26,cfg.code.split('\n').length+1);
  if(inp){inp.value=cfg.input;inp.rows=Math.max(2,cfg.input.split('\n').length);}
  const run=()=>{
    if(!pyReady){res.innerHTML=notReady;return;}
    const src=ta.value;
    res.innerHTML='<div class="tlabel">กำลังรัน...</div>';
    setTimeout(()=>showResult(res,runPy(src,inp?inp.value:''),src,!!cfg.trace),10);
  };
  $('.run',host).onclick=run;
  $('.rs',host).onclick=()=>{ta.value=cfg.code;if(inp)inp.value=cfg.input;res.innerHTML='';};
  ta.addEventListener('keydown',e=>{
    if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run();return;}
    const s=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',s-1)+1;
    if(e.key==='Tab'){
      e.preventDefault();
      if(e.shiftKey){const m=/^ {1,4}/.exec(v.slice(ls));if(m)ta.setRangeText('',ls,ls+m[0].length,'preserve');}
      else ta.setRangeText('    ',s,ta.selectionEnd,'end');
    }else if(e.key==='Enter'&&!e.isComposing){
      e.preventDefault();
      const line=v.slice(ls,s);
      const ind=/^ */.exec(line)[0];
      const extra=/:\s*(#.*)?$/.test(line)?'    ':'';
      ta.setRangeText('\n'+ind+extra,s,ta.selectionEnd,'end');
    }
  });
  (cfg.tries||[]).forEach(t=>{
    const b=document.createElement('button');b.className='btn';b.textContent=t.label;
    b.onclick=()=>{ta.value=t.fn(cfg.code);if(inp)inp.value=cfg.input;run();};
    $('.btns',host).appendChild(b);
  });
  return{get:()=>ta.value};
}
function mkMission(host,cfg,stepId,onDone){
  const hasIn=cfg.tests.some(t=>t.input!==undefined);
  host.innerHTML=`<h3 style="margin-top:0">🎯 ภารกิจ: ${cfg.title}</h3>${cfg.task}
  <div class="tw"><table><tr>${hasIn?'<th>ข้อมูลที่พิมพ์ให้ input()</th>':''}<th>ผลลัพธ์ที่ต้องได้</th></tr>${cfg.tests.map(t=>`<tr>${hasIn?`<td><pre class="mono" style="margin:0">${esc(t.input||'')}</pre></td>`:''}<td><pre class="mono" style="margin:0">${esc(t.expected)}</pre></td></tr>`).join('')}</table></div>
  ${hasIn?'<p class="tlabel">ℹ️ ข้อความชวนพิมพ์ใน input("...") จะไม่ถูกนำมาตรวจ ใส่หรือไม่ใส่ก็ได้</p>':''}
  <div class="ed"></div>
  <div class="btns"><button class="btn ok chk">✔ ตรวจคำตอบ</button><button class="btn hint">💡 ขอคำใบ้</button><button class="btn sol">👀 ดูเฉลย</button></div>
  <div class="hb"></div><div class="cr"></div>`;
  const ed=mkEditor($('.ed',host),{code:cfg.code,input:hasIn?cfg.tests[0].input:undefined,trace:true});
  const cr=$('.cr',host);
  $('.hint',host).onclick=()=>{$('.hb',host).innerHTML=`<div class="box warn">💡 ${cfg.hint}</div>`;};
  $('.sol',host).onclick=()=>{$('.hb',host).innerHTML='<div class="box warn">เฉลย (ลองทำเองก่อน แล้วค่อยเทียบนะ)<pre class="show"></pre></div>';$('.hb pre',host).textContent=cfg.solution;};
  $('.chk',host).onclick=()=>{
    if(!pyReady){cr.innerHTML=notReady;return;}
    const code=ed.get();let all=true,h='<ul>';
    (cfg.requires||[]).forEach(q=>{const ok=q.re.test(code);if(!ok)all=false;h+=`<li>${ok?'✅':'❌'} ${q.msg}</li>`;});
    cfg.tests.forEach((t,i)=>{
      const r=runPy(code,t.input||'');
      const lbl=`ชุดทดสอบที่ ${i+1}${t.input!==undefined?` (พิมพ์ <code>${esc(t.input).replace(/\n/g,' ⏎ ')}</code>)`:''}`;
      if(r.err){all=false;const te=thaiErr(r.err,Object.keys(r.final||{}),code);h+=`<li>❌ ${lbl}: ${r.err.kind==='syntax'?'เขียนผิดไวยากรณ์':'โปรแกรมหยุดทำงาน'}${r.err.line?' (บรรทัด '+r.err.line+')':''} · ${te.h}</li>`;return;}
      const got=cleanOut(r.out);const ok=norm(got)===norm(t.expected);if(!ok)all=false;
      h+=`<li>${ok?'✅':'❌'} ${lbl}`;
      if(!ok)h+=`<br>ต้องได้:<pre class="show">${esc(t.expected)}</pre>แต่ได้:<pre class="show">${esc(got)||'(ว่างเปล่า)'}</pre>`;
      h+='</li>';
    });
    h+='</ul>';
    if(all){progress[stepId]=true;saveP();onDone();h='<div class="box good"><b>🎉 ผ่านแล้ว เก่งมาก!</b></div>'+h;}
    else h='<div class="box err"><b>ยังไม่ผ่าน ไม่เป็นไร ลองดูผลเปรียบเทียบแล้วแก้อีกนิด</b></div>'+h;
    cr.innerHTML=h;
  };
  if(progress[stepId])cr.innerHTML='<div class="box good">✅ คุณเคยทำภารกิจนี้ผ่านแล้ว</div>';
}
function mkQuiz(host,list){
  host.innerHTML='<h3 style="margin-top:0">🤔 ถามเล็กๆ</h3>'+list.map((q,qi)=>`<div class="q" data-q="${qi}"><div class="qq"><b>ข้อ ${qi+1}.</b> ${q.q}</div>${q.c.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c)}</button>`).join('')}<div class="fb"></div></div>`).join('');
  list.forEach((q,qi)=>{

    box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{

function mkShell(host,cfg){
  host.innerHTML=`<h3 style="margin-top:0">🐍 ลองเล่น: Python Shell</h3><p>${cfg.tip}</p>
  <div class="shell"><div class="sh-log"></div><div class="sh-in"><span>&gt;&gt;&gt;</span><input class="sh-inp" spellcheck="false" autocomplete="off" placeholder="พิมพ์คำสั่งแล้วกด Enter"></div></div>
  <div class="tlabel">กดปุ่มด้านล่างเพื่อลองคำสั่งตัวอย่าง (ทายผลก่อนกดนะ! ปุ่มลูกศรขึ้น ↑ เรียกคำสั่งเดิมได้)</div><div class="btns sm"></div>`;
  const log=$('.sh-log',host),inp=$('.sh-inp',host),hist=[];let hp=0;
  const add=(cls,html)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;};
  const run=line=>{
    if(!line.trim())return;
    add('p','&gt;&gt;&gt; '+esc(line));hist.push(line);hp=hist.length;
    if(!pyReady){add('e','⏳ รอให้ Python โหลดเสร็จก่อนนะ');return;}
    let r;
    try{r=JSON.parse(pyShell(cfg.id,line));}catch(e){add('e',esc(String(e)));return;}
    if(r.out)add('o',esc(r.out.replace(/\n$/,'')));
    if(r.err){const t=thaiErr(r.err,[],'');add('e',`${/^__/.test(r.err.msg)?'':esc(r.err.type)+': '+esc(r.err.msg)+'<br>'}💡 ${t.h}`);}
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){run(inp.value);inp.value='';}
    else if(e.key==='ArrowUp'){if(hp>0){hp--;inp.value=hist[hp];}e.preventDefault();}
    else if(e.key==='ArrowDown'){if(hp<hist.length-1){hp++;inp.value=hist[hp];}else{hp=hist.length;inp.value='';}e.preventDefault();}
  });
  const bar=$('.sm',host);
  cfg.samples.forEach(s=>{const b=document.createElement('button');b.className='btn mono';b.textContent=s;b.onclick=()=>run(s);bar.appendChild(b);});
  const rb=document.createElement('button');rb.className='btn';rb.textContent='🧹 ล้าง Shell';
  rb.onclick=()=>{log.innerHTML='';if(pyReady)pyShellReset(cfg.id);};bar.appendChild(rb);
}

function mkLogic(host){
  host.innerHTML=`<h3 style="margin-top:0">🧪 ลองเล่น: รวมเงื่อนไขด้วย and / or / not</h3><p>เปลี่ยนค่า a และ b แล้วดูว่าแต่ละเงื่อนไขเป็น True หรือ False <b>ทายในใจก่อนดูคำตอบทุกครั้ง!</b></p>
  <div class="row"><label>a =<input class="txt a" value="7"></label><label>b =<input class="txt b" value="-3"></label></div><div class="out"></div>`;
  const pm=(x,m)=>((x%m)+m)%m;
  const rows=[
    ['a > 0 and b > 0','บวกทั้งคู่',(a,b)=>a>0&&b>0],
    ['a > 0 or b > 0','มีบวกอย่างน้อย 1 ตัว',(a,b)=>a>0||b>0],
    ['not (a > b)','a ไม่มากกว่า b',(a,b)=>!(a>b)],
    ['0 <= a <= 10','a อยู่ในช่วง 0 ถึง 10 (เขียนแบบ Python)',(a,b)=>0<=a&&a<=10],
    ['a < 0 or a > 100','a อยู่นอกช่วง 0 ถึง 100',(a,b)=>a<0||a>100],
    ['a == b','a เท่ากับ b',(a,b)=>a===b],
    ['a != b','a ไม่เท่ากับ b',(a,b)=>a!==b],
    ['a % 2 == 0 and b % 2 == 0','เป็นเลขคู่ทั้งคู่',(a,b)=>pm(a,2)===0&&pm(b,2)===0]
  ];
  const upd=()=>{
    const sa=$('.a',host).value.trim(),sb=$('.b',host).value.trim(),A=Number(sa),B=Number(sb),o=$('.out',host);
    if(sa===''||sb===''||!isFinite(A)||!isFinite(B)){o.innerHTML='<div class="box warn">กรอก a และ b เป็นตัวเลข</div>';return;}
    o.innerHTML=`<div class="tw"><table><tr><th>เงื่อนไขใน Python</th><th>อ่านว่า</th><th>ผล</th></tr>${rows.map(r=>{const v=r[2](A,B);return `<tr><td><code>${esc(r[0])}</code></td><td>${r[1]}</td><td class="${v?'t':'f'}">${v?'True':'False'}</td></tr>`;}).join('')}</table></div>`;
  };
  host.querySelectorAll('input').forEach(x=>x.oninput=upd);upd();
}
function mkRange(host){
  host.innerHTML=`<h3 style="margin-top:0">🧪 ลองเล่น: range() สร้างตัวเลขอะไรบ้าง?</h3><p>ตั้งค่า start, stop, step แล้วดูว่า loop จะวนกี่รอบ ลองให้ step ติดลบ หรือให้ start มากกว่า stop ดู</p>
  <div class="row"><label>start (เริ่ม)<input class="txt s" value="1"></label><label>stop (หยุดก่อนถึง)<input class="txt e" value="6"></label><label>step (เพิ่มทีละ)<input class="txt p" value="1"></label></div><div class="out"></div>`;
  const upd=()=>{
    const o=$('.out',host);const vs=['.s','.e','.p'].map(c=>$(c,host).value.trim());
    if(vs.some(v=>!/^[-+]?\d+$/.test(v))){o.innerHTML='<div class="box err">range() รับเฉพาะ<b>จำนวนเต็ม</b> (ใส่ทศนิยมหรือตัวอักษรจะเกิด TypeError)</div>';return;}
    const [s,e,p]=vs.map(Number);
    if(p===0){o.innerHTML='<div class="box err">❌ step เป็น 0 ไม่ได้ (ValueError) เพราะตัวเลขจะไม่ขยับเลย</div>';return;}
    const cnt=p>0?Math.max(0,Math.ceil((e-s)/p)):Math.max(0,Math.ceil((s-e)/(-p)));
    const vals=[];for(let i=0;i<Math.min(cnt,40);i++)vals.push(s+i*p);
    const call=p===1?(s===0?`range(${e})`:`range(${s}, ${e})`):`range(${s}, ${e}, ${p})`;
    let h=`<pre class="show">for i in ${esc(call)}:\n    print(i, end=" ")</pre>`;
    if(!cnt)h+=`<div class="box warn">⚠️ ได้ลำดับว่างเปล่า loop จึง<b>ไม่ทำงานเลยสักรอบ</b> (${p>0?'step เป็นบวก แต่ start ไม่น้อยกว่า stop':'step เป็นลบ แต่ start ไม่มากกว่า stop'})</div>`;
    else{
      h+=`<div class="tw"><div class="mrow">${vals.map((v,i)=>`<div class="mc"><div class="mi">รอบ ${i+1}</div><div class="mb">${v}</div></div>`).join('')}${cnt>40?'<div class="mc"><div class="mb">…</div></div>':''}</div></div>`;
      h+=`<div class="box good">วนทั้งหมด <b>${cnt}</b> รอบ · ค่าแรก <b>${s}</b> · ค่าสุดท้าย <b>${s+(cnt-1)*p}</b> · ค่า stop (${e}) <b>ไม่ถูกนับรวม</b></div>`;
    }
    o.innerHTML=h;
  };
  host.querySelectorAll('input').forEach(x=>x.oninput=upd);upd();
}
function mkWhileSim(host){
  host.innerHTML=`<h3 style="margin-top:0">🧪 ลองเล่น: จำลอง while loop</h3><p>loop ที่ดีต้องมีครบ 3 ส่วน: ① ค่าเริ่มต้น ② เงื่อนไข ③ การเปลี่ยนค่า ลองปรับแต่ละส่วนแล้วดูว่าวนกี่รอบ หรือวนไม่จบ!</p>
  <div class="row"><label>① ค่าเริ่มต้น x =<input class="txt a" value="1"></label><label>② เงื่อนไข x …<select class="txt o"><option>&lt;</option><option>&lt;=</option><option>&gt;</option><option>&gt;=</option><option>!=</option></select></label><label>ค่าเทียบ<input class="txt b" value="20"></label><label>③ เปลี่ยนค่า x …<select class="txt u"><option>+=</option><option>-=</option><option selected>*=</option></select></label><label>ทีละ<input class="txt c" value="2"></label></div><div class="out"></div>`;
  const upd=()=>{
    const q=s=>$(s,host);const o=q('.out');
    const raw=[q('.a').value,q('.b').value,q('.c').value].map(x=>x.trim());
    if(raw.some(x=>x===''||!isFinite(Number(x)))){o.innerHTML='<div class="box warn">กรอกตัวเลขให้ครบทุกช่อง</div>';return;}
    const [A,B,Cc]=raw.map(Number),op=q('.o').value,u=q('.u').value;
    const test=x=>op==='<'?x<B:op==='<='?x<=B:op==='>'?x>B:op==='>='?x>=B:x!==B;
    const step=x=>u==='+='?x+Cc:u==='-='?x-Cc:x*Cc;
    let x=A;const rows=[];
    while(test(x)&&rows.length<30){rows.push(x);x=step(x);}
    const inf=rows.length>=30&&test(x);
    let h=`<pre class="show">${esc(`x = ${A}\nwhile x ${op} ${B}:\n    print(x)\n    x ${u} ${Cc}`)}</pre>`;
    if(!rows.length)h+=`<div class="box warn">⚠️ ตอนเริ่ม ${esc(A+' '+op+' '+B)} เป็น False ตั้งแต่แรก loop จึง<b>ไม่ทำงานเลย</b></div>`;
    else{
      h+=`<div class="tw"><table><tr><th>รอบที่</th><th>x ตอนตรวจ</th><th>เงื่อนไข</th></tr>${rows.map((v,i)=>`<tr><td>${i+1}</td><td>${v}</td><td class="t">${esc(v+' '+op+' '+B)} → True ทำต่อ</td></tr>`).join('')}${inf?'':`<tr><td>-</td><td>${x}</td><td class="f">${esc(x+' '+op+' '+B)} → False ออกจาก loop</td></tr>`}</table></div>`;
      h+=inf?'<div class="box err">❌ วนเกิน 30 รอบแล้วยังไม่จบ = <b>infinite loop</b> ตรวจว่าการเปลี่ยนค่า (③) ทำให้ x เข้าใกล้จุดที่เงื่อนไขเป็น False จริงหรือไม่</div>':`<div class="box good">วนทั้งหมด <b>${rows.length}</b> รอบ หลังจบ loop x = <b>${x}</b></div>`;
    }
    o.innerHTML=h;
  };
  host.querySelectorAll('input,select').forEach(x=>x.oninput=upd);upd();
}
function mkListBox(host){
  host.innerHTML=`<h3 style="margin-top:0">🧪 ลองเล่น: index และการตัดช่วง (slice) ของ list</h3><p>พิมพ์สมาชิกของ list (คั่นด้วยเว้นวรรค ไม่เกิน 10 ตัว) แล้วลองพิมพ์สิ่งที่อยู่ใน <code>a[ ]</code> เช่น <code>0</code> <code>2</code> <code>-1</code> <code>-2</code> <code>1:3</code> <code>:2</code> <code>2:</code> <code>10</code></p>
  <div class="row"><label>สมาชิกใน list<input class="txt v" style="width:290px" value="apple banana cherry durian egg"></label><label>a[ ... ]<input class="txt x" value="1"></label></div><div class="out"></div>`;
  const rep=s=>/^-?\d+(\.\d+)?$/.test(s)?s:`'${s}'`;
  const upd=()=>{
    const items=$('.v',host).value.trim().split(/\s+/).filter(Boolean).slice(0,10);
    const ex=$('.x',host).value.trim(),o=$('.out',host),n=items.length;
    if(!n){o.innerHTML='<div class="box warn">พิมพ์สมาชิกอย่างน้อย 1 ตัว</div>';return;}
    const sel=new Set();let res='',bad='',kind='',m;
    if((m=/^(-?\d+)?\s*:\s*(-?\d+)?$/.exec(ex))){
      const fix=(v,d)=>{if(v===undefined)return d;let x=+v;if(x<0)x+=n;return Math.min(Math.max(x,0),n);};
      const st=fix(m[1],0),en=fix(m[2],n),part=[];
      for(let i=st;i<en;i++){sel.add(i);part.push(rep(items[i]));}
      res='['+part.join(', ')+']';kind='slice';
    }else if(/^-?\d+$/.test(ex)){
      const i=+ex;
      if(i<-n||i>=n)bad=`❌ IndexError: list index out of range<br>list นี้มี ${n} ตัว ใช้ index ได้แค่ 0 ถึง ${n-1} (หรือ -1 ถึง -${n})`;
      else{const r=i<0?i+n:i;sel.add(r);res=rep(items[r]);kind='index';}
    }else bad='ใส่ได้เฉพาะเลข index เช่น 2 หรือ -1 หรือช่วง เช่น 1:3';
    let h=`<pre class="show">a = [${esc(items.map(rep).join(', '))}]</pre><div class="tw"><div class="mrow">${items.map((v,i)=>`<div class="mc ${sel.has(i)?'hl':''}"><div class="mi">[${i}]</div><div class="mb">${esc(rep(v))}</div><div class="mn">[${i-n}]</div></div>`).join('')}</div></div><div class="tlabel">ตัวเลขสีน้ำเงิน = index ปกติ (นับจาก 0) · ตัวเลขสีม่วง = index ติดลบ (นับจากท้าย) · len(a) = ${n}</div>`;
    if(bad)h+=`<div class="box err">${bad}</div>`;
    else h+=`<div class="box good"><code>a[${esc(ex)}]</code> → <b>${esc(res)}</b>${kind==='slice'?'<br>slice <code>a[เริ่ม:หยุด]</code> เอาตั้งแต่ index เริ่ม ถึง<b>ก่อน</b> index หยุด (เหมือน range) ได้ผลเป็น list ใหม่เสมอ และถ้าเกินขอบจะไม่ error':''}</div>`;
    o.innerHTML=h;
  };
  host.querySelectorAll('input').forEach(x=>x.oninput=upd);upd();
}

 learn:C`<p>ถ้าต้องพิมพ์ <code>print</code> ซ้ำ 100 ครั้ง ไม่ต้องเขียน 100 บรรทัด ใช้ <b>loop (การวนซ้ำ)</b> แทน 🔁</p>
 <pre class="show">for ตัวแปร in ลำดับ:
    คำสั่งที่ทำซ้ำ          ← ย่อหน้า = อยู่ใน loop</pre>
 <p>รอบแรก <code>ตัวแปร</code> จะเป็นค่าแรกของลำดับ รอบถัดไปเป็นค่าถัดไป ไปเรื่อยๆ จนหมด</p>
 <h3>range() สร้างลำดับตัวเลข</h3>
 <div class="tw"><table><tr><th>เขียน</th><th>ได้ตัวเลข</th><th>จำนวนรอบ</th></tr>
 <tr><td><code>range(5)</code></td><td>0, 1, 2, 3, 4</td><td>5</td></tr>
 <tr><td><code>range(1, 6)</code></td><td>1, 2, 3, 4, 5</td><td>5</td></tr>
 <tr><td><code>range(0, 11, 2)</code></td><td>0, 2, 4, 6, 8, 10</td><td>6</td></tr>
 <tr><td><code>range(10, 0, -1)</code></td><td>10, 9, 8, …, 1</td><td>10</td></tr></table></div>
 <div class="box warn"><b>กฎทอง:</b> range <b>ไม่รวมค่า stop</b> ถ้าต้องการ 1 ถึง n ต้องเขียน <code>range(1, n + 1)</code></div>
 <h3>วนตามตัวอักษรในข้อความก็ได้</h3>
 <pre class="show">for ch in "HELLO":
    print(ch)            # H, E, L, L, O ทีละบรรทัด</pre>
 <h3>รูปแบบ "สะสมค่า" (accumulator) ใช้บ่อยที่สุด</h3>
 <pre class="show">total = 0                 ← ① ตั้งค่าเริ่มต้นไว้ "นอก" loop
for i in range(1, 6):
    total = total + i     ← ② สะสมค่าทีละรอบ
print(total)              ← ③ แสดงผล "หลัง" loop จบ (ชิดซ้าย)</pre>
 <p>💡 เทียบกับภาษาซี: <code>for (i = 1; i &lt;= 5; i++)</code> เขียนใน Python เป็น <code>for i in range(1, 6):</code></p>`,

{name:'4 while',title:'ขั้นที่ 4: while loop, break และ continue',
 widgets:[{type:'while'}],
 learn:C`<p><code>while</code> วนซ้ำ<b>ตราบเท่าที่เงื่อนไขยังเป็น True</b> เหมาะกับงานที่<b>ไม่รู้จำนวนรอบล่วงหน้า</b> เช่น วนถามรหัสผ่านจนกว่าจะถูก</p>

 <div class="box err"><b>Infinite loop (วนไม่รู้จบ):</b> ถ้าลืมข้อ ③ หรือเปลี่ยนค่าผิดทิศ เงื่อนไขจะเป็น True ตลอดไป ในเว็บนี้โปรแกรมจะถูกหยุดให้อัตโนมัติ แต่ในเครื่องจริงต้องกด <b>Ctrl+C</b> เพื่อหยุดเอง</div>
 <div class="tw"><table><tr><th></th><th><code>for</code></th><th><code>while</code></th></tr>
 <tr><td>เหมาะกับ</td><td>รู้จำนวนรอบ หรือวนตามสมาชิกของ list / ข้อความ</td><td>ไม่รู้จำนวนรอบ วนจนกว่าเงื่อนไขจะเปลี่ยน</td></tr>
 <tr><td>ตัวอย่าง</td><td>สูตรคูณแม่ 1 ถึง 12</td><td>เกมทายเลข, ถามรหัสผ่าน, รับค่าจนกว่าจะพิมพ์ 0</td></tr></table></div>
 <h3>break และ continue</h3>
 <div class="tw"><table><tr><th>คำสั่ง</th><th>ผล</th></tr>
 <tr><td><code>break</code></td><td>ออกจาก loop ทันที</td></tr>
 <tr><td><code>continue</code></td><td>ข้ามคำสั่งที่เหลือของรอบนี้ แล้วไปเริ่มรอบถัดไป</td></tr></table></div>
 <h3>รูปแบบ while True + break</h3>
 <pre class="show">while True:                 ← วนไปเรื่อยๆ
    x = int(input())
    if x == 0:
        break               ← ทางออกเดียวของ loop
    ...</pre>
 <p>💡 Python ไม่มี <code>do-while</code> แบบภาษาซี ใช้ <code>while True:</code> + <code>break</code> แทน</p>`,

{name:'5 list',title:'ขั้นที่ 5: list เก็บข้อมูลหลายค่าในตัวแปรเดียว',

 <pre class="show">scores = [80, 65, 90, 72]
index:     0   1   2   3       ← เริ่มนับจาก 0

 <div class="tw"><table><tr><th>เขียน</th><th>ผล / ความหมาย</th></tr>
 <tr><td><code>scores[0]</code></td><td>80 (ตัวแรก)</td></tr>
 <tr><td><code>scores[-1]</code></td><td>72 (ตัวสุดท้าย)</td></tr>
 <tr><td><code>scores[1] = 70</code></td><td>แก้ค่าตัวที่ index 1</td></tr>
 <tr><td><code>len(scores)</code></td><td>4 (จำนวนสมาชิก)</td></tr>
 <tr><td><code>scores[1:3]</code></td><td>[65, 90] (ตัดช่วง ไม่รวมตัวท้าย)</td></tr>
 <tr><td><code>empty = []</code></td><td>list ว่าง ไว้เติมทีหลัง</td></tr></table></div>
 <h3>คำสั่งของ list ที่ใช้บ่อย</h3>
 <div class="tw"><table><tr><th>คำสั่ง</th><th>ทำอะไร</th></tr>
 <tr><td><code>a.append(x)</code></td><td>เพิ่ม x ต่อท้าย</td></tr>
 <tr><td><code>a.insert(i, x)</code></td><td>แทรก x ที่ตำแหน่ง i</td></tr>
 <tr><td><code>a.remove(x)</code></td><td>ลบค่า x (ตัวแรกที่เจอ)</td></tr>
 <tr><td><code>a.pop()</code></td><td>ดึงตัวสุดท้ายออกมา</td></tr>
 <tr><td><code>a.sort()</code> / <code>a.reverse()</code></td><td>เรียงน้อยไปมาก / กลับลำดับ</td></tr>
 <tr><td><code>x in a</code></td><td>True ถ้ามี x อยู่ใน list</td></tr>
 <tr><td><code>sum(a)</code> <code>max(a)</code> <code>min(a)</code></td><td>ผลรวม ค่ามากสุด ค่าน้อยสุด</td></tr></table></div>
 <div class="box warn"><b>ระวัง:</b> list ที่มี n ตัว ใช้ index ได้แค่ <b>0 ถึง n-1</b> ถ้าเกินจะเกิด <code>IndexError</code> และอย่าเขียน <code>a = a.append(x)</code> เพราะ append แก้ list เดิมโดยตรงและให้ผลเป็น <code>None</code></div>
 <p>💡 ต่างจากอาร์เรย์ภาษาซี: list <b>ยืด-หดได้</b> (append, remove), รู้ความยาวตัวเองด้วย <code>len()</code> และเก็บข้อมูลต่างชนิดปนกันได้</p>`,

 mission:{title:'ค่ามากสุดอยู่ตำแหน่งไหน',task:C`<p>รับจำนวน <code>n</code> แล้วรับตัวเลขอีก n ค่า (บรรทัดละค่า) ใส่ list จากนั้นหา<b>ค่ามากสุด</b>และ <b>index</b> ของมัน ถ้าค่ามากสุดซ้ำกันให้ตอบ index แรก <b>ห้ามใช้ max()</b> (ฝึกหาเอง)</p>`,

{name:'7 def',title:'ขั้นที่ 7: สร้างฟังก์ชันเองด้วย def',
 learn:C`<p>คุณใช้ฟังก์ชันมาตลอดแล้ว เช่น <code>print()</code> <code>len()</code> <code>input()</code> ตอนนี้ถึงเวลา<b>สร้างเอง</b> 🛠️</p>

 <p>คลิกแต่ละบรรทัดด้านล่าง เพื่อดูว่าเกิดอะไรขึ้น</p>`,

  {c:'    area = width * height',e:'ย่อหน้า = เนื้อหาของฟังก์ชัน <code>area</code> เป็น<b>ตัวแปรภายใน (local)</b> ใช้ได้เฉพาะในฟังก์ชันนี้ พอฟังก์ชันจบก็หายไป'},

  {c:'print(a)',e:'แสดงผล <b>20</b>'},

 learn2:C`<h3>return กับ print ต่างกันอย่างไร (สำคัญมาก!)</h3>

/* =====================================================================
   ส่วนที่ 6: ระบบแสดงหน้า
   ===================================================================== */
let cur=0;
function renderDots(){
  $('#steps').innerHTML=STEPS.map((s,i)=>`<button class="dot ${i===cur?'cur':''} ${progress['w'+i]?'done':''}" data-i="${i}">${progress['w'+i]?'✅ ':''}${s.name}</button>`).join('');
  document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){
  cur=i;const S=STEPS[i];
  let h=`<div class="card learn"><h2>${S.title}</h2>${S.learn}${S.annot?'<div id="an"></div>':''}${S.learn2||''}</div>`;
  (S.widgets||[]).forEach((w,k)=>{h+=`<div class="card"><div id="wd${k}"></div></div>`;});
  S.labs.forEach((l,k)=>{h+=`<div class="card"><h3 style="margin-top:0">🧪 ลองรันดู${S.labs.length>1?' ตัวอย่างที่ '+(k+1):''}</h3><p>${l.tip}</p><div id="lab${k}"></div></div>`;});
  h+='<div class="card mission" id="ms"></div><div class="card quiz" id="qz"></div>';
  if(S.last)h+=`<div class="card fin"><h2>🎉 จบ Python ภาค 2 แล้ว!</h2><p>ตอนนี้คุณเขียนโปรแกรมที่ <b>ตัดสินใจ</b> (<code>if / elif / else</code>), <b>ทำซ้ำ</b> (<code>for</code>, <code>while</code>), <b>เก็บข้อมูลหลายค่า</b> (<code>list</code>) และ<b>แยกงานเป็นฟังก์ชัน</b> (<code>def</code>) ได้แล้ว 🌟</p><p>เรื่องที่น่าเรียนต่อ: <code>dict</code> (เก็บข้อมูลแบบมีชื่อกำกับ), การจัดการข้อความ (string methods), การอ่าน-เขียนไฟล์, โมดูล <code>random</code> และ <code>turtle</code> หรือ MicroPython สำหรับควบคุมบอร์ดไมโครคอนโทรลเลอร์</p></div>`;
  h+=`<div class="nav"><button class="btn" id="pv" ${i===0?'disabled':''}>◀ ขั้นก่อนหน้า</button><button class="btn go" id="nx" ${i===STEPS.length-1?'disabled':''}>ขั้นต่อไป ▶</button></div>`;
  $('#page').innerHTML=h;
  if(S.annot)mkAnnot($('#an'),S.annot);
  (S.widgets||[]).forEach((w,k)=>{
    const el=$('#wd'+k);
    if(w.type==='shell')mkShell(el,w);
    else if(w.type==='logic')mkLogic(el);
    else if(w.type==='range')mkRange(el);
    else if(w.type==='while')mkWhileSim(el);
    else if(w.type==='list')mkListBox(el);
  });
  S.labs.forEach((l,k)=>mkEditor($('#lab'+k),l));
  mkMission($('#ms'),S.mission,'w'+i,renderDots);
  mkQuiz($('#qz'),S.quiz);
  $('#pv').onclick=()=>go(i-1);
  $('#nx').onclick=()=>go(i+1);
  renderDots();
  window.scrollTo(0,0);
}
$('#rstp').onclick=()=>{if(confirm('ต้องการล้างความก้าวหน้าทั้งหมดหรือไม่')){progress={};saveP();go(cur);}};
go(0);
initPy();
</script>
