<div class="wrap">
  <h1>🐍 เรียน Python เบื้องต้น: จาก print() ถึงตัวแปร</h1>
  <p class="sub">ทำทีละขั้น: อ่าน → ลองเล่น → ลองรัน → ทำภารกิจ → ตอบคำถาม (รัน Python ตัวจริงในเบราว์เซอร์)</p>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
/* =====================================================================
   ส่วนที่ 1: เชื่อมต่อ Python (Pyodide)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let py=null,pyReady=false,pyRun=null,pyShell=null,pyShellReset=null;

const RUNNER=String.raw`
import sys, io, json, builtins
from contextlib import redirect_stdout

_SKIP = ('module', 'function', 'builtin_function_or_method', 'type', 'method')

def _snap(g, skip_obj):
    d = {}
    for k, v in list(g.items()):
        if k.startswith('__') or v is skip_obj:
            continue
        tn = type(v).__name__
        if tn in _SKIP:
            continue
        try:
            r = repr(v)
        except Exception:
            r = '?'
        if len(r) > 80:
            r = r[:77] + '...'
        d[k] = [tn, r]
    return d

def _err_info(e):
    line = 0
    tb = e.__traceback__
    while tb is not None:
        if tb.tb_frame.f_code.co_filename == '<student>':
            line = tb.tb_lineno
        tb = tb.tb_next
    return {'kind': 'run', 'type': type(e).__name__, 'msg': str(e), 'line': line}

def _run(src, inputs_json):
    inputs = json.loads(inputs_json)
    out = io.StringIO()
    steps = []
    g = {'__name__': '__main__', '__builtins__': builtins}
    def _input(prompt=''):
        out.write('\x03' + str(prompt) + '\x04')
        if not inputs:
            raise EOFError('__NO_INPUT__')
        v = inputs.pop(0)
        out.write('\x01' + v + '\x02\n')
        return v
    g['input'] = _input
    count = [0]
    def _tracer(frame, event, arg):
        if frame.f_code.co_filename != '<student>':
            return None
        if event == 'line':
            count[0] += 1
            if count[0] > 20000:
                raise RuntimeError('__STEP_LIMIT__')
            if len(steps) < 800:
                steps.append({'line': frame.f_lineno, 'vars': _snap(frame.f_globals, _input), 'out': len(out.getvalue())})
        return _tracer
    res = {'err': None}
    try:
        code = compile(src, '<student>', 'exec')
    except SyntaxError as e:
        res['err'] = {'kind': 'syntax', 'type': type(e).__name__, 'msg': str(e.msg), 'line': e.lineno or 0, 'offset': e.offset or 0, 'text': (e.text or '').rstrip('\r\n')}
        res['out'] = ''
        res['steps'] = []
        res['final'] = {}
        return json.dumps(res, ensure_ascii=False)
    old = sys.gettrace()
    try:
        with redirect_stdout(out):
            sys.settrace(_tracer)
            try:
                exec(code, g)
            finally:
                sys.settrace(old)
    except SystemExit:
        pass
    except BaseException as e:
        res['err'] = _err_info(e)
    res['out'] = out.getvalue()
    res['steps'] = steps
    res['final'] = _snap(g, _input)
    return json.dumps(res, ensure_ascii=False)

_shells = {}

def _shell(sid, line):
    g = _shells.get(sid)
    if g is None:
        g = {'__name__': '__main__', '__builtins__': builtins}
        _shells[sid] = g
    def _noinput(prompt=''):
        raise RuntimeError('__SHELL_INPUT__')
    g['input'] = _noinput
    out = io.StringIO()
    err = None
    count = [0]
    def _tr(frame, event, arg):
        if frame.f_code.co_filename != '<shell>':
            return None
        if event == 'line':
            count[0] += 1
            if count[0] > 20000:
                raise RuntimeError('__STEP_LIMIT__')
        return _tr
    old = sys.gettrace()
    try:
        with redirect_stdout(out):
            try:
                code = compile(line, '<shell>', 'eval')
                is_eval = True
            except SyntaxError:
                code = compile(line, '<shell>', 'exec')
                is_eval = False
            v = None
            sys.settrace(_tr)
            try:
                if is_eval:
                    v = eval(code, g)
                else:
                    exec(code, g)
            finally:
                sys.settrace(old)
            if v is not None:
                print(repr(v))
    except BaseException as e:
        msg = e.msg if isinstance(e, SyntaxError) else str(e)
        err = {'type': type(e).__name__, 'msg': str(msg)}
    return json.dumps({'out': out.getvalue(), 'err': err}, ensure_ascii=False)

def _shell_reset(sid):
    _shells.pop(sid, None)
`;

async function initPy(){
  const st=$('#pystatus');
  st.className='status st-load';
  st.innerHTML='⏳ กำลังโหลด Python ... (ครั้งแรกใช้เวลาประมาณ 10-30 วินาที และต้องต่ออินเทอร์เน็ต) ระหว่างนี้อ่านเนื้อหาไปก่อนได้เลย';
  try{
    if(typeof loadPyodide!=='function')throw new Error('โหลดไฟล์ pyodide.js ไม่ได้ (ตรวจการเชื่อมต่ออินเทอร์เน็ต)');
    py=await loadPyodide();
    py.runPython(RUNNER);
    pyRun=py.globals.get('_run');
    pyShell=py.globals.get('_shell');
    pyShellReset=py.globals.get('_shell_reset');
    const ver=py.runPython('import sys; sys.version.split()[0]');
    pyReady=true;
    st.className='status st-ok';
    st.innerHTML=`✅ Python ${esc(ver)} พร้อมใช้งานแล้ว กดปุ่ม ▶ รันโปรแกรม หรือพิมพ์ใน Python Shell ได้เลย`;
  }catch(e){
    st.className='status st-err';
    st.innerHTML=`❌ โหลด Python ไม่สำเร็จ: ${esc(e.message||e)} <button class="btn" id="retry">ลองโหลดใหม่</button>`;
    $('#retry').onclick=()=>location.reload();
  }
}
function runPy(src,inputText){
  const lines=(inputText||'').replace(/\r/g,'').split('\n');
  while(lines.length&&lines[lines.length-1]==='')lines.pop();
  try{return JSON.parse(pyRun(src,JSON.stringify(lines)));}
  catch(e){return{out:'',steps:[],final:{},err:{kind:'run',type:'InternalError',msg:String(e),line:0}};}
}

/* =====================================================================
   ส่วนที่ 2: แปลข้อผิดพลาดเป็นภาษาไทย
   ===================================================================== */
const PY_KW=['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield'];
const BUILTIN_NAMES=['print','input','int','float','str','bool','type','len','round','abs','max','min','sum','range','list','True','False','None'];
function thaiErr(e,names){
  const t=e.type||'Error',m=e.msg||'';let k;
  const R=(h,d)=>({h,d});
  if(m==='__NO_INPUT__')return R('ไม่มีข้อมูลให้ input() อ่าน','โปรแกรมเรียก <code>input()</code> แต่ช่อง "ข้อมูลที่จะพิมพ์ให้ input()" ไม่มีค่าเหลือแล้ว ให้พิมพ์ค่าเพิ่ม <b>บรรทัดละ 1 ค่า</b> ตามจำนวนครั้งที่เรียก input()');
  if(m==='__STEP_LIMIT__')return R('โปรแกรมทำงานนานผิดปกติ','โปรแกรมทำงานเกิน 20,000 ขั้นตอน อาจวนซ้ำไม่รู้จบ (infinite loop) จึงถูกหยุดไว้');
  if(m==='__SHELL_INPUT__')return R('ใช้ input() ใน Shell นี้ไม่ได้','ให้ลองคำสั่ง input() ในกล่อง "ลองรันดู" แทน');
  if(t==='IndentationError'||t==='TabError'){
    if(/unexpected indent/.test(m))return R('มีการเว้นวรรคหน้าบรรทัดเกินมา','Python ใช้การย่อหน้า (ช่องว่างหน้าบรรทัด) เป็นส่วนหนึ่งของไวยากรณ์ คำสั่งทั่วไปต้อง<b>ชิดซ้าย</b> ให้ลบช่องว่างหน้าบรรทัดนี้ออก');
    return R('การย่อหน้าไม่ถูกต้อง','ตรวจช่องว่างหน้าบรรทัด คำสั่งในบทนี้ทุกบรรทัดต้องชิดซ้าย');
  }
  if(t==='SyntaxError'){
    if(/unterminated triple-quoted/.test(m))return R('ลืมปิดข้อความแบบ """ """','ข้อความที่เปิดด้วย """ ต้องปิดด้วย """ เช่นกัน');
    if(/unterminated string|EOL while scanning/.test(m))return R('ลืมปิดเครื่องหมายคำพูด','ข้อความที่เปิดด้วย " หรือ \' ต้องปิดด้วยเครื่องหมาย<b>แบบเดียวกัน</b>ในบรรทัดเดียวกัน เช่น <code>print("Hi")</code> ถ้าในข้อความมี \' อยู่ข้างใน เช่น It\'s ให้ครอบด้วย " แทน');
    if((k=/'(.)' was never closed/.exec(m)))return R(`ลืมปิดวงเล็บ ${esc(k[1])}`,'มีวงเล็บเปิด แต่ไม่มีวงเล็บปิด ให้นับวงเล็บเปิดกับวงเล็บปิดให้มีจำนวนเท่ากัน');
    if((k=/unmatched '(.)'/.exec(m)))return R(`มีวงเล็บปิด ${esc(k[1])} เกินมา`,'วงเล็บปิดมากกว่าวงเล็บเปิด ให้ลบตัวที่เกินออก');
    if(/does not match opening parenthesis/.test(m))return R('วงเล็บเปิดกับปิดไม่ตรงคู่กัน','เช่น เปิดด้วย ( แต่ปิดด้วย ] ให้ใช้แบบเดียวกัน');
    if(/Missing parentheses in call to 'print'/.test(m))return R('print ต้องมีวงเล็บ','Python 3 ต้องเขียน <code>print("ข้อความ")</code> (แบบไม่มีวงเล็บเป็นของ Python 2 รุ่นเก่า)');
    if(/invalid decimal literal|invalid imaginary literal/.test(m))return R('มีตัวเลขติดกับตัวอักษร','มักเกิดจากตั้งชื่อตัวแปร<b>ขึ้นต้นด้วยตัวเลข</b> เช่น <code>2score</code> (ห้าม ต้องเป็น <code>score2</code>) หรือลืมเครื่องหมายคูณ เช่น <code>2x</code> ต้องเขียน <code>2 * x</code>');
    if(/cannot assign to literal/.test(m))return R('ด้านซ้ายของ = ต้องเป็นชื่อตัวแปร','เครื่องหมาย = หมายถึง "นำค่าทางขวา ไปเก็บในตัวแปรทางซ้าย" จึงต้องเขียน <code>x = 5</code> ไม่ใช่ <code>5 = x</code>');
    if((k=/cannot assign to (True|False|None)/.exec(m)))return R(`'${k[1]}' เป็นคำสงวน`,'ใช้เป็นชื่อตัวแปรไม่ได้ ให้เปลี่ยนชื่อ');
    if(/cannot assign to/.test(m))return R('ด้านซ้ายของ = ต้องเป็นชื่อตัวแปรเดี่ยวๆ','เช่น <code>total = a + b</code> ไม่ใช่ <code>a + b = total</code> และชื่อตัวแปร<b>ห้ามมีเครื่องหมาย -</b> หรือช่องว่าง (ใช้ _ แทน เช่น <code>my_score</code>)');
    if(/Perhaps you forgot a comma/.test(m))return R('น่าจะลืมเครื่องหมายจุลภาค ( , ) หรือเขียนเครื่องหมายผิด','ถ้าจะแสดงหลายค่าใน print ต้องคั่นด้วย , เช่น <code>print("Total:", total)</code> และการคูณต้องใช้ <code>*</code> ไม่ใช่ x');
    if(/invalid character/.test(m))return R('มีอักขระที่ Python ไม่รู้จัก','มักเกิดจากคัดลอกโค้ดจาก Word หรือเว็บ ทำให้ได้เครื่องหมายคำพูดแบบโค้ง “ ” หรือ ‘ ’ ให้ลบแล้วพิมพ์ " หรือ \' ใหม่ด้วยแป้นพิมพ์');
    if(/incomplete input|unexpected EOF/.test(m))return R('คำสั่งยังเขียนไม่จบ','ตรวจวงเล็บและเครื่องหมายคำพูดว่าปิดครบหรือไม่');
    const tx=(e.text||'').trim();

    if(/^[^\s"'#=(]+\s+[^\s"'#=(]+\s*=/.test(tx))return R('ชื่อตัวแปรห้ามมีช่องว่าง','ถ้าชื่อมีหลายคำให้เชื่อมด้วย _ เช่น <code>total_price</code>');
    return R('เขียนผิดไวยากรณ์','Python อ่านบรรทัดนี้ไม่เข้าใจ ลองตรวจ ① เครื่องหมายคำพูดและวงเล็บครบคู่ ② ชื่อตัวแปรไม่มีช่องว่างหรือขีด - ③ ไม่ได้ใช้คำสงวน ④ บางครั้งจุดผิดจริงอยู่ที่<b>บรรทัดก่อนหน้า</b>');
  }
  if(t==='NameError'){
    k=/name '(.+?)' is not defined/.exec(m);const n=k?k[1]:'?';
    const sim=[...(names||[]),...BUILTIN_NAMES].find(x=>x!==n&&x.toLowerCase()===n.toLowerCase());
    if(sim)return R(`ไม่รู้จักชื่อ '${esc(n)}' คุณหมายถึง '${esc(sim)}' หรือเปล่า?`,`Python <b>แยกตัวพิมพ์เล็ก-ใหญ่</b> (case-sensitive) <code>${esc(n)}</code> กับ <code>${esc(sim)}</code> จึงเป็นคนละชื่อกัน`);
    return R(`ไม่รู้จักชื่อ '${esc(n)}'`,`สาเหตุที่พบบ่อย: ① ใช้ตัวแปรก่อนกำหนดค่า (ต้องมี <code>${esc(n)} = ...</code> อยู่<b>ก่อน</b>บรรทัดนี้) ② สะกดชื่อผิด ③ ถ้าตั้งใจให้เป็นข้อความ ต้องครอบด้วยเครื่องหมายคำพูด เช่น <code>"${esc(n)}"</code>`);
  }
  if(t==='TypeError'){
    if(/can only concatenate str \(not "(\w+)"\) to str/.test(m))return R('นำข้อความ (str) มา + กับตัวเลขไม่ได้','Python ไม่เดาให้ว่าจะต่อข้อความหรือบวกเลข ทางแก้: แปลงตัวเลขเป็นข้อความด้วย <code>str()</code> หรือใช้ , ใน print หรือใช้ f-string<br>⚠️ ถ้าค่ามาจาก <code>input()</code> อย่าลืมว่า input() ให้ค่าเป็น<b>ข้อความเสมอ</b> ต้องครอบด้วย <code>int()</code> หรือ <code>float()</code> ก่อนนำไปคำนวณ');
    if((k=/unsupported operand type\(s\) for (.+?): '(\w+)' and '(\w+)'/.exec(m))){
      if(k[2]==='str'||k[3]==='str')return R(`คำนวณ ${esc(k[1])} ระหว่างข้อความกับตัวเลขไม่ได้`,'ค่าหนึ่งเป็นข้อความ (str) มักมาจาก <code>input()</code> ที่ยังไม่ได้แปลง ให้แปลงด้วย <code>int()</code> หรือ <code>float()</code> ก่อน เช่น <code>age = int(input())</code>');
      return R(`ใช้เครื่องหมาย ${esc(k[1])} กับข้อมูลชนิด ${esc(k[2])} และ ${esc(k[3])} ไม่ได้`,'ตรวจชนิดข้อมูลของค่าทั้งสองข้างด้วย <code>type()</code>');
    }
    if(/can't multiply sequence by non-int/.test(m))return R('คูณข้อความได้เฉพาะกับจำนวนเต็ม','<code>"Ha" * 3</code> ได้ แต่ <code>"Ha" * 2.5</code> หรือ <code>"5" * "2"</code> ไม่ได้ ถ้าต้องการคำนวณให้แปลงข้อความเป็นตัวเลขก่อน');
    if((k=/'(\w+)' object is not callable/.exec(m)))return R(`ค่าชนิด ${esc(k[1])} ถูกเรียกเหมือนเป็นคำสั่ง`,'มักเกิดจาก ① ตั้งชื่อตัวแปรทับชื่อคำสั่ง เช่น <code>print = 5</code> แล้วเรียก print() อีก ② ลืมเครื่องหมาย * เช่น <code>2(3 + 4)</code> ต้องเขียน <code>2 * (3 + 4)</code>');
    return R('ใช้ข้อมูลผิดชนิด','ตรวจว่าค่าที่ส่งให้คำสั่งหรือที่นำมาคำนวณเป็นชนิดที่ถูกต้อง');
  }
  if(t==='ValueError'){
    if((k=/invalid literal for int\(\) with base 10: '(.*)'/.exec(m))){
      if(/^\s*[-+]?\d*\.\d+\s*$/.test(k[1]))return R(`int() แปลงข้อความทศนิยม '${esc(k[1])}' ไม่ได้`,'ถ้าต้องการรับทศนิยมให้ใช้ <code>float()</code> แทน หรือใช้ <code>int(float(...))</code> ถ้าต้องการตัดทศนิยมทิ้ง');
      return R(`'${esc(k[1])}' ไม่ใช่จำนวนเต็ม`,'int() แปลงได้เฉพาะข้อความที่เป็นตัวเลขจำนวนเต็ม เช่น "42" ตรวจข้อมูลที่พิมพ์ให้โปรแกรมด้วย');
    }
    if((k=/could not convert string to float: '(.*)'/.exec(m)))return R(`'${esc(k[1])}' ไม่ใช่ตัวเลข`,'float() แปลงได้เฉพาะข้อความที่เป็นตัวเลข เช่น "3.5" หรือ "7"');
    return R('ค่าที่ให้มาไม่ถูกต้อง','ชนิดถูกแต่ค่าใช้ไม่ได้ ตรวจข้อมูลที่ส่งให้คำสั่ง');
  }
  if(t==='ZeroDivisionError')return R('หารด้วยศูนย์ไม่ได้','ทั้ง / // และ % ห้ามมีตัวหารเป็น 0 (ทางคณิตศาสตร์ไม่มีความหมาย)');
  if(t==='OverflowError')return R('ตัวเลขใหญ่เกินไป','ผลลัพธ์ทศนิยมใหญ่เกินกว่าที่คอมพิวเตอร์เก็บได้');
  if(t==='EOFError')return R('ไม่มีข้อมูลให้ input() อ่าน','พิมพ์ค่าเพิ่มในช่องข้อมูล บรรทัดละ 1 ค่า');
  return R(`เกิดข้อผิดพลาดชนิด ${esc(t)}`,'อ่านข้อความภาษาอังกฤษด้านล่างประกอบ');
}
function engMsg(e){

  return `<div class="eng">Python บอกว่า: <code>${esc(e.type)}: ${esc(m)}</code></div>`;

function errBox(e,names){
  const t=thaiErr(e,names);
  const syn=e.kind==='syntax';
  let h=`<div class="box err"><b>${syn?'❌ เขียนผิดไวยากรณ์ โปรแกรมยังไม่ได้เริ่มทำงานเลย':'❌ โปรแกรมหยุดทำงานกลางทาง'}</b>${e.line?` · <b>บรรทัดที่ ${e.line}</b>`:''}<br>🧩 <b>${t.h}</b><br>${t.d}`;
  if(syn&&e.text){
    const caret=' '.repeat(Math.max(0,(e.offset||1)-1))+'^';
    h+=`<pre class="show">${esc(e.text)}\n${esc(caret)}</pre>`;
  }
  return h+engMsg(e)+'</div>';
}
function lint(src){
  const w=[];
  src.split('\n').forEach((l,i)=>{
    const code=l.replace(/#.*$/,'');
    if(/["'][^"'\n]*\{[A-Za-z_]\w*[^"'\n]*\}[^"'\n]*["']/.test(code)&&!/[fF]["'][^"'\n]*\{/.test(code))
      w.push({line:i+1,msg:'ในข้อความมี {ชื่อตัวแปร} แต่ไม่มีตัว f นำหน้าเครื่องหมายคำพูด Python จึงแสดงวงเล็บปีกกาออกมาตรงๆ ถ้าต้องการแทนค่าตัวแปร ให้เขียนเป็น f"..."'});
    const m=/^\s*(print|input|int|float|str|type|len|sum|max|min|round)\s*=[^=]/.exec(code);
    if(m)w.push({line:i+1,msg:`ตั้งชื่อตัวแปรว่า ${m[1]} ซ้ำกับคำสั่งของ Python ทำให้ใช้ ${m[1]}() ไม่ได้อีก ควรเปลี่ยนชื่อ`});
  });
  return w;
}

  h+=r.err?errBox(r.err,names):'<div class="box good">✅ โปรแกรมทำงานสำเร็จ</div>';

function mkStepper(host,r,src){
  const lines=src.split('\n');
  const outArr=Array.from(r.out||'');
  const views=r.steps.map(s=>({line:s.line,vars:s.vars,out:s.out}));
  views.push({line:null,vars:r.final||{},out:outArr.length,end:true});
  const trunc=r.steps.length>=800;
  let k=0;
  host.innerHTML=`<div class="stp-ctl"><button class="btn" data-a="first">⏮ เริ่ม</button><button class="btn" data-a="prev">◀ ย้อน</button><span class="stp-n"></span><button class="btn go" data-a="next">ถัดไป ▶</button><button class="btn" data-a="last">จบ ⏭</button></div>
  <div class="box warn smsg"></div>
  <div class="stp-grid"><div><div class="tlabel">โค้ด (➜ = บรรทัดที่กำลังจะทำ · แถบเขียว = บรรทัดที่เพิ่งทำเสร็จ)</div><div class="scode"></div></div>
  <div><div class="tlabel">📦 ตัวแปรในหน่วยความจำ</div><div class="svars"></div><div class="tlabel">🖥️ หน้าจอ ณ ขั้นนี้</div><div class="term mono sout"></div></div></div>`;
  const draw=()=>{
    const v=views[k],pv=k>0?views[k-1]:null;
    const doneL=pv?pv.line:null,nextL=v.end?null:v.line;
    const badL=(v.end&&r.err)?r.err.line:null;
    $('.scode',host).innerHTML=lines.map((l,i)=>{
      const n=i+1;let c='',a='';
      if(n===badL){c='bad';a='✖';}else if(n===nextL){c='next';a='➜';}else if(n===doneL)c='done';
      return `<div class="sl ${c}"><span class="sa">${a}</span><span class="sn">${n}</span><span>${esc(l)||' '}</span></div>`;
    }).join('');
    const old=pv?pv.vars:{};const changes=[];
    const names=Object.keys(v.vars);
    $('.svars',host).innerHTML=names.length?`<table class="vt"><tr><th>ชื่อ</th><th>ชนิด</th><th>ค่า</th></tr>${names.map(n=>{
      const ty=v.vars[n][0],rep=v.vars[n][1];let cls='',note='';
      if(pv&&!(n in old)){cls='new';note='<span class="tag newv">ใหม่!</span>';changes.push(`สร้างตัวแปร <code>${esc(n)}</code> = <code>${esc(rep)}</code>`);}
      else if(pv&&(old[n][1]!==rep||old[n][0]!==ty)){cls='chg';note=` <span style="font-size:.8rem;color:#92400e">(เดิม ${esc(old[n][1])})</span>`;changes.push(`<code>${esc(n)}</code> เปลี่ยนจาก <code>${esc(old[n][1])}</code> เป็น <code>${esc(rep)}</code>`);}
      return `<tr><td class="${cls}"><code>${esc(n)}</code></td><td class="${cls}"><span class="tag ${esc(ty)}">${esc(ty)}</span></td><td class="${cls} mono">${esc(rep)}${note}</td></tr>`;
    }).join('')}</table>`:'<div class="tlabel">(ยังไม่มีตัวแปร)</div>';
    $('.sout',host).innerHTML=fmtOut(outArr.slice(0,v.out).join(''))||'<span style="color:#64748b">(ว่าง)</span>';
    let msg;
    if(k===0)msg='▶ ยังไม่เริ่มทำงาน ลูกศร ➜ ชี้บรรทัดแรกที่จะทำ กด "ถัดไป" เพื่อให้ Python ทำทีละบรรทัด (ลองทายก่อนกดทุกครั้ง!)';
    else if(v.end&&r.err)msg=`❌ ระหว่างทำบรรทัดที่ ${r.err.line} เกิดข้อผิดพลาด โปรแกรมจึงหยุดทันที บรรทัดที่เหลือไม่ได้ทำงาน`;
    else{
      msg=`✔ ทำบรรทัดที่ ${doneL} เสร็จแล้ว`;
      const shown=v.out>pv.out;
      if(changes.length)msg+=': '+changes.join(', ')+(shown?' และแสดงผลบนหน้าจอ':'');
      else msg+=shown?' (แสดงผลบนหน้าจอ ไม่มีตัวแปรเปลี่ยน)':' (ไม่มีตัวแปรเปลี่ยน)';
      if(v.end)msg+=' · 🏁 จบโปรแกรม';
    }
    if(trunc&&v.end)msg+=' (บันทึกไว้เฉพาะ 800 ขั้นแรก)';
    $('.smsg',host).innerHTML=msg;
    $('.stp-n',host).textContent=`ขั้น ${k} / ${views.length-1}`;
    host.querySelector('[data-a=first]').disabled=k===0;
    host.querySelector('[data-a=prev]').disabled=k===0;
    host.querySelector('[data-a=next]').disabled=k===views.length-1;
    host.querySelector('[data-a=last]').disabled=k===views.length-1;
  };
  host.querySelectorAll('.stp-ctl button').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='first')k=0;else if(a==='prev')k=Math.max(0,k-1);else if(a==='next')k=Math.min(views.length-1,k+1);else k=views.length-1;
    draw();
  });
  draw();
}

function mkEditor(host,cfg){

    setTimeout(()=>showResult(res,runPy(src,inp?inp.value:''),src,!!cfg.trace),10);
  };
  $('.run',host).onclick=run;
  $('.rs',host).onclick=()=>{ta.value=cfg.code;if(inp)inp.value=cfg.input;res.innerHTML='';};
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end');}

  });

      const lbl=`ชุดทดสอบที่ ${i+1}${t.input!==undefined?` (พิมพ์ <code>${esc(t.input).replace(/\n/g,' ⏎ ')}</code>)`:''}`;
      if(r.err){all=false;const te=thaiErr(r.err,Object.keys(r.final||{}));h+=`<li>❌ ${lbl}: ${r.err.kind==='syntax'?'เขียนผิดไวยากรณ์':'โปรแกรมหยุดทำงาน'}${r.err.line?' (บรรทัด '+r.err.line+')':''} · ${te.h}</li>`;return;}
      const got=cleanOut(r.out);const ok=norm(got)===norm(t.expected);if(!ok)all=false;
      h+=`<li>${ok?'✅':'❌'} ${lbl}`;
      if(!ok)h+=`<br>ต้องได้:<pre class="show">${esc(t.expected)}</pre>แต่ได้:<pre class="show">${esc(got)||'(ว่างเปล่า)'}</pre>`;
      h+='</li>';
    });
    h+='</ul>';
    if(all){progress[stepId]=true;saveP();onDone();h='<div class="box good"><b>🎉 ผ่านแล้ว เก่งมาก!</b></div>'+h;}
    else h='<div class="box err"><b>ยังไม่ผ่าน ไม่เป็นไร ลองดูผลเปรียบเทียบแล้วแก้อีกนิด</b></div>'+h;
    cr.innerHTML=h;
  };
  if(progress[stepId])cr.innerHTML='<div class="box good">✅ คุณเคยทำภารกิจนี้ผ่านแล้ว</div>';
}

function mkShell(host,cfg){
  host.innerHTML=`<h3 style="margin-top:0">🐍 ลองเล่น: Python Shell</h3><p>${cfg.tip}</p>
  <div class="shell"><div class="sh-log"></div><div class="sh-in"><span>&gt;&gt;&gt;</span><input class="sh-inp" spellcheck="false" autocomplete="off" placeholder="พิมพ์คำสั่งแล้วกด Enter"></div></div>
  <div class="tlabel">กดปุ่มด้านล่างเพื่อลองคำสั่งตัวอย่าง (ทายผลก่อนกดนะ! ปุ่มลูกศรขึ้น ↑ เรียกคำสั่งเดิมได้)</div><div class="btns sm"></div>`;
  const log=$('.sh-log',host),inp=$('.sh-inp',host),hist=[];let hp=0;
  const add=(cls,html)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;};
  const run=line=>{
    if(!line.trim())return;
    add('p','&gt;&gt;&gt; '+esc(line));hist.push(line);hp=hist.length;
    if(!pyReady){add('e','⏳ รอให้ Python โหลดเสร็จก่อนนะ');return;}
    let r;
    try{r=JSON.parse(pyShell(cfg.id,line));}catch(e){add('e',esc(String(e)));return;}
    if(r.out)add('o',esc(r.out.replace(/\n$/,'')));
    if(r.err){const t=thaiErr(r.err,[]);add('e',`${/^__/.test(r.err.msg)?'':esc(r.err.type)+': '+esc(r.err.msg)+'<br>'}💡 ${t.h}`);}
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){run(inp.value);inp.value='';}
    else if(e.key==='ArrowUp'){if(hp>0){hp--;inp.value=hist[hp];}e.preventDefault();}
    else if(e.key==='ArrowDown'){if(hp<hist.length-1){hp++;inp.value=hist[hp];}else{hp=hist.length;inp.value='';}e.preventDefault();}
  });
  const bar=$('.sm',host);
  cfg.samples.forEach(s=>{const b=document.createElement('button');b.className='btn mono';b.textContent=s;b.onclick=()=>run(s);bar.appendChild(b);});
  const rb=document.createElement('button');rb.className='btn';rb.textContent='🧹 ล้าง Shell';
  rb.onclick=()=>{log.innerHTML='';if(pyReady)pyShellReset(cfg.id);};bar.appendChild(rb);
}
function mkIdent(host){
  host.innerHTML=`<h3 style="margin-top:0">🧪 ลองเล่น: ตั้งชื่อตัวแปรแบบนี้ได้ไหม?</h3><p>ลองพิมพ์ เช่น <code>my_score</code> <code>2score</code> <code>my-score</code> <code>my score</code> <code>class</code> <code>print</code> <code>Score</code> <code>คะแนน</code> <code>_temp1</code></p>
  <input class="txt" style="width:260px" value="my_score" maxlength="40"><ul class="rules"></ul><div class="vd"></div>`;
  const inp=$('input',host),ul=$('.rules',host),vd=$('.vd',host);
  const upd=()=>{
    const v=inp.value;
    const rules=[
      ['ไม่เป็นค่าว่าง',v.length>0],
      ['ขึ้นต้นด้วยตัวอักษร หรือเครื่องหมาย _ (ห้ามขึ้นต้นด้วยตัวเลข)',/^[\p{L}_]/u.test(v)],
      ['มีแค่ตัวอักษร ตัวเลข และ _ (ห้ามมีช่องว่าง - @ # . หรือเครื่องหมายอื่น)',v.length>0&&/^[\p{L}\p{N}\p{M}_]+$/u.test(v)],
      ['ไม่ซ้ำกับคำสงวน เช่น if, for, class, True',v.length>0&&!PY_KW.includes(v)]
    ];
    ul.innerHTML=rules.map(r=>`<li class="${r[1]?'p':'f'}">${r[1]?'✅':'❌'} ${r[0]}</li>`).join('');
    if(!rules.every(r=>r[1])){vd.innerHTML=`<div class="box err"><b>❌ '${esc(v)}' ใช้เป็นชื่อตัวแปรไม่ได้</b> Python จะแจ้ง SyntaxError</div>`;return;}
    const notes=[];
    if(BUILTIN_NAMES.includes(v)&&!['True','False','None'].includes(v))notes.push(`ชื่อนี้ซ้ำกับคำสั่ง <code>${esc(v)}()</code> ของ Python ถ้าตั้งเป็นตัวแปร จะใช้คำสั่งเดิมไม่ได้อีก`);
    if(/[^\x00-\x7f]/.test(v))notes.push('Python 3 ยอมให้ใช้ตัวอักษรไทยได้ แต่<b>ไม่แนะนำ</b> เพราะพิมพ์สลับภาษายาก และหลายเครื่องมือไม่รองรับ ควรใช้ภาษาอังกฤษ');
    if(/[A-Z]/.test(v)&&/^[\x00-\x7f]+$/.test(v))notes.push(`ธรรมเนียมของ Python นิยมตั้งชื่อตัวแปรด้วยตัวพิมพ์เล็กคั่นด้วย _ เช่น <code>${esc(v.replace(/([a-z0-9])([A-Z])/g,'$1_$2').toLowerCase())}</code> และจำไว้ว่า <code>${esc(v)}</code> กับ <code>${esc(v.toLowerCase())}</code> เป็นคนละตัวกัน`);
    vd.innerHTML=notes.length?`<div class="box warn"><b>⚠️ '${esc(v)}' ใช้ได้ แต่...</b><ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`:`<div class="box good"><b>✅ '${esc(v)}' เป็นชื่อตัวแปรที่ดี</b></div>`;
  };
  inp.oninput=upd;upd();
}

{name:'3 คำนวณ',title:'ขั้นที่ 3: ตัวเลขและการคำนวณ',
 widget:{type:'shell',id:'s3',tip:'ใช้ Python เป็นเครื่องคิดเลข ลองกดตัวอย่างทีละปุ่ม เปรียบเทียบผลของ / // และ %',
  samples:['7 + 2','7 / 2','6 / 2','7 // 2','7 % 2','2 ** 10','2 + 3 * 4','(2 + 3) * 4','-7 // 2','0.1 + 0.2','10 / 0']},
 learn:C`<p>Python มีตัวเลข 2 แบบหลัก</p>
 <div class="tw"><table><tr><th>ชนิด</th><th>ความหมาย</th><th>ตัวอย่าง</th></tr>
 <tr><td><code>int</code></td><td>จำนวนเต็ม (integer)</td><td><code>16</code>, <code>-5</code>, <code>1000000</code></td></tr>
 <tr><td><code>float</code></td><td>จำนวนทศนิยม</td><td><code>3.14</code>, <code>-0.5</code>, <code>2.0</code></td></tr></table></div>
 <h3>เครื่องหมายคำนวณ</h3>
 <div class="tw"><table><tr><th>เครื่องหมาย</th><th>ความหมาย</th><th>ตัวอย่าง</th><th>ผล</th></tr>
 <tr><td><code>+</code> <code>-</code></td><td>บวก ลบ</td><td><code>7 - 2</code></td><td>5</td></tr>
 <tr><td><code>*</code></td><td>คูณ (ไม่ใช่ x)</td><td><code>7 * 2</code></td><td>14</td></tr>
 <tr><td><code>/</code></td><td>หาร ได้ทศนิยม<b>เสมอ</b></td><td><code>7 / 2</code> · <code>6 / 2</code></td><td>3.5 · 3.0</td></tr>
 <tr><td><code>//</code></td><td>หารเอาแต่จำนวนเต็ม (ปัดลง)</td><td><code>7 // 2</code></td><td>3</td></tr>
 <tr><td><code>%</code></td><td>เศษจากการหาร</td><td><code>7 % 2</code></td><td>1</td></tr>
 <tr><td><code>**</code></td><td>ยกกำลัง (ไม่ใช่ ^)</td><td><code>2 ** 3</code></td><td>8</td></tr></table></div>
 <div class="box warn"><b>ต่างจากภาษาซี!</b> ในภาษาซี <code>7 / 2</code> ได้ 3 แต่ใน Python ได้ <b>3.5</b> ถ้าต้องการหารแบบตัดเศษให้ใช้ <code>//</code></div>
 <h3>ลำดับการคำนวณ</h3>
 <p><code>( )</code> → <code>**</code> → <code>*  /  //  %</code> → <code>+  -</code> (ลำดับเท่ากันทำจากซ้ายไปขวา) เช่น <code>2 + 3 * 4</code> ได้ 14 ส่วน <code>(2 + 3) * 4</code> ได้ 20</p>
 <p>💡 <code>0.1 + 0.2</code> ได้ <code>0.30000000000000004</code> ไม่ใช่บั๊กของ Python แต่เป็นธรรมชาติของการเก็บทศนิยมในคอมพิวเตอร์ (เลขฐานสอง)</p>
 <h3>ใช้ // และ % คู่กัน</h3>
 <p>เหมาะกับการแปลงหน่วย เช่น 135 นาที → <code>135 // 60</code> = 2 ชั่วโมง เหลือ <code>135 % 60</code> = 15 นาที</p>`,
 labs:[{tip:'เครื่องคิดเลขด้วย print ลองทายผลแต่ละบรรทัดก่อนรัน แล้วกด 😈',trace:true,
  code:C`print("7 + 2 =", 7 + 2)
print("7 - 2 =", 7 - 2)
print("7 * 2 =", 7 * 2)
print("7 / 2 =", 7 / 2)
print("7 // 2 =", 7 // 2)
print("7 % 2 =", 7 % 2)
print("7 ** 2 =", 7 ** 2)
print("2 + 3 * 4 =", 2 + 3 * 4)
print("(2 + 3) * 4 =", (2 + 3) * 4)`,
  tries:[{label:'😈 หารด้วย 0',fn:c=>c.replace('print("7 / 2 =", 7 / 2)','print("7 / 0 =", 7 / 0)')}]}],

 learn:C`<p>ถ้าต้องใช้ค่าเดิมหลายครั้ง หรือต้องจำค่าไว้ใช้ทีหลัง เราเก็บไว้ใน <b>ตัวแปร (variable)</b> เปรียบเหมือน <b>กล่องที่ติดป้ายชื่อ</b> 📦🏷️</p>

 <tr><td><span class="tag int">int</span></td><td>จำนวนเต็ม</td><td><code>16</code></td></tr>
 <tr><td><span class="tag float">float</span></td><td>ทศนิยม</td><td><code>165.5</code></td></tr>
 <tr><td><span class="tag str">str</span></td><td>ข้อความ</td><td><code>"Mali"</code>, <code>"16"</code></td></tr>
 <tr><td><span class="tag bool">bool</span></td><td>จริง/เท็จ</td><td><code>True</code>, <code>False</code> (ตัวแรกพิมพ์ใหญ่)</td></tr></table></div>
 <div class="box warn"><b><code>16</code> กับ <code>"16"</code> ไม่เหมือนกัน!</b> <code>16</code> เป็นตัวเลข นำไปคำนวณได้ ส่วน <code>"16"</code> เป็นข้อความ <code>16 + 16</code> ได้ 32 แต่ <code>"16" + "16"</code> ได้ <code>"1616"</code></div>
 <h3>ถามชนิดด้วย type()</h3>
 <pre class="show">print(type(16))       # &lt;class 'int'&gt;
print(type("16"))     # &lt;class 'str'&gt;</pre>
 <h3>แปลงชนิดข้อมูล</h3>
 <div class="tw"><table><tr><th>คำสั่ง</th><th>ผล</th><th>หมายเหตุ</th></tr>
 <tr><td><code>int("42")</code></td><td><code>42</code></td><td>ข้อความ → จำนวนเต็ม</td></tr>
 <tr><td><code>int(3.9)</code></td><td><code>3</code></td><td>ตัดทศนิยมทิ้ง <b>ไม่ปัดเศษ</b></td></tr>
 <tr><td><code>float("3.5")</code></td><td><code>3.5</code></td><td>ข้อความ → ทศนิยม</td></tr>
 <tr><td><code>float(7)</code></td><td><code>7.0</code></td><td>จำนวนเต็ม → ทศนิยม</td></tr>
 <tr><td><code>str(99)</code></td><td><code>"99"</code></td><td>ตัวเลข → ข้อความ</td></tr>
 <tr><td><code>round(3.567, 1)</code></td><td><code>3.6</code></td><td>ปัดเศษตามจำนวนตำแหน่ง</td></tr>
 <tr><td><code>int("3.5")</code></td><td>❌ ValueError</td><td>int() แปลงข้อความทศนิยมไม่ได้</td></tr>
 <tr><td><code>int("abc")</code></td><td>❌ ValueError</td><td>ไม่ใช่ตัวเลข</td></tr></table></div>

  h+='<div class="card mission" id="ms"></div><div class="card quiz" id="qz"></div>';
  if(S.last)h+=`<div class="card fin"><h2>🎉 จบบทเรียน Python เบื้องต้นแล้ว!</h2><p>ตอนนี้คุณเขียนโปรแกรมที่ <b>แสดงผล</b> (<code>print</code>), <b>เก็บข้อมูล</b> (ตัวแปร), <b>แปลงชนิดข้อมูล</b>, <b>รับค่าจากผู้ใช้</b> (<code>input</code>) และ<b>คำนวณ</b>ได้แล้ว 🌟</p><p>บทต่อไปที่น่าเรียน: การตัดสินใจด้วย <code>if-elif-else</code>, การวนซ้ำด้วย <code>for</code> และ <code>while</code>, รายการข้อมูล <code>list</code> และการสร้างฟังก์ชันด้วย <code>def</code></p></div>`;
  h+=`<div class="nav"><button class="btn" id="pv" ${i===0?'disabled':''}>◀ ขั้นก่อนหน้า</button><button class="btn go" id="nx" ${i===STEPS.length-1?'disabled':''}>ขั้นต่อไป ▶</button></div>`;
  $('#page').innerHTML=h;
  if(S.annot)mkAnnot($('#an'),S.annot);
  if(S.widget){if(S.widget.type==='shell')mkShell($('#wd'),S.widget);else if(S.widget.type==='ident')mkIdent($('#wd'));}
  S.labs.forEach((l,k)=>mkEditor($('#lab'+k),l));
  mkMission($('#ms'),S.mission,'y'+i,renderDots);
  mkQuiz($('#qz'),S.quiz);
  $('#pv').onclick=()=>go(i-1);
  $('#nx').onclick=()=>go(i+1);
  renderDots();
  window.scrollTo(0,0);
}
$('#rstp').onclick=()=>{if(confirm('ต้องการล้างความก้าวหน้าทั้งหมดหรือไม่')){progress={};saveP();go(cur);}};
go(0);
initPy();
</script>
