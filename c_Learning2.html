<body>
<div class="wrap">
  <h1>🔀 เรียนภาษาซีขั้นต่อไป: เงื่อนไข ลูป และฟังก์ชัน</h1>
  <p class="sub">ทำทีละขั้น: อ่าน → ลองรัน → ทำภารกิจ → ตอบคำถาม (ควรเรียนเรื่อง printf, ตัวแปร, scanf และการคำนวณมาก่อน)</p>
  <div class="steps" id="steps"></div>
  <div id="page"></div>
  <button class="reset" id="rstp">ล้างความก้าวหน้าทั้งหมด</button>
</div>

<script>
/* =====================================================================
   ส่วนที่ 1: ตัวจำลองภาษาซีแบบย่อ (lexer -> parser -> interpreter)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
class CErr extends Error{constructor(m,line,kind){super(m);this.line=line||0;this.kind=kind||'compile';}}
const KWS=new Set(['auto','break','case','char','const','continue','default','do','double','else','enum','extern','float','for','goto','if','int','long','register','return','short','signed','sizeof','static','struct','switch','typedef','union','unsigned','void','volatile','while']);
const VT=['int','float','double','char','long'];
const ESC={n:'\n',t:'\t','\\':'\\','"':'"',"'":"'",'0':'\0',r:'\r',a:'\x07'};
const OPS2=['==','!=','<=','>=','&&','||','++','--','+=','-=','*=','/=','%='];
const OPS1='+-*/%=<>!(){};,:?&[]';
const RX_NUM=/(\d+\.\d*|\.\d+|\d+)([eE][+-]?\d+)?[fFlL]*/y;
const RX_ID=/[A-Za-z_]\w*/y;
const RX_CHR=/'(\\.|[^\\'\n])'/y;
const FMT_RE=/%([-+0 ]*)(\d*)(?:\.(\d+))?(ll|l)?([dicfsu%])/g;
const BUILTINS={printf:{h:'stdio.h'},scanf:{h:'stdio.h'},sqrt:{h:'math.h',n:1},pow:{h:'math.h',n:2},fabs:{h:'math.h',n:1},abs:{h:'stdlib.h',n:1}};

function lex(src){
  const toks=[],inc=new Set();let i=0,line=1;const n=src.length;
  const add=(t,v,x)=>toks.push(Object.assign({t,v,line},x||{}));
  while(i<n){
    const c=src[i];
    if(c==='\n'){line++;i++;continue;}
    if(/\s/.test(c)){i++;continue;}
    if(c==='/'&&src[i+1]==='/'){while(i<n&&src[i]!=='\n')i++;continue;}
    if(c==='/'&&src[i+1]==='*'){
      const j=src.indexOf('*/',i+2);
      if(j<0)throw new CErr('คอมเมนต์ /* ไม่ได้ปิดด้วย */',line);
      for(let k=i;k<j;k++)if(src[k]==='\n')line++;
      i=j+2;continue;
    }
    if(c==='#'){
      let j=i;while(j<n&&src[j]!=='\n')j++;
      const ln=src.slice(i,j).trim();
      const m=/^#\s*include\s*<(stdio\.h|math\.h|stdlib\.h)>$/.exec(ln);
      if(!m)throw new CErr(`บรรทัด "${ln}" ไม่ถูกต้องหรือยังไม่รองรับ (ใช้ได้: #include <stdio.h>, <math.h>, <stdlib.h>)`,line);
      inc.add(m[1]);i=j;continue;
    }
    if(c==='"'){
      let j=i+1,s='',closed=false;
      while(j<n){
        const d=src[j];
        if(d==='\n')break;
        if(d==='"'){closed=true;break;}
        if(d==='\\'&&j+1<n){const e=src[j+1];s+=(e in ESC)?ESC[e]:e;j+=2;continue;}
        s+=d;j++;
      }
      if(!closed)throw new CErr('ข้อความที่เปิดด้วยเครื่องหมาย " ไม่ได้ปิดด้วย " ในบรรทัดเดียวกัน',line);
      add('str',s);i=j+1;continue;
    }
    if(c==="'"){
      RX_CHR.lastIndex=i;const m=RX_CHR.exec(src);
      if(!m)throw new CErr("ค่าอักขระ (char) ต้องมี 1 ตัวอักษรในเครื่องหมาย ' ' เช่น 'A' (ถ้าเป็นข้อความหลายตัวอักษรให้ใช้ \" \")",line);
      const ch=m[1].length===2?((m[1][1] in ESC)?ESC[m[1][1]]:m[1][1]):m[1];
      add('chr',ch.charCodeAt(0));i+=m[0].length;continue;
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      RX_NUM.lastIndex=i;const m=RX_NUM.exec(src);
      const body=m[0].replace(/[fFlL]+$/,'');
      const isD=/[.eE]/.test(body);const v=parseFloat(body);
      add('num',v,{ty:isD?'d':(v>2147483647?'l':'i'),raw:m[0]});i+=m[0].length;continue;
    }
    if(/[A-Za-z_]/.test(c)){RX_ID.lastIndex=i;const m=RX_ID.exec(src);add('id',m[0]);i+=m[0].length;continue;}
    const two=src.substr(i,2);
    if(OPS2.includes(two)){add('op',two);i+=2;continue;}
    if(OPS1.includes(c)){add('op',c);i++;continue;}
    if(c==='|')throw new CErr("ต้องเขียน || (สองตัวติดกัน) สำหรับ 'หรือ'",line);
    throw new CErr(`ใช้อักขระ '${c}' ในตำแหน่งนี้ไม่ได้ (ข้อความภาษาไทยเขียนได้เฉพาะในคอมเมนต์ หรือในเครื่องหมาย " ")`,line);
  }
  toks.push({t:'eof',v:'',line});
  return{toks,inc};
}

class Parser{
  constructor(toks,inc){
    this.toks=toks;this.p=0;this.inc=inc;this.funcs=new Map();
    this.scopes=[new Map()];this.warns=[];this.loopDepth=0;this.switchDepth=0;this.allowStr=false;
  }
  get tk(){return this.toks[this.p];}
  peek(k){return this.toks[Math.min(this.p+k,this.toks.length-1)];}
  prevLine(){return this.p>0?this.toks[this.p-1].line:1;}
  isOp(v){const t=this.tk;return t.t==='op'&&t.v===v;}
  isId(v){const t=this.tk;return t.t==='id'&&t.v===v;}
  eatOp(v){if(this.isOp(v)){this.p++;return true;}return false;}
  desc(t){
    if(t.t==='eof')return 'จบไฟล์';
    if(t.t==='str')return '"'+t.v+'"';
    if(t.t==='chr')return "'"+String.fromCharCode(t.v)+"'";
    if(t.t==='num')return t.raw;
    return t.v;
  }
  expectOp(v,why,force){
    if(this.isOp(v)){return this.toks[this.p++];}
    const t=this.tk;
    if(force)throw new CErr(why,this.prevLine());
    if(v===';')throw new CErr(`ขาดเครื่องหมาย ; ท้ายคำสั่ง (ตรวจท้ายบรรทัดที่ ${this.prevLine()}) เพราะถัดมาพบ '${this.desc(t)}'`,this.prevLine());
    throw new CErr(`ต้องมีเครื่องหมาย ${v} ${why||''} (แต่พบ '${this.desc(t)}')`,t.line);
  }
  pushS(){this.scopes.push(new Map());}
  popS(){this.scopes.pop();}
  declare(name,type,line){
    if(KWS.has(name))throw new CErr(`'${name}' เป็นคำสงวนของภาษาซี ใช้เป็นชื่อไม่ได้`,line);
    const s=this.scopes[this.scopes.length-1];
    if(s.has(name))throw new CErr(`ประกาศตัวแปร '${name}' ซ้ำในขอบเขตเดียวกัน`,line);
    s.set(name,type);
  }
  lookup(name){for(let i=this.scopes.length-1;i>=0;i--)if(this.scopes[i].has(name))return this.scopes[i].get(name);return null;}
  unknown(name,line,isCall){
    const low=name.toLowerCase();
    if(low!==name&&(KWS.has(low)||BUILTINS[low]))return new CErr(`ไม่รู้จัก '${name}' ภาษาซีแยกตัวพิมพ์เล็ก-ใหญ่ (case-sensitive) ต้องเขียนเป็น '${low}'`,line);
    for(const f of this.funcs.keys())if(f!==name&&f.toLowerCase()===low)return new CErr(`ไม่รู้จัก '${name}' คุณหมายถึง '${f}' หรือเปล่า (ตัวพิมพ์เล็ก-ใหญ่ต้องตรงกัน)`,line);
    if(isCall)return new CErr(`ไม่รู้จักฟังก์ชัน '${name}' ต้องเขียนฟังก์ชันไว้ก่อนจุดที่เรียกใช้ (เหนือ main) หรือประกาศ prototype ไว้ก่อน และตรวจการสะกดชื่อ`,line);
    const names=[];this.scopes.forEach(s=>s.forEach((_,k)=>names.push(k)));
    const m=names.find(k=>k.toLowerCase()===low);
    if(m)return new CErr(`ไม่รู้จักตัวแปร '${name}' คุณหมายถึง '${m}' หรือเปล่า (ตัวพิมพ์เล็ก-ใหญ่ต้องตรงกัน)`,line);
    return new CErr(`ยังไม่ได้ประกาศตัวแปร '${name}' ต้องประกาศก่อนใช้ เช่น int ${name}; และตรวจการสะกด`,line);
  }
  parseType(){
    const t=this.tk;this.p++;
    if(t.v==='long'){if(this.isId('long'))this.p++;if(this.isId('int'))this.p++;return 'long';}
    return t.v;
  }
  /* ---------- โปรแกรมและฟังก์ชัน ---------- */
  parseProgram(){
    const globals=[];
    while(this.tk.t!=='eof'){
      const t=this.tk;
      if(t.t==='id'&&(VT.includes(t.v)||t.v==='void')){
        const start=this.p;
        const ret=this.parseType();
        const nt=this.tk;
        if(nt.t!=='id'||KWS.has(nt.v))throw new CErr(`หลัง ${ret} ต้องมีชื่อฟังก์ชันหรือชื่อตัวแปร`+(nt.t==='id'?` ('${nt.v}' เป็นคำสงวน)`:''),nt.line);
        const nx=this.peek(1);
        if(nx.t==='op'&&nx.v==='('){this.p++;this.parseFunction(ret,nt);}
        else{
          if(ret==='void')throw new CErr('ตัวแปรชนิด void ประกาศไม่ได้',nt.line);
          this.p=start;globals.push(this.parseDecl());
        }
      }else if(t.t==='op'&&t.v==='}'){
        throw new CErr('มีเครื่องหมาย } เกินมา (ปิดบล็อกมากกว่าที่เปิดไว้) ตรวจจำนวน { และ }',t.line);
      }else{
        throw new CErr(`พบ '${this.desc(t)}' นอกฟังก์ชัน คำสั่งต้องเขียนอยู่ภายในฟังก์ชัน เช่น main (ตรวจว่ามี } ปิดก่อนหน้านี้เกินหรือไม่)`,t.line);
      }
    }
    const m=this.funcs.get('main');
    if(!m||!m.body)throw new CErr('ไม่พบฟังก์ชัน main โปรแกรมภาษาซีต้องมี int main(void) { ... }',1);
    if(m.params.length)throw new CErr('ฟังก์ชัน main ในบทนี้ไม่รับพารามิเตอร์ ให้เขียนเป็น int main(void)',m.line);
    return globals;
  }
  parseFunction(ret,nt){
    const name=nt.v;
    this.expectOp('(','หลังชื่อฟังก์ชัน');
    const params=[];
    if(this.isId('void')&&this.peek(1).t==='op'&&this.peek(1).v===')')this.p++;
    else if(!this.isOp(')')){
      do{
        const pt=this.tk;
        if(!(pt.t==='id'&&VT.includes(pt.v)))throw new CErr(`พารามิเตอร์ต้องขึ้นต้นด้วยชนิดข้อมูล เช่น int x (พบ '${this.desc(pt)}')`,pt.line);
        const ty=this.parseType();const n2=this.tk;let pn=null;
        if(n2.t==='id'&&!KWS.has(n2.v)){pn=n2.v;this.p++;}
        params.push({type:ty,name:pn});
      }while(this.eatOp(','));
    }
    this.expectOp(')','ปิดรายการพารามิเตอร์');
    let fn=this.funcs.get(name);
    if(fn){
      if(fn.ret!==ret||fn.params.length!==params.length)throw new CErr(`ฟังก์ชัน '${name}' ถูกประกาศซ้ำด้วยรูปแบบที่ไม่ตรงกับครั้งแรก`,nt.line);
    }else{fn={name,ret,params,body:null,line:nt.line};this.funcs.set(name,fn);}
    if(this.eatOp(';'))return;
    if(!this.isOp('{'))throw new CErr(`หลังส่วนหัวฟังก์ชัน '${name}' ต้องมี { เพื่อเริ่มเนื้อหา หรือ ; ถ้าเป็นแค่ prototype`,this.tk.line);
    if(fn.body)throw new CErr(`ฟังก์ชัน '${name}' ถูกเขียนเนื้อหาซ้ำ`,nt.line);
    if(params.some(p=>!p.name))throw new CErr(`พารามิเตอร์ของฟังก์ชัน '${name}' ต้องมีชื่อ เช่น int x`,nt.line);
    fn.params=params;
    this.pushS();params.forEach(p=>this.declare(p.name,p.type,nt.line));
    fn.body=this.parseBlock(true);
    this.popS();
  }
  /* ---------- คำสั่ง ---------- */
  parseBlock(noScope){
    const open=this.expectOp('{','เพื่อเริ่มบล็อก');
    if(!noScope)this.pushS();
    const body=[];
    while(!this.isOp('}')){
      if(this.tk.t==='eof')throw new CErr(`ขาดเครื่องหมาย } เพื่อปิดบล็อกที่เปิดไว้ที่บรรทัด ${open.line}`,open.line);
      body.push(this.parseStmt());
    }
    this.p++;
    if(!noScope)this.popS();
    return{k:'block',body,line:open.line};
  }
  parseBody(kind){
    this.pushS();if(kind==='loop')this.loopDepth++;
    const s=this.parseStmt();
    if(kind==='loop')this.loopDepth--;
    this.popS();return s;
  }
  parseStmt(){
    const t=this.tk;
    if(t.t==='op'){
      if(t.v==='{')return this.parseBlock();
      if(t.v===';'){this.p++;return{k:'empty',line:t.line};}
    }
    if(t.t==='id'){
      const v=t.v;
      if(VT.includes(v))return this.parseDecl();
      if(v==='if')return this.parseIf();
      if(v==='while')return this.parseWhile();
      if(v==='do')return this.parseDo();
      if(v==='for')return this.parseFor();
      if(v==='switch')return this.parseSwitch();
      if(v==='break'){
        if(!this.loopDepth&&!this.switchDepth)throw new CErr('break ใช้ได้เฉพาะภายใน loop หรือ switch',t.line);
        this.p++;this.expectOp(';');return{k:'break',line:t.line};
      }
      if(v==='continue'){
        if(!this.loopDepth)throw new CErr('continue ใช้ได้เฉพาะภายใน loop',t.line);
        this.p++;this.expectOp(';');return{k:'continue',line:t.line};
      }
      if(v==='return'){
        this.p++;let e=null;
        if(!this.isOp(';'))e=this.parseExpr();
        this.expectOp(';');return{k:'return',e,line:t.line};
      }
      if(v==='else')throw new CErr('พบ else ที่ไม่มี if คู่กัน (ตรวจว่าใส่ ; ท้าย if (...) หรือปิด { } ผิดหรือไม่)',t.line);
      if(v==='case'||v==='default')throw new CErr(`'${v}' ใช้ได้เฉพาะภายใน switch`,t.line);
      if(v==='void')throw new CErr('ประกาศตัวแปรชนิด void ไม่ได้',t.line);
      if(KWS.has(v))throw new CErr(`'${v}' ยังไม่อยู่ในเนื้อหาของบทเรียนนี้`,t.line);
    }
    const e=this.parseExpr();
    this.expectOp(';');
    return{k:'expr',e,line:t.line};
  }
  parseDecl(){
    const first=this.tk;
    const type=this.parseType();
    const decls=[];
    do{
      const nt=this.tk;
      if(nt.t==='num')throw new CErr(`ชื่อตัวแปรห้ามขึ้นต้นด้วยตัวเลข (พบ '${nt.raw}')`,nt.line);
      if(nt.t!=='id')throw new CErr(`หลัง ${type} ต้องมีชื่อตัวแปร (พบ '${this.desc(nt)}')`,nt.line);
      if(KWS.has(nt.v))throw new CErr(`'${nt.v}' เป็นคำสงวนของภาษาซี ใช้เป็นชื่อตัวแปรไม่ได้`,nt.line);
      this.p++;
      const nx=this.tk;
      if(nx.t==='op'&&nx.v==='(')throw new CErr(`ภาษาซีไม่ให้เขียนฟังก์ชันซ้อนอยู่ในฟังก์ชันอื่น ให้ย้าย '${nt.v}' ไปไว้นอก main`,nt.line);
      if(nx.t==='op'&&nx.v==='[')throw new CErr('อาร์เรย์ยังไม่อยู่ในเนื้อหาของบทเรียนนี้',nt.line);
      if(nx.line===nt.line&&nx.t!=='eof'&&!(nx.t==='op'&&['=',';',','].includes(nx.v)))
        throw new CErr(`รูปแบบการประกาศตัวแปรไม่ถูกต้อง หลังชื่อ '${nt.v}' พบ '${this.desc(nx)}' (ชื่อตัวแปรใช้ได้เฉพาะ A-Z a-z 0-9 และ _ ห้ามเว้นวรรคหรือมีเครื่องหมายอื่น)`,nt.line);
      let init=null;
      if(this.eatOp('='))init=this.parseAssign();
      this.declare(nt.v,type,nt.line);
      decls.push({name:nt.v,init,line:nt.line});
    }while(this.eatOp(','));
    this.expectOp(';');
    return{k:'decl',type,decls,line:first.line};
  }
  checkCond(c,line,kw){
    if(c.k==='assign'&&c.op==='=')this.warns.push({line,msg:`ใน ${kw} ใช้ = ซึ่งเป็นการกำหนดค่า ไม่ใช่การเปรียบเทียบ ถ้าต้องการเปรียบเทียบให้ใช้ ==`});
  }
  parseIf(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง if ต้องมีวงเล็บเงื่อนไข เช่น if (x > 5)');
    const cond=this.parseExpr();
    this.expectOp(')','เพื่อปิดเงื่อนไขของ if');
    this.checkCond(cond,t.line,'if');
    const then=this.parseBody('if');
    if(then.k==='empty')this.warns.push({line:t.line,msg:'มีเครื่องหมาย ; ต่อท้ายเงื่อนไข if ทันที ทำให้ if ควบคุมคำสั่งว่าง และคำสั่งที่ตามมาจะทำงานเสมอ ให้ลบ ; ออก'});
    let els=null;
    if(this.isId('else')){this.p++;els=this.parseBody('if');}
    return{k:'if',cond,then,els,line:t.line};
  }
  parseWhile(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง while ต้องมีวงเล็บเงื่อนไข เช่น while (i <= 5)');
    const cond=this.parseExpr();
    this.expectOp(')','เพื่อปิดเงื่อนไขของ while');
    this.checkCond(cond,t.line,'while');
    const body=this.parseBody('loop');
    if(body.k==='empty')this.warns.push({line:t.line,msg:'มีเครื่องหมาย ; ต่อท้าย while (...) ทันที ทำให้ loop วนคำสั่งว่าง (ถ้าเงื่อนไขเป็นจริงจะวนไม่จบ) ให้ลบ ; ออก'});
    return{k:'while',cond,body,line:t.line};
  }
  parseDo(){
    const t=this.tk;this.p++;
    const body=this.parseBody('loop');
    if(!this.isId('while'))throw new CErr('do ต้องจบด้วย while (เงื่อนไข); เช่น do { ... } while (x < 5);',this.tk.line);
    const w=this.tk;this.p++;
    this.expectOp('(','หลัง while ต้องมีวงเล็บเงื่อนไข');
    const cond=this.parseExpr();
    this.expectOp(')','เพื่อปิดเงื่อนไขของ while');
    this.expectOp(';');
    return{k:'do',cond,body,line:t.line,cline:w.line};
  }
  parseFor(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง for ต้องมีวงเล็บ เช่น for (i = 0; i < 5; i++)');
    const msg='ภายในวงเล็บของ for ต้องมี 3 ส่วนคั่นด้วย ; สองตัว เช่น for (i = 0; i < 5; i++)';
    this.pushS();
    let init=null,cond=null,step=null;
    if(this.isOp(';'))this.p++;
    else if(this.tk.t==='id'&&VT.includes(this.tk.v))init=this.parseDecl();
    else{init={k:'exprs',list:this.parseExprList(),line:t.line};this.expectOp(';',msg,true);}
    if(!this.isOp(';'))cond=this.parseExpr();
    this.expectOp(';',msg,true);
    if(!this.isOp(')'))step=this.parseExprList();
    this.expectOp(')','เพื่อปิดวงเล็บของ for');
    if(cond)this.checkCond(cond,t.line,'for');
    const body=this.parseBody('loop');
    this.popS();
    if(body.k==='empty')this.warns.push({line:t.line,msg:'มีเครื่องหมาย ; ต่อท้าย for (...) ทันที ทำให้ loop วนคำสั่งว่าง และคำสั่งถัดไปจะทำงานแค่ครั้งเดียวหลังวนจบ ให้ลบ ; ออก'});
    return{k:'for',init,cond,step,body,line:t.line};
  }
  parseSwitch(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง switch ต้องมีวงเล็บ เช่น switch (x)');
    const e=this.parseExpr();
    this.expectOp(')','เพื่อปิดวงเล็บของ switch');
    const open=this.expectOp('{','เพื่อเริ่มบล็อกของ switch');
    const cases=[];let cur=null;
    this.switchDepth++;this.pushS();
    while(!this.isOp('}')){
      if(this.tk.t==='eof')throw new CErr(`ขาดเครื่องหมาย } เพื่อปิด switch ที่เปิดไว้ที่บรรทัด ${open.line}`,open.line);
      if(this.isId('case')){
        this.p++;const test=this.parseTernary();
        this.expectOp(':','หลัง case เช่น case 1:');
        cur={test,body:[]};cases.push(cur);
      }else if(this.isId('default')){
        this.p++;this.expectOp(':','หลัง default');
        cur={test:null,body:[]};cases.push(cur);
      }else{
        if(!cur)throw new CErr('ภายใน switch ต้องขึ้นต้นด้วย case หรือ default ก่อน',this.tk.line);
        cur.body.push(this.parseStmt());
      }
    }
    this.p++;this.popS();this.switchDepth--;
    return{k:'switch',e,cases,line:t.line};
  }
  /* ---------- นิพจน์ ---------- */
  parseExpr(){return this.parseAssign();}
  parseExprList(){const l=[this.parseAssign()];while(this.eatOp(','))l.push(this.parseAssign());return l;}
  parseAssign(){
    const left=this.parseTernary();
    const t=this.tk;
    if(t.t==='op'&&['=','+=','-=','*=','/=','%='].includes(t.v)){
      if(left.k!=='id')throw new CErr(`ด้านซ้ายของ ${t.v} ต้องเป็นชื่อตัวแปร`,t.line);
      this.p++;
      const right=this.parseAssign();
      return{k:'assign',op:t.v,name:left.name,e:right,line:t.line};
    }
    return left;
  }
  parseTernary(){
    const c=this.parseBin(0);
    if(this.isOp('?')){
      const t=this.tk;this.p++;
      const a=this.parseAssign();
      this.expectOp(':','ในนิพจน์ ? :');
      const b=this.parseTernary();
      return{k:'cond',c,a,b,line:t.line};
    }
    return c;
  }
  parseBin(level){
    const LV=[['||'],['&&'],['==','!='],['<','>','<=','>='],['+','-'],['*','/','%']];
    if(level>=LV.length)return this.parseUnary();
    let l=this.parseBin(level+1);
    while(this.tk.t==='op'&&LV[level].includes(this.tk.v)){
      const o=this.tk;this.p++;
      const r=this.parseBin(level+1);
      l={k:'bin',op:o.v,l,r,line:o.line};
    }
    return l;
  }
  parseUnary(){
    const t=this.tk;
    if(t.t==='op'){
      if(t.v==='-'||t.v==='+'||t.v==='!'){this.p++;return{k:'un',op:t.v,e:this.parseUnary(),line:t.line};}
      if(t.v==='++'||t.v==='--'){
        this.p++;const e=this.parseUnary();
        if(e.k!=='id')throw new CErr(`${t.v} ใช้กับชื่อตัวแปรเท่านั้น`,t.line);
        return{k:'incdec',op:t.v,pre:true,name:e.name,line:t.line};
      }
      if(t.v==='&'){
        this.p++;const nt=this.tk;
        if(nt.t!=='id')throw new CErr('หลังเครื่องหมาย & ต้องเป็นชื่อตัวแปร เช่น &x',t.line);
        this.p++;
        if(this.lookup(nt.v)===null)throw this.unknown(nt.v,nt.line,false);
        return{k:'addr',name:nt.v,line:t.line};
      }
      if(t.v==='('){
        const a=this.peek(1),b=this.peek(2);
        if(a.t==='id'&&VT.includes(a.v)&&b.t==='op'&&b.v===')'){
          this.p+=3;return{k:'cast',type:a.v,e:this.parseUnary(),line:t.line};
        }
      }
    }
    return this.parsePostfix();
  }
  parsePostfix(){
    const e=this.parsePrimary();
    if(e.k==='id'&&this.tk.t==='op'&&(this.tk.v==='++'||this.tk.v==='--')){
      const o=this.tk;this.p++;
      return{k:'incdec',op:o.v,pre:false,name:e.name,line:o.line};
    }
    return e;
  }
  parsePrimary(){
    const t=this.tk;
    if(t.t==='num'){this.p++;return{k:'num',v:t.v,ty:t.ty,line:t.line};}
    if(t.t==='chr'){this.p++;return{k:'num',v:t.v,ty:'i',line:t.line};}
    if(t.t==='str'){
      if(!this.allowStr)throw new CErr('ข้อความใน " " ใช้ได้เฉพาะเป็นอาร์กิวเมนต์ของ printf (บทนี้ยังไม่มีตัวแปรชนิดข้อความ)',t.line);
      this.p++;return{k:'str',v:t.v,line:t.line};
    }
    if(t.t==='id'){
      if(KWS.has(t.v))throw new CErr(`คำสงวน '${t.v}' อยู่ผิดตำแหน่ง ตรวจประโยคก่อนหน้า (มักลืม ; หรือ ) )`,t.line);
      this.p++;
      if(this.isOp('('))return this.parseCall(t);
      if(this.lookup(t.v)===null)throw this.unknown(t.v,t.line,false);
      return{k:'id',name:t.v,line:t.line};
    }
    if(t.t==='op'&&t.v==='('){
      this.p++;const e=this.parseExpr();
      this.expectOp(')','เพื่อปิดวงเล็บ');
      return e;
    }
    throw new CErr(`นิพจน์ไม่สมบูรณ์ พบ '${this.desc(t)}' ในตำแหน่งที่ควรเป็นตัวเลขหรือตัวแปร (ตรวจ ; ท้ายบรรทัดก่อนหน้า)`,t.line);
  }
  parseCall(t){
    const name=t.v,line=t.line;
    this.expectOp('(','หลังชื่อฟังก์ชัน');
    const args=[];
    const old=this.allowStr;
    if(name==='printf'||name==='scanf')this.allowStr=true;
    if(!this.isOp(')')){do{args.push(this.parseAssign());}while(this.eatOp(','));}
    this.allowStr=old;
    this.expectOp(')',`เพื่อปิดวงเล็บของ ${name}`);
    const user=this.funcs.get(name);
    if(user){
      if(args.length!==user.params.length)throw new CErr(`ฟังก์ชัน '${name}' ต้องการอาร์กิวเมนต์ ${user.params.length} ค่า แต่ส่งมา ${args.length} ค่า`,line);
      return{k:'call',name,args,line,builtin:false};
    }
    const b=BUILTINS[name];
    if(!b)throw this.unknown(name,line,true);
    if(!this.inc.has(b.h))throw new CErr(`ใช้ ${name} ต้องเขียน #include <${b.h}> ไว้บรรทัดบนสุดก่อน`,line);
    if(b.n!==undefined&&args.length!==b.n)throw new CErr(`${name} ต้องการอาร์กิวเมนต์ ${b.n} ค่า`,line);
    if(name==='printf'){
      if(!args.length||args[0].k!=='str')throw new CErr('อาร์กิวเมนต์แรกของ printf ต้องเป็นข้อความใน " "',line);
      const specs=[...args[0].v.matchAll(FMT_RE)].filter(m=>m[5]!=='%');
      if(args.length-1<specs.length)throw new CErr(`printf มีตัวแทนค่า (เช่น %d %f) ${specs.length} ตัว แต่ส่งค่ามาแค่ ${args.length-1} ค่า`,line);
      if(args.length-1>specs.length)this.warns.push({line,msg:'ส่งค่าให้ printf เกินจำนวนตัวแทนค่า (% ...) ค่าที่เกินจะไม่แสดง'});
    }
    if(name==='scanf'){
      if(!args.length||args[0].k!=='str')throw new CErr('อาร์กิวเมนต์แรกของ scanf ต้องเป็นข้อความรูปแบบใน " " เช่น "%d"',line);
      const specs=[...args[0].v.matchAll(/%(ld|lf|[dfc])/g)].map(m=>m[1]);
      const tg=args.slice(1);
      if(specs.length!==tg.length)throw new CErr(`scanf มีตัวแทนค่า ${specs.length} ตัว แต่ระบุตัวแปร ${tg.length} ตัว ต้องเท่ากัน`,line);
      const WANT={int:'d',float:'f',double:'lf',char:'c',long:'ld'};
      tg.forEach((a,i)=>{
        if(a.k!=='addr')throw new CErr(`ตัวแปรใน scanf ต้องมี & นำหน้า เช่น &${a.k==='id'?a.name:'x'} (ลืม & เป็นข้อผิดพลาดที่พบบ่อยมาก)`,line);
        const ty=this.lookup(a.name);
        if(specs[i]!==WANT[ty])throw new CErr(`ตัวแปร '${a.name}' เป็นชนิด ${ty} ต้องใช้ %${WANT[ty]} ใน scanf (ไม่ใช่ %${specs[i]})`,line);
      });
    }
    return{k:'call',name,args,line,builtin:true};
  }
}

const fmtF=(v,p)=>isFinite(v)?v.toFixed(Math.min(p,20)):(isNaN(v)?'nan':(v<0?'-inf':'inf'));
const typeCat=ty=>ty==='float'||ty==='double'?'d':ty==='long'?'l':'i';
function conv(ty,x){
  switch(ty){
    case 'int':return Math.trunc(x.v)|0;
    case 'char':return(Math.trunc(x.v)<<24)>>24;
    case 'long':return Math.trunc(x.v);
    case 'float':return Math.fround(x.v);
    default:return x.v;
  }
}

function interpret(ps,globalDecls,stdin,res){
  const funcs=ps.funcs;
  const globals=new Map();const gf={scopes:[globals]};
  const toks=stdin.trim().split(/\s+/).filter(Boolean);let tp=0;
  let steps=0,depth=0,outLen=0,curLine=0;
  const seen=new Set();
  const warn=(m,line)=>{const k=line+'|'+m;if(!seen.has(k)){seen.add(k);res.warns.push({line,msg:m});}};
  const hit=l=>res.hits.set(l,(res.hits.get(l)||0)+1);
  const tick=l=>{if(++steps>400000)throw new CErr('โปรแกรมทำงานนานผิดปกติ (เกิน 400,000 ขั้นตอน) น่าจะเกิดการวนซ้ำไม่รู้จบ (infinite loop) ให้ตรวจเงื่อนไขของ loop และการเปลี่ยนค่าตัวแปร',l,'run');};
  const emit=s=>{outLen+=s.length;if(outLen>20000)throw new CErr('แสดงผลมากเกินไป (เกิน 20,000 ตัวอักษร) น่าจะเกิดการวนซ้ำไม่รู้จบ (infinite loop) ให้ตรวจเงื่อนไขของ loop',curLine,'run');res.raw+=s;res.shown.push(esc(s));};
  const lookupVar=(fr,name)=>{
    for(let i=fr.scopes.length-1;i>=0;i--){const v=fr.scopes[i].get(name);if(v)return v;}
    return globals.get(name)||null;
  };
  function arith(o,a,b,line){
    const d=a.t==='d'||b.t==='d';
    const t=d?'d':(a.t==='l'||b.t==='l')?'l':'i';
    let v;
    switch(o){
      case '+':v=a.v+b.v;break;
      case '-':v=a.v-b.v;break;
      case '*':v=(t==='i')?Math.imul(a.v,b.v):a.v*b.v;break;
      case '/':
        if(t==='d'){v=a.v/b.v;break;}
        if(b.v===0)throw new CErr('หารจำนวนเต็มด้วยศูนย์ไม่ได้ (division by zero)',line,'run');
        v=Math.trunc(a.v/b.v);break;
      default:
        if(t==='d')throw new CErr('เครื่องหมาย % ใช้ได้กับจำนวนเต็มเท่านั้น (ใช้กับทศนิยมไม่ได้)',line,'run');
        if(b.v===0)throw new CErr('หาเศษด้วยศูนย์ไม่ได้ (division by zero)',line,'run');
        v=a.v%b.v;
    }
    if(t==='i')v=v|0;
    return{v,t};
  }
  function store(va,x,line){
    if((va.type==='int'||va.type==='char'||va.type==='long')&&x.t==='d'&&!Number.isInteger(x.v))
      warn(`เก็บค่าทศนิยม ${Number(x.v.toPrecision(8))} ลงตัวแปรชนิด ${va.type} ('${va.name}') ส่วนทศนิยมจะถูกตัดทิ้ง`,line);
    va.v=conv(va.type,x);va.init=true;
  }
  function ev(n,fr){
    switch(n.k){
      case 'num':return{v:n.v,t:n.ty};
      case 'id':{
        const va=lookupVar(fr,n.name);
        if(!va.init)warn(`ตัวแปร '${n.name}' ถูกนำมาใช้ก่อนใส่ค่า จึงได้ค่าขยะที่ไม่แน่นอน`,n.line);
        return{v:va.v,t:typeCat(va.type)};
      }
      case 'un':{
        const x=ev(n.e,fr);
        if(n.op==='!')return{v:x.v?0:1,t:'i'};
        if(n.op==='-')return x.t==='i'?{v:(-x.v)|0,t:'i'}:{v:-x.v,t:x.t};
        return x;
      }
      case 'cast':{const x=ev(n.e,fr);return{v:conv(n.type,x),t:typeCat(n.type)};}
      case 'bin':{
        if(n.op==='&&'){const a=ev(n.l,fr);if(!a.v)return{v:0,t:'i'};return{v:ev(n.r,fr).v?1:0,t:'i'};}
        if(n.op==='||'){const a=ev(n.l,fr);if(a.v)return{v:1,t:'i'};return{v:ev(n.r,fr).v?1:0,t:'i'};}
        const a=ev(n.l,fr),b=ev(n.r,fr);
        switch(n.op){
          case '==':return{v:a.v===b.v?1:0,t:'i'};
          case '!=':return{v:a.v!==b.v?1:0,t:'i'};
          case '<':return{v:a.v<b.v?1:0,t:'i'};
          case '>':return{v:a.v>b.v?1:0,t:'i'};
          case '<=':return{v:a.v<=b.v?1:0,t:'i'};
          case '>=':return{v:a.v>=b.v?1:0,t:'i'};
          default:return arith(n.op,a,b,n.line);
        }
      }
      case 'assign':{
        const va=lookupVar(fr,n.name);
        let x=ev(n.e,fr);
        if(n.op!=='='){
          if(!va.init)warn(`ตัวแปร '${n.name}' ถูกนำมาใช้ก่อนใส่ค่า`,n.line);
          x=arith(n.op[0],{v:va.v,t:typeCat(va.type)},x,n.line);
        }
        store(va,x,n.line);
        return{v:va.v,t:typeCat(va.type)};
      }
      case 'incdec':{
        const va=lookupVar(fr,n.name);
        if(!va.init)warn(`ตัวแปร '${n.name}' ถูกนำมาใช้ก่อนใส่ค่า`,n.line);
        const old={v:va.v,t:typeCat(va.type)};
        store(va,arith(n.op==='++'?'+':'-',old,{v:1,t:'i'},n.line),n.line);
        return n.pre?{v:va.v,t:old.t}:old;
      }
      case 'cond':return ev(n.c,fr).v?ev(n.a,fr):ev(n.b,fr);
      case 'call':return callFn(n,fr);
      case 'addr':throw new CErr('เครื่องหมาย & ในบทนี้ใช้ได้เฉพาะใน scanf',n.line,'run');
      default:throw new CErr('ข้อความใน " " ใช้ได้เฉพาะใน printf',n.line,'run');
    }
  }
  function callFn(n,fr){
    if(n.builtin)return builtin(n,fr);
    const fn=funcs.get(n.name);
    if(!fn.body)throw new CErr(`ฟังก์ชัน '${n.name}' ประกาศไว้แต่ยังไม่ได้เขียนเนื้อหา`,n.line,'run');
    if(++depth>250)throw new CErr('เรียกฟังก์ชันซ้อนกันลึกเกินไป (น่าจะเป็น recursion ที่ไม่มีเงื่อนไขหยุด)',n.line,'run');
    const args=n.args.map(a=>ev(a,fr));
    const nf={scopes:[new Map()]};
    fn.params.forEach((p,i)=>{
      if((p.type==='int'||p.type==='char'||p.type==='long')&&args[i].t==='d'&&!Number.isInteger(args[i].v))
        warn(`ส่งค่าทศนิยมให้พารามิเตอร์ชนิด ${p.type} ('${p.name}') ส่วนทศนิยมจะถูกตัดทิ้ง`,n.line);
      nf.scopes[0].set(p.name,{name:p.name,type:p.type,v:conv(p.type,args[i]),init:true});
    });
    const r=exec(fn.body,nf);
    depth--;
    if(fn.ret==='void')return{v:0,t:'i'};
    const rv=(r&&r.k==='return'&&r.v)?r.v:{v:0,t:'i'};
    return{v:conv(fn.ret,rv),t:typeCat(fn.ret)};
  }
  function builtin(n,fr){
    const name=n.name;
    if(name==='printf'){
      const vals=n.args.slice(1);let ai=0;
      const out=n.args[0].v.replace(FMT_RE,(all,fl,w,pr,lg,cv)=>{
        if(cv==='%')return'%';
        const a=vals[ai++];let s;
        if(cv==='s'){
          if(a.k!=='str')throw new CErr('%s ในบทนี้ใช้กับข้อความใน " " เท่านั้น',n.line,'run');
          s=a.v;if(pr!==undefined)s=s.slice(0,+pr);
        }else{
          const x=ev(a,fr);
          if(cv==='d'||cv==='i'||cv==='u'){
            if(x.t==='d'){warn(`${all} ใช้กับจำนวนเต็ม แต่ค่าที่ส่งมาเป็นทศนิยม ควรใช้ %f (ภาษาซีจริงจะได้ผลลัพธ์เพี้ยน)`,n.line);s='0';}
            else{s=String(x.v);if(fl.includes('+')&&x.v>=0)s='+'+s;}
          }else if(cv==='f'){
            const P=pr===undefined?6:+pr;
            if(x.t!=='d'){warn(`${all} ใช้กับทศนิยม แต่ค่าที่ส่งมาเป็นจำนวนเต็ม ควรใช้ %d (ภาษาซีจริงจะได้ผลลัพธ์เพี้ยน)`,n.line);s=fmtF(0,P);}
            else{s=fmtF(x.v,P);if(fl.includes('+')&&x.v>=0)s='+'+s;}
          }else{
            if(x.t==='d')warn('%c ใช้กับตัวอักษรหรือจำนวนเต็ม ไม่ใช่ทศนิยม',n.line);
            s=String.fromCharCode(x.v&255);
          }
        }
        if(w&&s.length<+w){
          const W=+w;
          if(fl.includes('-'))s=s.padEnd(W);
          else if(fl.includes('0')&&cv!=='s'&&cv!=='c'){const sg=/^[+-]/.test(s)?s[0]:'';s=sg+s.slice(sg.length).padStart(W-sg.length,'0');}
          else s=s.padStart(W);
        }
        return s;
      });
      emit(out);
      return{v:out.length,t:'i'};
    }
    if(name==='scanf'){
      const specs=[...n.args[0].v.matchAll(/%(ld|lf|[dfc])/g)].map(m=>m[1]);
      let cnt=0;
      for(let i=0;i<specs.length;i++){
        const va=lookupVar(fr,n.args[i+1].name),sp=specs[i];
        if(tp>=toks.length)throw new CErr('ไม่มีข้อมูลให้ scanf อ่าน ให้พิมพ์ค่าในช่อง "ข้อมูลที่ต้องพิมพ์ให้โปรแกรม" ให้ครบก่อนกดรัน',n.line,'run');
        const tok=toks[tp++];
        res.shown.push('<i>'+esc(tok)+(i===specs.length-1?'\n':' ')+'</i>');
        if(sp==='d'||sp==='ld'){
          if(!/^[+-]?\d+$/.test(tok))throw new CErr(`ข้อมูล '${tok}' ไม่ใช่จำนวนเต็ม แต่ %${sp} ต้องการจำนวนเต็ม`,n.line,'run');
          va.v=conv(va.type,{v:parseInt(tok,10),t:'l'});
        }else if(sp==='c')va.v=tok.charCodeAt(0);
        else{
          if(!isFinite(Number(tok)))throw new CErr(`ข้อมูล '${tok}' ไม่ใช่ตัวเลข`,n.line,'run');
          va.v=va.type==='float'?Math.fround(Number(tok)):Number(tok);
        }
        va.init=true;cnt++;
      }
      return{v:cnt,t:'i'};
    }
    const a=n.args.map(x=>ev(x,fr));
    if(name==='sqrt')return{v:Math.sqrt(a[0].v),t:'d'};
    if(name==='pow')return{v:Math.pow(a[0].v,a[1].v),t:'d'};
    if(name==='fabs')return{v:Math.abs(a[0].v),t:'d'};
    return{v:Math.abs(a[0].v)|0,t:'i'};
  }
  function execDecl(s,fr){
    for(const d of s.decls){
      const va={name:d.name,type:s.type,v:0,init:false};
      if(d.init)store(va,ev(d.init,fr),d.line);
      fr.scopes[fr.scopes.length-1].set(d.name,va);
    }
  }
  function exec(s,fr){
    tick(s.line);curLine=s.line;
    if(s.k!=='block'&&s.k!=='empty'&&s.k!=='while'&&s.k!=='for'&&s.k!=='do')hit(s.line);
    switch(s.k){
      case 'block':{
        fr.scopes.push(new Map());
        try{for(const st of s.body){const r=exec(st,fr);if(r)return r;}}
        finally{fr.scopes.pop();}
        return;
      }
      case 'empty':return;
      case 'decl':execDecl(s,fr);return;
      case 'expr':ev(s.e,fr);return;
      case 'if':{
        if(ev(s.cond,fr).v)return exec(s.then,fr);
        if(s.els)return exec(s.els,fr);
        return;
      }
      case 'while':{
        while(true){
          tick(s.line);hit(s.line);
          if(!ev(s.cond,fr).v)break;
          const r=exec(s.body,fr);
          if(r){if(r.k==='break')break;if(r.k!=='continue')return r;}
        }
        return;
      }
      case 'do':{
        while(true){
          tick(s.line);hit(s.line);
          const r=exec(s.body,fr);
          if(r){if(r.k==='break')break;if(r.k!=='continue')return r;}
          hit(s.cline);
          if(!ev(s.cond,fr).v)break;
        }
        return;
      }
      case 'for':{
        fr.scopes.push(new Map());
        try{
          if(s.init){if(s.init.k==='decl')execDecl(s.init,fr);else s.init.list.forEach(e=>ev(e,fr));}
          while(true){
            tick(s.line);hit(s.line);
            if(s.cond&&!ev(s.cond,fr).v)break;
            const r=exec(s.body,fr);
            if(r){if(r.k==='break')break;if(r.k!=='continue')return r;}
            if(s.step)s.step.forEach(e=>ev(e,fr));
          }
        }finally{fr.scopes.pop();}
        return;
      }
      case 'switch':{
        const x=ev(s.e,fr);
        fr.scopes.push(new Map());
        try{
          let start=-1;
          for(let i=0;i<s.cases.length;i++){const c=s.cases[i];if(c.test&&ev(c.test,fr).v===x.v){start=i;break;}}
          if(start<0)start=s.cases.findIndex(c=>!c.test);
          if(start>=0){
            for(let i=start;i<s.cases.length;i++){
              for(const st of s.cases[i].body){
                const r=exec(st,fr);
                if(r){if(r.k==='break')return;return r;}
              }
            }
          }
        }finally{fr.scopes.pop();}
        return;
      }
      case 'break':return{k:'break'};
      case 'continue':return{k:'continue'};
      case 'return':return{k:'return',v:s.e?ev(s.e,fr):null};
    }
  }
  for(const d of globalDecls)execDecl(d,gf);
  const main=funcs.get('main');
  const r=callFn({name:'main',args:[],line:main.line,builtin:false},gf);
  res.exit=r.v;
}

function runC(src,stdin){
  const res={shown:[],raw:'',warns:[],error:null,exit:0,hits:new Map()};
  try{
    const {toks,inc}=lex(src);
    const ps=new Parser(toks,inc);
    const g=ps.parseProgram();
    ps.warns.forEach(w=>res.warns.push(w));
    interpret(ps,g,stdin||'',res);
  }catch(e){
    if(e instanceof CErr){
      res.error={msg:e.message,line:e.line,kind:e.kind};
      if(e.kind==='compile'){res.shown=[];res.raw='';res.hits=new Map();}
    }else if(e instanceof RangeError){
      res.error={msg:'เรียกฟังก์ชันซ้อนกันลึกเกินไป (recursion ไม่มีเงื่อนไขหยุด)',line:0,kind:'run'};
    }else res.error={msg:'ข้อผิดพลาดภายในระบบ: '+e.message,line:0,kind:'compile'};
  }
  return res;
}

function showRes(r,src,openTrace){
  let h='';
  const compileErr=r.error&&r.error.kind==='compile';
  if(compileErr){
    h+=`<div class="box err"><b>❌ คอมไพล์ไม่ผ่าน</b><br>${r.error.line?'บรรทัดที่ '+r.error.line+': ':''}${esc(r.error.msg)}</div>`;
  }else{
    h+=`<div class="tlabel">ผลลัพธ์บนหน้าจอ (ตัวอักษรสีเหลืองคือสิ่งที่ผู้ใช้พิมพ์)</div><div class="term mono">${r.shown.join('')||'(ยังไม่มีข้อความแสดง)'}</div>`;
    if(r.error)h+=`<div class="box err"><b>❌ โปรแกรมหยุดทำงาน</b><br>${r.error.line?'บรรทัดที่ '+r.error.line+': ':''}${esc(r.error.msg)}</div>`;
    else h+=`<div class="box good">✅ โปรแกรมทำงานสำเร็จ</div>`;
  }
  if(r.warns.length)h+=`<div class="box warn"><b>⚠️ ข้อสังเกต</b><ul>${r.warns.map(w=>`<li>บรรทัดที่ ${w.line}: ${esc(w.msg)}</li>`).join('')}</ul></div>`;
  if(!compileErr&&r.hits.size){
    const lines=src.split('\n');
    h+=`<details class="trace" ${openTrace?'open':''}><summary>🔍 ดูว่าแต่ละบรรทัดทำงานกี่ครั้ง</summary><div class="tlabel">แถบสีเขียว = บรรทัดที่ทำงาน (×จำนวนครั้ง) บรรทัดจาง = ไม่ได้ทำงาน หรือเป็นเครื่องหมาย { } คอมเมนต์ บรรทัดว่าง</div><div class="tr">${lines.map((l,i)=>{const c=r.hits.get(i+1)||0;return `<div class="trl ${c?'on':'off'}"><span class="tn">${i+1}</span><span class="tc">${c?'×'+c:''}</span><code>${esc(l)||' '}</code></div>`;}).join('')}</div></details>`;
  }
  return h;
}

function mkEditor(host,cfg){
  host.innerHTML=`<textarea class="code" spellcheck="false" wrap="off"></textarea>${cfg.input!==undefined?'<label class="lab">ข้อมูลที่ต้องพิมพ์ให้โปรแกรม (สำหรับ scanf คั่นด้วยเว้นวรรค)<input class="inp"></label>':''}<div class="btns"><button class="btn go">▶ รันโปรแกรม</button><button class="btn rs">↺ เริ่มใหม่</button></div><div class="res"></div>`;
  const ta=$('textarea',host),inp=$('.inp',host),res=$('.res',host);
  ta.value=cfg.code;ta.rows=Math.min(24,cfg.code.split('\n').length+1);
  if(inp)inp.value=cfg.input;
  const run=()=>{const src=ta.value;res.innerHTML=showRes(runC(src,inp?inp.value:''),src,!!cfg.trace);};
  $('.go',host).onclick=run;
  $('.rs',host).onclick=()=>{ta.value=cfg.code;if(inp)inp.value=cfg.input;res.innerHTML='';};
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end');}
    if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run();}
  });
  (cfg.tries||[]).forEach(t=>{
    const b=document.createElement('button');b.className='btn';b.textContent=t.label;
    b.onclick=()=>{ta.value=t.fn(ta.value);run();};
    $('.btns',host).appendChild(b);
  });
  return{get:()=>ta.value};
}
const norm=s=>s.replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').trim();
function mkMission(host,cfg,stepId,onDone){
  const hasIn=cfg.tests.some(t=>t.input!==undefined);
  host.innerHTML=`<h3 style="margin-top:0">🎯 ภารกิจ: ${cfg.title}</h3>${cfg.task}
  <div class="tw"><table><tr>${hasIn?'<th>พิมพ์ให้โปรแกรม</th>':''}<th>ต้องได้ผลลัพธ์</th></tr>${cfg.tests.map(t=>`<tr>${hasIn?`<td><code>${esc(t.input||'')}</code></td>`:''}<td><pre style="margin:0" class="mono">${t.expected===''?'(ไม่แสดงอะไรเลย)':esc(t.expected)}</pre></td></tr>`).join('')}</table></div>
  <div class="ed"></div>
  <div class="btns"><button class="btn ok chk">✔ ตรวจคำตอบ</button><button class="btn hint">💡 ขอคำใบ้</button><button class="btn sol">👀 ดูเฉลย</button></div>
  <div class="hb"></div><div class="cr"></div>`;
  const ed=mkEditor($('.ed',host),{code:cfg.code,input:hasIn?cfg.tests[0].input:undefined});
  $('.hint',host).onclick=()=>{$('.hb',host).innerHTML=`<div class="box warn">💡 ${cfg.hint}</div>`;};
  $('.sol',host).onclick=()=>{$('.hb',host).innerHTML='<div class="box warn">เฉลย (ลองทำเองก่อน แล้วค่อยเทียบนะ)<pre class="show"></pre></div>';$('.hb pre',host).textContent=cfg.solution;};
  $('.chk',host).onclick=()=>{
    const code=ed.get();let all=true,h='<ul>';
    (cfg.requires||[]).forEach(q=>{const ok=q.re.test(code);if(!ok)all=false;h+=`<li>${ok?'✅':'❌'} ${q.msg}</li>`;});
    cfg.tests.forEach((t,i)=>{
      const r=runC(code,t.input||'');
      if(r.error){all=false;h+=`<li>❌ ชุดทดสอบที่ ${i+1}: ${r.error.kind==='compile'?'คอมไพล์ไม่ผ่าน':'โปรแกรมหยุดทำงาน'} ${r.error.line?'(บรรทัด '+r.error.line+') ':''}${esc(r.error.msg)}</li>`;return;}
      const ok=norm(r.raw)===norm(t.expected);if(!ok)all=false;
      h+=`<li>${ok?'✅':'❌'} ชุดทดสอบที่ ${i+1}${t.input?` (พิมพ์ <code>${esc(t.input)}</code>)`:''}`;
      if(!ok)h+=`<br>ต้องได้:<pre class="show">${esc(t.expected)||'(ไม่แสดงอะไรเลย)'}</pre>แต่ได้:<pre class="show">${esc(r.raw)||'(ว่างเปล่า)'}</pre>`;
      h+='</li>';
    });
    h+='</ul>';
    if(all){progress[stepId]=true;saveP();onDone();h='<div class="box good"><b>🎉 ผ่านแล้ว เก่งมาก!</b></div>'+h;}
    else h='<div class="box err"><b>ยังไม่ผ่าน ไม่เป็นไร ลองดูผลเปรียบเทียบแล้วแก้อีกนิด</b></div>'+h;
    $('.cr',host).innerHTML=h;
  };
  if(progress[stepId])$('.cr',host).innerHTML='<div class="box good">✅ คุณเคยทำภารกิจนี้ผ่านแล้ว</div>';
}

function mkCompare(host){
  host.innerHTML=`<h3>🧪 ตัวทดลองเครื่องหมายเปรียบเทียบ</h3><p>เปลี่ยนค่า a และ b แล้วดูว่านิพจน์ไหนเป็นจริง (1) หรือเท็จ (0)</p>
  <div class="row"><label>ค่า a<input class="txt a" value="7"></label><label>ค่า b<input class="txt b" value="3"></label></div><div class="out"></div>`;

function mkLoopSim(host){
  host.innerHTML=`<h3>🧪 ตัวจำลองรอบของ for</h3><p>ตั้งค่า 3 ส่วนของ for แล้วดูว่า loop วนกี่รอบ ลองตั้งให้เป็น infinite loop ดูได้</p>
  <div class="row"><label>เริ่มที่<input class="txt a" value="1"></label><label>เงื่อนไข<select class="o"><option value="<">&lt;</option><option value="<=" selected>&lt;=</option><option value=">">&gt;</option><option value=">=">&gt;=</option></select></label><label>ค่าสิ้นสุด<input class="txt b" value="5"></label><label>ปรับค่าทีละ<input class="txt s" value="1"></label></div><div class="out"></div>`;
  const upd=()=>{
    const q=s=>$(s,host);const o=q('.out');
    const A=Number(q('.a').value),B=Number(q('.b').value),S=Number(q('.s').value),op=q('.o').value;
    if([q('.a').value,q('.b').value,q('.s').value].some(x=>x.trim()==='')||![A,B,S].every(isFinite)){o.innerHTML='<div class="box warn">กรอกตัวเลขให้ครบทุกช่อง</div>';return;}
    const test=i=>op==='<'?i<B:op==='<='?i<=B:op==='>'?i>B:i>=B;
    const upTxt=S===1?'i++':S===-1?'i--':(S<0?`i -= ${-S}`:`i += ${S}`);
    const code=`for (i = ${A}; i ${op} ${B}; ${upTxt}) {\n    printf("%d ", i);\n}`;
    let i=A;const rows=[];
    while(test(i)&&rows.length<30){rows.push(i);i+=S;}
    const inf=rows.length>=30&&test(i);
    let h=`<pre class="show"></pre>`;
    if(!rows.length)h+='<div class="box warn">เงื่อนไขเป็นเท็จตั้งแต่แรก loop จึงทำงาน 0 รอบ</div>';
    else{
      h+=`<div class="tw"><table><tr><th>รอบที่</th><th>ค่า i</th><th>ตรวจเงื่อนไข</th></tr>${rows.map((v,k)=>`<tr><td>${k+1}</td><td>${v}</td><td>${v} ${esc(op)} ${B} เป็นจริง จึงทำงาน</td></tr>`).join('')}${inf?'':`<tr><td>-</td><td>${i}</td><td>${i} ${esc(op)} ${B} เป็นเท็จ ออกจาก loop</td></tr>`}</table></div>`;
      h+=inf?'<div class="box err">⚠️ วนเกิน 30 รอบแล้วยังไม่จบ น่าจะเป็น <b>infinite loop</b> (ตรวจทิศทางการปรับค่ากับเงื่อนไข)</div>':`<div class="box good">วนทั้งหมด <b>${rows.length}</b> รอบ ผลที่ printf แสดง: <code>${rows.join(' ')}</code></div>`;
    }
    o.innerHTML=h;$('pre',o).textContent=code;
  };
  host.querySelectorAll('input,select').forEach(e=>e.oninput=upd);upd();
}

{name:'5 for',title:'ขั้นที่ 5: for วนซ้ำตามจำนวนรอบ',widget:'loop',
 learn:C`<p><code>for</code> รวม 3 ส่วนของ loop (เริ่มต้น เงื่อนไข ปรับค่า) ไว้ในบรรทัดเดียว เหมาะเมื่อรู้จำนวนรอบ</p>
 <pre class="show">for (i = 1; i &lt;= 5; i++) {
//   ^ เริ่มต้น  ^ เงื่อนไข  ^ ปรับค่าหลังจบแต่ละรอบ
    printf("%d\n", i);
}</pre>
 <p>ลำดับการทำงาน: ① ตั้งค่าเริ่มต้น (ครั้งเดียว) → ② ตรวจเงื่อนไข → ③ ทำคำสั่งในบล็อก → ④ ปรับค่า → กลับไป ②</p>
 <table><tr><th>ต้องการ</th><th>เขียนว่า</th></tr>
 <tr><td>นับขึ้น 1 ถึง 10</td><td><code>for (i = 1; i &lt;= 10; i++)</code></td></tr>
 <tr><td>นับลง 10 ถึง 1</td><td><code>for (i = 10; i &gt;= 1; i--)</code></td></tr>
 <tr><td>เลขคู่ 2 ถึง 20</td><td><code>for (i = 2; i &lt;= 20; i += 2)</code></td></tr>
 <tr><td>วน n รอบ</td><td><code>for (i = 0; i &lt; n; i++)</code></td></tr></table>
 <p>มาตรฐานใหม่ของภาษาซีอนุญาตให้ประกาศตัวแปรในวงเล็บ for ได้ เช่น <code>for (int i = 0; i &lt; 5; i++)</code></p>`,
 labs:[{tip:'ตารางสูตรคูณ ลองเปลี่ยนเลขแม่ (ช่องข้อมูล) หรือเปลี่ยน 12 เป็นค่าอื่น',trace:true,input:'7',
  code:C`#include <stdio.h>

 mission:{title:'แฟกทอเรียล',task:'<p>รับจำนวนเต็ม <code>n</code> (0 ถึง 12) แล้วหา n! = 1 × 2 × 3 × … × n ด้วย <code>for</code> (กำหนดให้ 0! = 1) แสดงผลเป็น <code>Factorial=…</code></p>',hint:'ตั้ง f = 1 ก่อน แล้ว for (i = 1; i <= n; i++) { f *= i; } ถ้า n เป็น 0 loop จะไม่ทำงานและ f ยังเป็น 1 พอดี',
  code:C`#include <stdio.h>

  solution:C`#include <stdio.h>

{name:'6 break/ซ้อน',title:'ขั้นที่ 6: break, continue และ loop ซ้อน loop',
 learn:C`<h3>ควบคุมการวนด้วย break และ continue</h3>
 <table><tr><th>คำสั่ง</th><th>ผล</th></tr><tr><td><code>break;</code></td><td>ออกจาก loop ทันที</td></tr><tr><td><code>continue;</code></td><td>ข้ามคำสั่งที่เหลือของรอบนี้ แล้วไปรอบถัดไป</td></tr></table>
 <h3>loop ซ้อน loop (Nested loop)</h3>
 <p>เหมือนเข็มนาฬิกา: เข็มชั่วโมง (loop นอก) ขยับ 1 ครั้ง เข็มนาที (loop ใน) วนครบ 1 รอบ ถ้า loop นอกวน 3 รอบ และ loop ในวน 4 รอบ ข้อความใน loop ในจะทำงานทั้งหมด 3 × 4 = <b>12</b> ครั้ง ใช้บ่อยกับการวาดรูปแบบและตาราง</p>`,
 labs:[
  {tip:'วาดสามเหลี่ยมดอกจัน ดูใน "🔍 บรรทัดที่ทำงาน" ว่า printf("*") ทำงานรวมกี่ครั้ง (ลองเปลี่ยนเลขช่องข้อมูล)',trace:true,input:'5',
   code:C`#include <stdio.h>

int main(void)
{
    int n, row, col;

    scanf("%d", &n);

    for (row = 1; row <= n; row++) {
        for (col = 1; col <= row; col++) {
            printf("*");
        }
        printf("\n");
    }
    return 0;
}`},
  {tip:'ข้ามผลคูณของ 3 (continue) และหยุดเมื่อถึง 8 (break) ผลลัพธ์คือ 1 2 4 5 7',trace:true,
   code:C`#include <stdio.h>

int main(void)
{
    int i;

    for (i = 1; i <= 10; i++) {
        if (i % 3 == 0) {
            continue;
        }
        if (i == 8) {
            break;
        }
        printf("%d ", i);
    }
    printf("\n");
    return 0;
}`}],
 mission:{title:'สามเหลี่ยมตัวเลข',task:'<p>รับจำนวนเต็ม <code>n</code> แล้วแสดงสามเหลี่ยมตัวเลข โดยบรรทัดที่ k แสดงเลข 1 ถึง k ติดกัน (ตัวอย่างเมื่อ n = 4)</p>',hint:'loop นอกวน row จาก 1 ถึง n, loop ในวน col จาก 1 ถึง row แล้ว printf("%d", col); พอจบ loop ในค่อย printf("\\n");',

 learn:C`<p><b>ฟังก์ชัน (function)</b> คือชุดคำสั่งที่ตั้งชื่อไว้ แล้วเรียกใช้ซ้ำได้ ช่วยให้โปรแกรม <b>อ่านง่าย แก้ง่าย และไม่ต้องเขียนซ้ำ</b> คุณใช้ฟังก์ชันมาตลอดแล้ว เช่น <code>printf</code>, <code>scanf</code> และ <code>main</code> ตอนนี้จะสร้างเองบ้าง คลิกแต่ละบรรทัดเพื่อดูคำอธิบาย</p>`,

 <tr><td>ส่งค่ากลับ</td><td><code>int square(int x)</code></td><td>ใช้ <code>return</code> ส่งค่า เรียกใช้ในนิพจน์ได้</td></tr>

    printf("\n");

}`,tests:[{input:'10',expected:'2 3 5 7\n'},{input:'20',expected:'2 3 5 7 11 13 17 19\n'},{input:'2',expected:'2\n'},{input:'1',expected:''}],requires:[{re:/int\s+isPrime\s*\(\s*int\s+\w+\s*\)/,msg:'เขียนฟังก์ชัน int isPrime(int n)'},{re:/(for|while)\s*\(/,msg:'ใช้ loop'}],
  solution:C`#include <stdio.h>

int isPrime(int n)
{
    int i;
    if (n < 2) {
        return 0;
    }
    for (i = 2; i < n; i++) {
        if (n % i == 0) {
            return 0;
        }
    }
    return 1;
}

int main(void)
{
    int n, k;
    scanf("%d", &n);
    for (k = 2; k <= n; k++) {
        if (isPrime(k)) {
            printf("%d ", k);
        }
    }
    printf("\n");
    return 0;
}`},

/* =====================================================================

let cur=0;
function renderDots(){
  $('#steps').innerHTML=STEPS.map((s,i)=>`<button class="dot ${i===cur?'cur':''} ${progress['a'+i]?'done':''}" data-i="${i}">${progress['a'+i]?'✅ ':''}${s.name}</button>`).join('');
  document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){
  cur=i;const S=STEPS[i];
  let h=`<div class="card learn"><h2>${S.title}</h2>${S.learn}${S.annot?'<div id="an"></div>':''}${S.learn2||''}</div>`;
  if(S.widget)h+='<div class="card"><div id="wd"></div></div>';
  S.labs.forEach((l,k)=>{h+=`<div class="card"><h3 style="margin-top:0">🧪 ลองรันดู${S.labs.length>1?' ตัวอย่างที่ '+(k+1):''}</h3><p>${l.tip}</p><div id="lab${k}"></div></div>`;});
  h+=`<div class="card mission" id="ms"></div><div class="card quiz" id="qz"></div>`;
  if(S.last)h+=`<div class="card fin"><h2>🎉 จบบทเรียนแล้ว!</h2><p>คุณเขียนโปรแกรมที่ <b>ตัดสินใจ</b> (<code>if</code>, <code>switch</code>), <b>ทำซ้ำ</b> (<code>for</code>, <code>while</code>, <code>do-while</code>) และ <b>แยกเป็นฟังก์ชัน</b> ได้แล้ว ขั้นต่อไปที่น่าเรียนคือ อาร์เรย์ (array) สตริง (string) และพอยน์เตอร์ (pointer)</p></div>`;
  h+=`<div class="nav"><button class="btn" id="pv" ${i===0?'disabled':''}>◀ ขั้นก่อนหน้า</button><button class="btn go" id="nx" ${i===STEPS.length-1?'disabled':''}>ขั้นต่อไป ▶</button></div>`;
  $('#page').innerHTML=h;
  if(S.annot)mkAnnot($('#an'),S.annot);
  if(S.widget==='compare')mkCompare($('#wd'));
  if(S.widget==='loop')mkLoopSim($('#wd'));
  S.labs.forEach((l,k)=>mkEditor($('#lab'+k),l));
  mkMission($('#ms'),S.mission,'a'+i,renderDots);
  mkQuiz($('#qz'),S.quiz);
  $('#pv').onclick=()=>go(i-1);
  $('#nx').onclick=()=>go(i+1);
  renderDots();
  window.scrollTo(0,0);
}
$('#rstp').onclick=()=>{if(confirm('ต้องการล้างความก้าวหน้าทั้งหมดหรือไม่')){progress={};saveP();go(cur);}};
go(0);
</script>
