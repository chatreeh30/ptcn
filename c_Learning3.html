<body>
<div class="wrap">
  <h1>🧠 เรียนภาษาซี: อาร์เรย์ สตริง และพอยน์เตอร์</h1>
  <p class="sub">ทำทีละขั้น: อ่าน → ลองเล่น → ลองรัน → ทำภารกิจ → ตอบคำถาม (ควรเรียน printf, ตัวแปร, if, loop และฟังก์ชันมาก่อน)</p>
  <div class="steps" id="steps"></div>
  <div id="page"></div>
  <button class="reset" id="rstp">ล้างความก้าวหน้าทั้งหมด</button>
</div>

<script>
/* =====================================================================
   ส่วนที่ 1: ตัวจำลองภาษาซี (lexer -> parser -> interpreter พร้อมหน่วยความจำ)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=n=>'0x'+n.toString(16);
class CErr extends Error{constructor(m,line,kind){super(m);this.line=line||0;this.kind=kind||'compile';}}
const KWS=new Set(['auto','break','case','char','const','continue','default','do','double','else','enum','extern','float','for','goto','if','int','long','register','return','short','signed','sizeof','static','struct','switch','typedef','union','unsigned','void','volatile','while']);
const BT=['int','float','double','char','long'];
const ESC={n:'\n',t:'\t','\\':'\\','"':'"',"'":"'",'0':'\0',r:'\r',a:'\x07'};
const OPS2=['==','!=','<=','>=','&&','||','++','--','+=','-=','*=','/=','%='];
const OPS1='+-*/%=<>!(){};,:?&[]';
const RX_NUM=/(\d+\.\d*|\.\d+|\d+)([eE][+-]?\d+)?[fFlL]*/y;
const RX_ID=/[A-Za-z_]\w*/y;
const RX_CHR=/'(\\.|[^\\'\n])'/y;
const FMT_RE=/%([-+0 ]*)(\d*)(?:\.(\d+))?(ll|l|z)?([dicfsuxXp%])/g;
const HEADERS=['stdio.h','math.h','stdlib.h','string.h','ctype.h'];
const BUILTINS={
  printf:{h:'stdio.h'},scanf:{h:'stdio.h'},puts:{h:'stdio.h',n:1},putchar:{h:'stdio.h',n:1},
  sqrt:{h:'math.h',n:1},pow:{h:'math.h',n:2},fabs:{h:'math.h',n:1},abs:{h:'stdlib.h',n:1},
  strlen:{h:'string.h',n:1},strcpy:{h:'string.h',n:2},strncpy:{h:'string.h',n:3},strcat:{h:'string.h',n:2},strcmp:{h:'string.h',n:2},
  toupper:{h:'ctype.h',n:1},tolower:{h:'ctype.h',n:1},isalpha:{h:'ctype.h',n:1},isdigit:{h:'ctype.h',n:1},
  isupper:{h:'ctype.h',n:1},islower:{h:'ctype.h',n:1},isspace:{h:'ctype.h',n:1},isalnum:{h:'ctype.h',n:1}
};

/* ---------- ระบบชนิดข้อมูล ---------- */
const mkT=(b,p,d)=>({b,p:p||0,d:d||null});
const TI=mkT('int'),TD=mkT('double'),TL=mkT('long');
const BSIZE={int:4,float:4,double:8,char:1,long:8,void:1};
function sizeOf(T){
  if(T.d){let n=1;for(const x of T.d)n*=x;return n*sizeOf({b:T.b,p:T.p,d:null});}
  if(T.p>0)return 8;
  return BSIZE[T.b];
}
const elemT=T=>T.d?mkT(T.b,T.p,T.d.length>1?T.d.slice(1):null):mkT(T.b,T.p-1,null);
const catOf=T=>(T.d||T.p>0)?'p':(T.b==='float'||T.b==='double')?'d':T.b==='long'?'l':'i';
const tName=T=>T.b+(T.p?' '+'*'.repeat(T.p):'')+(T.d?T.d.map(x=>'['+x+']').join(''):'');
function decay(x,line){
  if(!x.t.d)return x;
  if(x.t.d.length>1)throw new CErr('อาร์เรย์หลายมิติทั้งก้อนใช้คำนวณหรือส่งต่อโดยตรงยังไม่ได้ในบทนี้ (ให้ใช้ m[i][j])',line,'run');
  return{v:x.v,t:mkT(x.t.b,x.t.p+1,null)};
}
function convNum(b,v){
  switch(b){
    case 'int':return Math.trunc(v)|0;
    case 'char':return(Math.trunc(v)<<24)>>24;
    case 'long':return Math.trunc(v);
    case 'float':return Math.fround(v);
    default:return v;
  }
}

/* ---------- Lexer ---------- */
function lex(src,nested){
  const toks=[],inc=new Set(),defs=new Map();let i=0,line=1;const n=src.length;
  const add=(t,v,x)=>toks.push(Object.assign({t,v,line},x||{}));
  while(i<n){
    const c=src[i];
    if(c==='\n'){line++;i++;continue;}
    if(/\s/.test(c)){i++;continue;}
    if(c==='/'&&src[i+1]==='/'){while(i<n&&src[i]!=='\n')i++;continue;}
    if(c==='/'&&src[i+1]==='*'){
      const j=src.indexOf('*/',i+2);
      if(j<0)throw new CErr('คอมเมนต์ /* ไม่ได้ปิดด้วย */',line);
      for(let k=i;k<j;k++)if(src[k]==='\n')line++;
      i=j+2;continue;
    }
    if(c==='#'){
      let j=i;while(j<n&&src[j]!=='\n')j++;
      const ln=src.slice(i,j).replace(/\/\/.*$/,'').replace(/\/\*.*?\*\//g,'').trim();
      let m=/^#\s*include\s*<([a-z]+\.h)>$/.exec(ln);
      if(m&&HEADERS.includes(m[1])){inc.add(m[1]);i=j;continue;}
      m=/^#\s*define\s+([A-Za-z_]\w*)\s+(\S[\s\S]*)$/.exec(ln);
      if(m&&!nested){
        const sub=lex(m[2],true);
        if(sub.toks.length!==2)throw new CErr('#define ในบทนี้ใช้ได้กับค่าเดียว เช่น #define N 5',line);
        defs.set(m[1],sub.toks[0]);i=j;continue;
      }
      throw new CErr(`บรรทัด "${ln}" ไม่ถูกต้องหรือยังไม่รองรับ (ใช้ได้: #include <stdio.h> <string.h> <ctype.h> <math.h> <stdlib.h> และ #define ชื่อ ค่า)`,line);
    }
    if(c==='"'){
      let j=i+1,s='',closed=false;
      while(j<n){
        const d=src[j];
        if(d==='\n')break;
        if(d==='"'){closed=true;break;}
        if(d==='\\'&&j+1<n){const e=src[j+1];s+=(e in ESC)?ESC[e]:e;j+=2;continue;}
        s+=d;j++;
      }
      if(!closed)throw new CErr('ข้อความที่เปิดด้วยเครื่องหมาย " ไม่ได้ปิดด้วย " ในบรรทัดเดียวกัน',line);
      add('str',s);i=j+1;continue;
    }
    if(c==="'"){
      RX_CHR.lastIndex=i;const m=RX_CHR.exec(src);
      if(!m)throw new CErr("ค่าอักขระ (char) ต้องมี 1 ตัวอักษรในเครื่องหมาย ' ' เช่น 'A' (ถ้าเป็นข้อความหลายตัวอักษรให้ใช้ \" \")",line);
      const ch=m[1].length===2?((m[1][1] in ESC)?ESC[m[1][1]]:m[1][1]):m[1];
      add('chr',ch.charCodeAt(0));i+=m[0].length;continue;
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      RX_NUM.lastIndex=i;const m=RX_NUM.exec(src);
      const body=m[0].replace(/[fFlL]+$/,'');
      const isD=/[.eE]/.test(body);const v=parseFloat(body);
      add('num',v,{ty:isD?'d':(v>2147483647?'l':'i'),raw:m[0]});i+=m[0].length;continue;
    }
    if(/[A-Za-z_]/.test(c)){
      RX_ID.lastIndex=i;const m=RX_ID.exec(src);
      if(defs.has(m[0]))toks.push(Object.assign({},defs.get(m[0]),{line}));
      else add('id',m[0]);
      i+=m[0].length;continue;
    }
    const two=src.substr(i,2);
    if(OPS2.includes(two)){add('op',two);i+=2;continue;}
    if(OPS1.includes(c)){add('op',c);i++;continue;}
    if(c==='|')throw new CErr("ต้องเขียน || (สองตัวติดกัน) สำหรับ 'หรือ'",line);
    throw new CErr(`ใช้อักขระ '${c}' ในตำแหน่งนี้ไม่ได้ (ข้อความภาษาไทยเขียนได้เฉพาะในคอมเมนต์ หรือในเครื่องหมาย " ")`,line);
  }
  toks.push({t:'eof',v:'',line});
  return{toks,inc};
}

/* ---------- Parser ---------- */
class Parser{
  constructor(toks,inc){
    this.toks=toks;this.p=0;this.inc=inc;this.funcs=new Map();
    this.scopes=[new Map()];this.warns=[];this.loopDepth=0;this.switchDepth=0;
  }
  get tk(){return this.toks[this.p];}
  peek(k){return this.toks[Math.min(this.p+k,this.toks.length-1)];}
  prevLine(){return this.p>0?this.toks[this.p-1].line:1;}
  isOp(v){const t=this.tk;return t.t==='op'&&t.v===v;}
  isId(v){const t=this.tk;return t.t==='id'&&t.v===v;}
  eatOp(v){if(this.isOp(v)){this.p++;return true;}return false;}
  desc(t){
    if(t.t==='eof')return 'จบไฟล์';
    if(t.t==='str')return '"'+t.v+'"';
    if(t.t==='chr')return "'"+String.fromCharCode(t.v)+"'";
    if(t.t==='num')return t.raw;
    return t.v;
  }
  expectOp(v,why,force){
    if(this.isOp(v))return this.toks[this.p++];
    const t=this.tk;
    if(force)throw new CErr(why,this.prevLine());
    if(v===';')throw new CErr(`ขาดเครื่องหมาย ; ท้ายคำสั่ง (ตรวจท้ายบรรทัดที่ ${this.prevLine()}) เพราะถัดมาพบ '${this.desc(t)}'`,this.prevLine());
    throw new CErr(`ต้องมีเครื่องหมาย ${v} ${why||''} (แต่พบ '${this.desc(t)}')`,t.line);
  }
  pushS(){this.scopes.push(new Map());}
  popS(){this.scopes.pop();}
  declare(name,T,line){
    if(KWS.has(name))throw new CErr(`'${name}' เป็นคำสงวนของภาษาซี ใช้เป็นชื่อไม่ได้`,line);
    const s=this.scopes[this.scopes.length-1];
    if(s.has(name))throw new CErr(`ประกาศตัวแปร '${name}' ซ้ำในขอบเขตเดียวกัน`,line);
    s.set(name,T);
  }
  lookup(name){for(let i=this.scopes.length-1;i>=0;i--)if(this.scopes[i].has(name))return this.scopes[i].get(name);return null;}
  unknown(name,line,isCall){
    const low=name.toLowerCase();
    if(low!==name&&(KWS.has(low)||BUILTINS[low]))return new CErr(`ไม่รู้จัก '${name}' ภาษาซีแยกตัวพิมพ์เล็ก-ใหญ่ ต้องเขียนเป็น '${low}'`,line);
    for(const f of this.funcs.keys())if(f!==name&&f.toLowerCase()===low)return new CErr(`ไม่รู้จัก '${name}' คุณหมายถึง '${f}' หรือเปล่า (ตัวพิมพ์เล็ก-ใหญ่ต้องตรงกัน)`,line);
    if(isCall)return new CErr(`ไม่รู้จักฟังก์ชัน '${name}' ต้องเขียนฟังก์ชันไว้ก่อนจุดที่เรียกใช้ (เหนือ main) และตรวจการสะกดชื่อ`,line);
    const names=[];this.scopes.forEach(s=>s.forEach((_,k)=>names.push(k)));
    const m=names.find(k=>k.toLowerCase()===low);
    if(m)return new CErr(`ไม่รู้จักตัวแปร '${name}' คุณหมายถึง '${m}' หรือเปล่า`,line);
    return new CErr(`ยังไม่ได้ประกาศตัวแปร '${name}' ต้องประกาศก่อนใช้ และตรวจการสะกด`,line);
  }
  parseBase(){
    while(this.isId('const'))this.p++;
    const t=this.tk;
    if(!(t.t==='id'&&(BT.includes(t.v)||t.v==='void')))throw new CErr(`ต้องมีชนิดข้อมูล เช่น int หรือ char (พบ '${this.desc(t)}')`,t.line);
    this.p++;
    if(t.v==='long'){if(this.isId('long'))this.p++;if(this.isId('int'))this.p++;}
    while(this.isId('const'))this.p++;
    return t.v;
  }
  isLvKind(e){return e.k==='id'||e.k==='index'||e.k==='deref';}
  checkLv(e,line){
    if(!this.isLvKind(e))throw new CErr('ด้านซ้ายของการกำหนดค่าต้องเป็นตัวแปร ช่องของอาร์เรย์ (เช่น a[0]) หรือ *p',line);
    if(e.k==='id'){
      const T=this.lookup(e.name);
      if(T&&T.d)throw new CErr(`'${e.name}' เป็นอาร์เรย์ จึงกำหนดค่าทั้งอาร์เรย์ด้วย = ไม่ได้ ถ้าเป็นข้อความให้ใช้ strcpy(${e.name}, "...") ถ้าเป็นตัวเลขให้กำหนดทีละช่อง เช่น ${e.name}[0] = 5;`,line);
    }
  }
  constInt(e,line){
    const f=x=>{
      if(x.k==='num'&&Number.isInteger(x.v)&&x.t!==TD)return x.v;
      if(x.k==='un'&&x.op==='-')return -f(x.e);
      if(x.k==='un'&&x.op==='+')return f(x.e);
      if(x.k==='bin'){
        const a=f(x.l),b=f(x.r);
        if(x.op==='+')return a+b;
        if(x.op==='-')return a-b;
        if(x.op==='*')return a*b;
        if(x.op==='/'&&b!==0)return Math.trunc(a/b);
      }
      throw new CErr('ขนาดอาร์เรย์ต้องเป็นค่าคงที่จำนวนเต็ม เช่น 5 หรือ N (เมื่อ N ถูก #define ไว้) ใช้ตัวแปรกำหนดขนาดไม่ได้ในบทนี้',line);
    };
    const v=f(e);
    if(v<=0)throw new CErr('ขนาดอาร์เรย์ต้องมากกว่า 0',line);
    if(v>1000)throw new CErr('ขนาดอาร์เรย์ใหญ่เกินกว่าที่ตัวจำลองรองรับ (ไม่เกิน 1000 ช่อง)',line);
    return v;
  }
  parseProgram(){
    const globals=[];
    while(this.tk.t!=='eof'){
      const t=this.tk;
      if(t.t==='id'&&(BT.includes(t.v)||t.v==='void'||t.v==='const')){
        const start=this.p;
        const base=this.parseBase();
        let stars=0;while(this.isOp('*')){this.p++;stars++;}
        const nt=this.tk;
        if(nt.t!=='id'||KWS.has(nt.v))throw new CErr('หลังชนิดข้อมูลต้องมีชื่อฟังก์ชันหรือชื่อตัวแปร',nt.line);
        const nx=this.peek(1);
        if(nx.t==='op'&&nx.v==='('){this.p++;this.parseFunction(mkT(base,stars),nt);}
        else{this.p=start;globals.push(this.parseDecl());}
      }else if(t.t==='op'&&t.v==='}'){
        throw new CErr('มีเครื่องหมาย } เกินมา ตรวจจำนวน { และ }',t.line);
      }else{
        throw new CErr(`พบ '${this.desc(t)}' นอกฟังก์ชัน คำสั่งต้องอยู่ภายในฟังก์ชัน เช่น main`,t.line);
      }
    }
    const m=this.funcs.get('main');
    if(!m||!m.body)throw new CErr('ไม่พบฟังก์ชัน main โปรแกรมภาษาซีต้องมี int main(void) { ... }',1);
    if(m.params.length)throw new CErr('ฟังก์ชัน main ในบทนี้ไม่รับพารามิเตอร์ ให้เขียนเป็น int main(void)',m.line);
    return globals;
  }
  parseFunction(ret,nt){
    const name=nt.v;
    this.expectOp('(','หลังชื่อฟังก์ชัน');
    const params=[];
    if(this.isId('void')&&this.peek(1).t==='op'&&this.peek(1).v===')')this.p++;
    else if(!this.isOp(')')){
      do{
        const pt=this.tk;
        if(!(pt.t==='id'&&(BT.includes(pt.v)||pt.v==='const'||pt.v==='void')))throw new CErr(`พารามิเตอร์ต้องขึ้นต้นด้วยชนิดข้อมูล เช่น int x (พบ '${this.desc(pt)}')`,pt.line);
        const base=this.parseBase();
        let stars=0;while(this.eatOp('*'))stars++;
        let pn=null;
        if(this.tk.t==='id'&&!KWS.has(this.tk.v)){pn=this.tk.v;this.p++;}
        if(this.isOp('[')){
          this.p++;
          if(!this.isOp(']'))this.parseTernary();
          this.expectOp(']','เพื่อปิด [ ] ของพารามิเตอร์');
          if(this.isOp('['))throw new CErr('พารามิเตอร์อาร์เรย์หลายมิติยังไม่รองรับในบทนี้',nt.line);
          stars++;
        }
        params.push({type:mkT(base,stars),name:pn});
      }while(this.eatOp(','));
    }
    this.expectOp(')','ปิดรายการพารามิเตอร์');
    let fn=this.funcs.get(name);
    if(fn){
      if(tName(fn.ret)!==tName(ret)||fn.params.length!==params.length)throw new CErr(`ฟังก์ชัน '${name}' ถูกประกาศซ้ำด้วยรูปแบบที่ไม่ตรงกับครั้งแรก`,nt.line);
    }else{fn={name,ret,params,body:null,line:nt.line};this.funcs.set(name,fn);}
    if(this.eatOp(';'))return;
    if(!this.isOp('{'))throw new CErr(`หลังส่วนหัวฟังก์ชัน '${name}' ต้องมี { เพื่อเริ่มเนื้อหา`,this.tk.line);
    if(fn.body)throw new CErr(`ฟังก์ชัน '${name}' ถูกเขียนเนื้อหาซ้ำ`,nt.line);
    if(params.some(p=>!p.name))throw new CErr(`พารามิเตอร์ของฟังก์ชัน '${name}' ต้องมีชื่อ`,nt.line);
    fn.params=params;
    this.pushS();params.forEach(p=>this.declare(p.name,p.type,nt.line));
    fn.body=this.parseBlock(true);fn.body.fnBody=true;
    this.popS();
  }
  parseBlock(noScope){
    const open=this.expectOp('{','เพื่อเริ่มบล็อก');
    if(!noScope)this.pushS();
    const body=[];
    while(!this.isOp('}')){
      if(this.tk.t==='eof')throw new CErr(`ขาดเครื่องหมาย } เพื่อปิดบล็อกที่เปิดไว้ที่บรรทัด ${open.line}`,open.line);
      body.push(this.parseStmt());
    }
    this.p++;
    if(!noScope)this.popS();
    return{k:'block',body,line:open.line};
  }
  parseBody(kind){
    this.pushS();if(kind==='loop')this.loopDepth++;
    const s=this.parseStmt();
    if(kind==='loop')this.loopDepth--;
    this.popS();return s;
  }
  parseStmt(){
    const t=this.tk;
    if(t.t==='op'){
      if(t.v==='{')return this.parseBlock();
      if(t.v===';'){this.p++;return{k:'empty',line:t.line};}
    }
    if(t.t==='id'){
      const v=t.v;
      if(BT.includes(v)||v==='const')return this.parseDecl();
      if(v==='if')return this.parseIf();
      if(v==='while')return this.parseWhile();
      if(v==='do')return this.parseDo();
      if(v==='for')return this.parseFor();
      if(v==='switch')return this.parseSwitch();
      if(v==='break'){
        if(!this.loopDepth&&!this.switchDepth)throw new CErr('break ใช้ได้เฉพาะภายใน loop หรือ switch',t.line);
        this.p++;this.expectOp(';');return{k:'break',line:t.line};
      }
      if(v==='continue'){
        if(!this.loopDepth)throw new CErr('continue ใช้ได้เฉพาะภายใน loop',t.line);
        this.p++;this.expectOp(';');return{k:'continue',line:t.line};
      }
      if(v==='return'){
        this.p++;let e=null;
        if(!this.isOp(';'))e=this.parseExpr();
        this.expectOp(';');return{k:'return',e,line:t.line};
      }
      if(v==='else')throw new CErr('พบ else ที่ไม่มี if คู่กัน',t.line);
      if(v==='case'||v==='default')throw new CErr(`'${v}' ใช้ได้เฉพาะภายใน switch`,t.line);
      if(v==='void')throw new CErr('ประกาศตัวแปรชนิด void ไม่ได้',t.line);
      if(KWS.has(v)&&v!=='sizeof')throw new CErr(`'${v}' ยังไม่อยู่ในเนื้อหาของบทเรียนนี้`,t.line);
    }
    const e=this.parseExpr();
    this.expectOp(';');
    return{k:'expr',e,line:t.line};
  }
  parseDecl(){
    const first=this.tk;
    const base=this.parseBase();
    const decls=[];
    do{
      let stars=0;while(this.eatOp('*'))stars++;
      const nt=this.tk;
      if(nt.t==='num')throw new CErr(`ชื่อตัวแปรห้ามขึ้นต้นด้วยตัวเลข (พบ '${nt.raw}')`,nt.line);
      if(nt.t!=='id')throw new CErr(`หลังชนิดข้อมูลต้องมีชื่อตัวแปร (พบ '${this.desc(nt)}')`,nt.line);
      if(KWS.has(nt.v))throw new CErr(`'${nt.v}' เป็นคำสงวนของภาษาซี ใช้เป็นชื่อตัวแปรไม่ได้`,nt.line);
      this.p++;
      if(this.isOp('('))throw new CErr(`ภาษาซีไม่ให้เขียนฟังก์ชันซ้อนในฟังก์ชันอื่น ให้ย้าย '${nt.v}' ไปไว้นอก main`,nt.line);
      const dims=[];
      while(this.isOp('[')){
        this.p++;
        if(this.isOp(']')){dims.push(null);this.p++;}
        else{const e=this.parseTernary();this.expectOp(']','เพื่อปิดขนาดอาร์เรย์');dims.push(this.constInt(e,nt.line));}
      }
      if(dims.slice(1).includes(null))throw new CErr('มิติที่ 2 ต้องระบุขนาด เช่น int m[][3]',nt.line);
      if(dims.length>2)throw new CErr('บทนี้รองรับอาร์เรย์ไม่เกิน 2 มิติ',nt.line);
      const n2=this.tk;
      if(n2.line===nt.line&&n2.t!=='eof'&&!(n2.t==='op'&&['=',';',','].includes(n2.v)))
        throw new CErr(`รูปแบบการประกาศตัวแปรไม่ถูกต้อง หลังชื่อ '${nt.v}' พบ '${this.desc(n2)}' (ตรวจ ; หรือชื่อที่มีเว้นวรรค)`,nt.line);
      if(base==='void'&&stars===0)throw new CErr('ตัวแปรชนิด void ประกาศไม่ได้',nt.line);
      let init=null;
      if(this.eatOp('='))init=this.isOp('{')?this.parseInitList():this.parseAssign();
      const T=this.finishType(base,stars,dims,init,nt);
      this.declare(nt.v,T,nt.line);
      decls.push({name:nt.v,T,init,line:nt.line});
    }while(this.eatOp(','));
    this.expectOp(';');
    return{k:'decl',decls,line:first.line};
  }
  finishType(base,stars,dims,init,nt){
    const line=nt.line;
    if(!dims.length){
      if(init&&init.k==='initlist')throw new CErr(`'${nt.v}' ไม่ใช่อาร์เรย์ จึงใช้ { } กำหนดค่าไม่ได้`,line);
      return mkT(base,stars);
    }
    const isStr=base==='char'&&stars===0&&dims.length===1&&init&&init.k==='str';
    if(dims[0]===null){
      if(!init)throw new CErr(`อาร์เรย์ '${nt.v}' ต้องระบุขนาดใน [ ] หรือกำหนดค่าเริ่มต้น เช่น int a[] = {1, 2, 3};`,line);
      if(init.k==='initlist'){
        if(!init.items.length)throw new CErr(`อาร์เรย์ '${nt.v}' ว่างเปล่า ต้องมีอย่างน้อย 1 ค่า`,line);
        dims[0]=init.items.length;
      }else if(isStr)dims[0]=init.v.length+1;
      else throw new CErr(`อาร์เรย์ '${nt.v}' ต้องกำหนดค่าเริ่มต้นด้วย { ... }`,line);
    }
    if(init){
      if(init.k==='initlist'){
        if(init.items.length>dims[0])throw new CErr(`ใส่ค่าเริ่มต้นของ '${nt.v}' ${init.items.length} ค่า แต่อาร์เรย์มีแค่ ${dims[0]} ช่อง`,line);
      }else if(isStr){
        if(init.v.length>dims[0])throw new CErr(`ข้อความ "${init.v}" ยาว ${init.v.length} ตัวอักษร (ต้องใช้ ${init.v.length+1} ช่องรวม '\\0') แต่ '${nt.v}' มีแค่ ${dims[0]} ช่อง`,line);
        if(init.v.length===dims[0])this.warns.push({line,msg:`'${nt.v}' มี ${dims[0]} ช่องพอดีกับจำนวนตัวอักษร ไม่เหลือที่ให้ '\\0' ปิดท้าย ถ้าใช้ %s หรือฟังก์ชันสตริงจะอ่านเลยขอบเขต ควรเพิ่มขนาดอีกอย่างน้อย 1 ช่อง`});
      }else throw new CErr(`อาร์เรย์ '${nt.v}' ต้องกำหนดค่าเริ่มต้นด้วย { ... } (หรือข้อความใน " " ถ้าเป็น char array)`,line);
    }
    return mkT(base,stars,dims);
  }
  parseInitList(){
    const open=this.expectOp('{');
    const items=[];
    while(!this.isOp('}')){
      if(this.isOp('{'))items.push(this.parseInitList());else items.push(this.parseAssign());
      if(!this.eatOp(','))break;
    }
    this.expectOp('}','เพื่อปิดรายการค่าเริ่มต้น');
    return{k:'initlist',items,line:open.line};
  }
  checkCond(c,line,kw){
    if(c.k==='assign'&&c.op==='=')this.warns.push({line,msg:`ใน ${kw} ใช้ = ซึ่งเป็นการกำหนดค่า ถ้าต้องการเปรียบเทียบให้ใช้ ==`});
  }
  parseIf(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง if ต้องมีวงเล็บเงื่อนไข');
    const cond=this.parseExpr();
    this.expectOp(')','เพื่อปิดเงื่อนไขของ if');
    this.checkCond(cond,t.line,'if');
    const then=this.parseBody('if');
    if(then.k==='empty')this.warns.push({line:t.line,msg:'มีเครื่องหมาย ; ต่อท้าย if (...) ทันที ทำให้คำสั่งที่ตามมาทำงานเสมอ ให้ลบ ; ออก'});
    let els=null;
    if(this.isId('else')){this.p++;els=this.parseBody('if');}
    return{k:'if',cond,then,els,line:t.line};
  }
  parseWhile(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง while ต้องมีวงเล็บเงื่อนไข');
    const cond=this.parseExpr();
    this.expectOp(')','เพื่อปิดเงื่อนไขของ while');
    this.checkCond(cond,t.line,'while');
    const body=this.parseBody('loop');
    if(body.k==='empty')this.warns.push({line:t.line,msg:'มีเครื่องหมาย ; ต่อท้าย while (...) ทันที ทำให้ loop วนคำสั่งว่าง ให้ลบ ; ออก'});
    return{k:'while',cond,body,line:t.line};
  }
  parseDo(){
    const t=this.tk;this.p++;
    const body=this.parseBody('loop');
    if(!this.isId('while'))throw new CErr('do ต้องจบด้วย while (เงื่อนไข);',this.tk.line);
    const w=this.tk;this.p++;
    this.expectOp('(','หลัง while ต้องมีวงเล็บเงื่อนไข');
    const cond=this.parseExpr();
    this.expectOp(')','เพื่อปิดเงื่อนไขของ while');
    this.expectOp(';');
    return{k:'do',cond,body,line:t.line,cline:w.line};
  }
  parseFor(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง for ต้องมีวงเล็บ');
    const msg='ภายในวงเล็บของ for ต้องมี 3 ส่วนคั่นด้วย ; สองตัว เช่น for (i = 0; i < 5; i++)';
    this.pushS();
    let init=null,cond=null,step=null;
    if(this.isOp(';'))this.p++;
    else if(this.tk.t==='id'&&BT.includes(this.tk.v))init=this.parseDecl();
    else{init={k:'exprs',list:this.parseExprList(),line:t.line};this.expectOp(';',msg,true);}
    if(!this.isOp(';'))cond=this.parseExpr();
    this.expectOp(';',msg,true);
    if(!this.isOp(')'))step=this.parseExprList();
    this.expectOp(')','เพื่อปิดวงเล็บของ for');
    if(cond)this.checkCond(cond,t.line,'for');
    const body=this.parseBody('loop');
    this.popS();
    if(body.k==='empty')this.warns.push({line:t.line,msg:'มีเครื่องหมาย ; ต่อท้าย for (...) ทันที ทำให้ loop วนคำสั่งว่าง ให้ลบ ; ออก'});
    return{k:'for',init,cond,step,body,line:t.line};
  }
  parseSwitch(){
    const t=this.tk;this.p++;
    this.expectOp('(','หลัง switch ต้องมีวงเล็บ');
    const e=this.parseExpr();
    this.expectOp(')','เพื่อปิดวงเล็บของ switch');
    const open=this.expectOp('{','เพื่อเริ่มบล็อกของ switch');
    const cases=[];let cur=null;
    this.switchDepth++;this.pushS();
    while(!this.isOp('}')){
      if(this.tk.t==='eof')throw new CErr(`ขาด } ปิด switch ที่บรรทัด ${open.line}`,open.line);
      if(this.isId('case')){
        this.p++;const test=this.parseTernary();
        this.expectOp(':','หลัง case');
        cur={test,body:[]};cases.push(cur);
      }else if(this.isId('default')){
        this.p++;this.expectOp(':','หลัง default');
        cur={test:null,body:[]};cases.push(cur);
      }else{
        if(!cur)throw new CErr('ภายใน switch ต้องขึ้นต้นด้วย case หรือ default',this.tk.line);
        cur.body.push(this.parseStmt());
      }
    }
    this.p++;this.popS();this.switchDepth--;
    return{k:'switch',e,cases,line:t.line};
  }
  parseExpr(){return this.parseAssign();}
  parseExprList(){const l=[this.parseAssign()];while(this.eatOp(','))l.push(this.parseAssign());return l;}
  parseAssign(){
    const left=this.parseTernary();
    const t=this.tk;
    if(t.t==='op'&&['=','+=','-=','*=','/=','%='].includes(t.v)){
      this.checkLv(left,t.line);
      this.p++;
      const right=this.parseAssign();
      return{k:'assign',op:t.v,l:left,e:right,line:t.line};
    }
    return left;
  }
  parseTernary(){
    const c=this.parseBin(0);
    if(this.isOp('?')){
      const t=this.tk;this.p++;
      const a=this.parseAssign();
      this.expectOp(':','ในนิพจน์ ? :');
      const b=this.parseTernary();
      return{k:'cond',c,a,b,line:t.line};
    }
    return c;
  }
  parseBin(level){
    const LV=[['||'],['&&'],['==','!='],['<','>','<=','>='],['+','-'],['*','/','%']];
    if(level>=LV.length)return this.parseUnary();
    let l=this.parseBin(level+1);
    while(this.tk.t==='op'&&LV[level].includes(this.tk.v)){
      const o=this.tk;this.p++;
      const r=this.parseBin(level+1);
      l={k:'bin',op:o.v,l,r,line:o.line};
    }
    return l;
  }
  parseUnary(){
    const t=this.tk;
    if(t.t==='op'){
      if(t.v==='-'||t.v==='+'||t.v==='!'){this.p++;return{k:'un',op:t.v,e:this.parseUnary(),line:t.line};}
      if(t.v==='*'){this.p++;return{k:'deref',e:this.parseUnary(),line:t.line};}
      if(t.v==='&'){
        this.p++;const e=this.parseUnary();
        if(!this.isLvKind(e))throw new CErr('หลังเครื่องหมาย & ต้องเป็นตัวแปรหรือช่องของอาร์เรย์ เช่น &x หรือ &a[2]',t.line);
        return{k:'addr',e,line:t.line};
      }
      if(t.v==='++'||t.v==='--'){
        this.p++;const e=this.parseUnary();
        this.checkLv(e,t.line);
        return{k:'incdec',op:t.v,pre:true,l:e,line:t.line};
      }
      if(t.v==='('){
        const a=this.peek(1),b=this.peek(2);
        if(a.t==='id'&&BT.includes(a.v)&&b.t==='op'&&b.v===')'){
          this.p+=3;return{k:'cast',type:mkT(a.v),e:this.parseUnary(),line:t.line};
        }
      }
    }
    if(t.t==='id'&&t.v==='sizeof'){
      this.p++;
      const a=this.peek(1);
      if(this.isOp('(')&&a.t==='id'&&(BT.includes(a.v)||a.v==='void'||a.v==='const')){
        this.p++;const b=this.parseBase();let s=0;while(this.eatOp('*'))s++;
        this.expectOp(')','หลังชนิดข้อมูลใน sizeof');
        return{k:'sizeof',ty:mkT(b,s),line:t.line};
      }
      return{k:'sizeof',e:this.parseUnary(),line:t.line};
    }
    return this.parsePostfix();
  }
  parsePostfix(){

      if(this.isOp('[')){

  parsePrimary(){

    if(t.t==='chr'){this.p++;return{k:'num',v:t.v,t:TI,line:t.line};}
    if(t.t==='str'){this.p++;return{k:'str',v:t.v,line:t.line};}
    if(t.t==='id'){
      if(t.v==='NULL'){this.p++;return{k:'num',v:0,t:mkT('void',1),line:t.line};}

  }
  parseCall(t){
    const name=t.v,line=t.line;

    const args=[];
    if(!this.isOp(')')){do{args.push(this.parseAssign());}while(this.eatOp(','));}

    const user=this.funcs.get(name);
    if(user){
      if(args.length!==user.params.length)throw new CErr(`ฟังก์ชัน '${name}' ต้องการอาร์กิวเมนต์ ${user.params.length} ค่า แต่ส่งมา ${args.length} ค่า`,line);

    }

    if(!this.inc.has(b.h))throw new CErr(`ใช้ ${name} ต้องเขียน #include <${b.h}> ไว้บรรทัดบนสุดก่อน`,line);
    if(b.n!==undefined&&args.length!==b.n)throw new CErr(`${name} ต้องการอาร์กิวเมนต์ ${b.n} ค่า แต่ส่งมา ${args.length} ค่า`,line);

      if(!args.length||args[0].k!=='str')throw new CErr('อาร์กิวเมนต์แรกของ printf ต้องเป็นข้อความใน " "',line);
      const specs=[...args[0].v.matchAll(FMT_RE)].filter(m=>m[5]!=='%');
      if(args.length-1<specs.length)throw new CErr(`printf มีตัวแทนค่า (เช่น %d %s) ${specs.length} ตัว แต่ส่งค่ามาแค่ ${args.length-1} ค่า`,line);

      const tg=args.slice(1);
      if(specs.length!==tg.length)throw new CErr(`scanf มีตัวแทนค่า ${specs.length} ตัว แต่ระบุตัวแปร ${tg.length} ตัว ต้องเท่ากัน`,line);

          if(sp==='s'){
            const okArr=T.d&&T.b==='char'&&T.d.length===1&&!T.p,okPtr=!T.d&&T.p===1&&T.b==='char';

          }else if(!T.d&&T.p===0)throw new CErr(`ตัวแปร '${a.name}' ใน scanf ต้องมี & นำหน้า เขียนเป็น &${a.name}`,line);
        }else if(a.k==='addr'&&a.e.k==='id'){

          if(!T.d&&T.p===0){
            if(sp==='s')throw new CErr(`%s ใช้อ่านข้อความเข้า char array เท่านั้น แต่ '${a.e.name}' เป็น ${T.b} ธรรมดา`,line);
            if(SPEC[T.b]!==sp)throw new CErr(`ตัวแปร '${a.e.name}' เป็นชนิด ${T.b} ต้องใช้ %${SPEC[T.b]} ใน scanf (ไม่ใช่ %${sp})`,line);

        }
      });
    }
    return{k:'call',name,args,line,builtin:true};
  }
}

const fmtF=(v,p)=>isFinite(v)?v.toFixed(Math.min(p,20)):(isNaN(v)?'nan':(v<0?'-inf':'inf'));

function interpret(ps,globalDecls,stdin,res){

  const blocks=[],sblocks=[];
  let sp=0x1000,gp=0x6000,lp=0x8000;
  const globals=new Map();const gf={scopes:[globals],isMain:false};
  const toks=stdin.trim().split(/\s+/).filter(Boolean);let tp=0;
  let steps=0,depth=0,outLen=0,curLine=0;
  const seen=new Set();
  const warn=(m,line)=>{const k=line+'|'+m;if(!seen.has(k)){seen.add(k);res.warns.push({line,msg:m});}};
  const hit=l=>res.hits.set(l,(res.hits.get(l)||0)+1);
  const tick=l=>{if(++steps>400000)throw new CErr('โปรแกรมทำงานนานผิดปกติ (เกิน 400,000 ขั้นตอน) น่าจะเกิด infinite loop ให้ตรวจเงื่อนไขของ loop',l,'run');};

  const lookupVar=(fr,name)=>{
    for(let i=fr.scopes.length-1;i>=0;i--){const v=fr.scopes[i].get(name);if(v)return v;}

  const descOf=n=>n.k==='id'?n.name:n.k==='index'?descOf(n.base)+'[…]':'อาร์เรย์';

  function alloc(size,name,region,extra){
    const al=size>=8?8:size>=4?4:size>=2?2:1;

    if(region==='stack'){

      if(sp>0x5ff0)throw new CErr('ใช้หน่วยความจำสแตกเกินกำหนด (อาจเรียกฟังก์ชันซ้อนลึกเกินไป)',curLine,'run');

    else{lp=Math.ceil(lp/al)*al;base=lp;lp+=size;}

  function freeTo(sp0,bl0){
    while(blocks.length>bl0){const b=blocks.pop();for(let a=b.base;a<b.base+b.size;a++)mem.delete(a);}

  }
  function strAddr(n){
    if(n.addr===undefined){

  }
  function readStr(x,line,fname){
    x=decay(x,line);

      if(o==='-'&&ca==='p'&&cb!=='p')return{v:a.v-Math.trunc(b.v)*sizeOf(elemT(a.t)),t:a.t};

  function typeOfExpr(n,fr){

        if(!T.d&&T.p===0)throw new CErr(`ใช้ [ ] ได้เฉพาะกับอาร์เรย์หรือพอยน์เตอร์ แต่ค่านี้เป็น ${T.b} ธรรมดา`,n.line,'run');
        const et=elemT(T),es=sizeOf(et);
        if(T.d&&(i<0||i>=T.d[0]))throw new CErr(`index ${i} เกินขอบเขตของอาร์เรย์ ${descOf(n.base)} ซึ่งมี ${T.d[0]} ช่อง (ใช้ได้เฉพาะ 0 ถึง ${T.d[0]-1}) ภาษาซีจริงไม่ตรวจให้ จึงอาจเขียนทับตัวแปรอื่นหรือ crash ได้`,n.line,'run');
        return{addr:b.v+i*es,t:et,desc:descOf(n.base).replace('…',String(i))};
      }
      case 'deref':{
        const p=decay(ev(n.e,fr),n.line);
        if(p.t.p===0)throw new CErr(`ใช้ * กับสิ่งที่ไม่ใช่พอยน์เตอร์ไม่ได้ (ค่านี้เป็น ${tName(p.t)})`,n.line,'run');
        if(p.t.b==='void'&&p.t.p===1)throw new CErr('ใช้ * กับ void * หรือ NULL ไม่ได้',n.line,'run');
        return{addr:p.v,t:elemT(p.t),desc:null};
      }
      default:throw new CErr('ต้องเป็นตัวแปร ช่องของอาร์เรย์ หรือ *p',n.line,'run');
    }
  }
  const evd=(n,fr)=>decay(ev(n,fr),n.line);
  function ev(n,fr){
    switch(n.k){
      case 'num':return{v:n.v,t:n.t};
      case 'str':return{v:strAddr(n),t:mkT('char',1)};
      case 'id':case 'index':case 'deref':{
        const lv=lval(n,fr);
        if(lv.t.d)return{v:lv.addr,t:lv.t};
        return readVal(lv.addr,lv.t,n.line,lv.desc);
      }
      case 'un':{
        const x=evd(n.e,fr);
        if(n.op==='!')return{v:x.v?0:1,t:TI};
        if(n.op==='-')return catOf(x.t)==='i'?{v:(-x.v)|0,t:TI}:{v:-x.v,t:x.t};
        return x;
      }
      case 'cast':{const x=evd(n.e,fr);return{v:convNum(n.type.b,x.v),t:n.type};}
      case 'sizeof':{const T=n.ty?n.ty:typeOfExpr(n.e,fr);return{v:sizeOf(T),t:TL};}
      case 'addr':{
        const lv=lval(n.e,fr);
        if(lv.t.d){
          if(lv.t.d.length>1)throw new CErr('& กับอาร์เรย์หลายมิติทั้งก้อนยังไม่รองรับ',n.line,'run');
          warn('&ชื่ออาร์เรย์ ให้แอดเดรสเดียวกับชื่ออาร์เรย์เฉยๆ (เช่น scanf("%s", name) ไม่ต้องใส่ &)',n.line);
        }
        return{v:lv.addr,t:mkT(lv.t.b,lv.t.p+1)};
      }
      case 'bin':{
        if(n.op==='&&'){const a=evd(n.l,fr);if(!a.v)return{v:0,t:TI};return{v:evd(n.r,fr).v?1:0,t:TI};}
        if(n.op==='||'){const a=evd(n.l,fr);if(a.v)return{v:1,t:TI};return{v:evd(n.r,fr).v?1:0,t:TI};}
        const a=evd(n.l,fr),b=evd(n.r,fr);
        switch(n.op){
          case '==':case '!=':{
            if(catOf(a.t)==='p'&&catOf(b.t)==='p'&&a.t.b==='char'&&b.t.b==='char')
              warn('== หรือ != กับข้อความเป็นการเปรียบเทียบ "แอดเดรส" ไม่ใช่เนื้อหา ถ้าต้องการเทียบข้อความให้ใช้ strcmp (ได้ 0 เมื่อเหมือนกัน)',n.line);
            const eq=a.v===b.v;
            return{v:(n.op==='=='?eq:!eq)?1:0,t:TI};
          }
          case '<':return{v:a.v<b.v?1:0,t:TI};
          case '>':return{v:a.v>b.v?1:0,t:TI};
          case '<=':return{v:a.v<=b.v?1:0,t:TI};
          case '>=':return{v:a.v>=b.v?1:0,t:TI};
          default:return arith(n.op,a,b,n.line);
        }
      }
      case 'assign':{
        const lv=lval(n.l,fr);
        if(lv.t.d)throw new CErr('กำหนดค่าให้อาร์เรย์ทั้งแถวด้วย = ไม่ได้',n.line,'run');
        let x=evd(n.e,fr);
        if(n.op!=='='){
          const cur=readVal(lv.addr,lv.t,n.line,lv.desc);
          x=arith(n.op[0],cur,x,n.line);
        }
        const val=coerceTo(lv.t,x,n.line);
        writeVal(lv.addr,lv.t,val,n.line);
        return{v:val,t:lv.t};
      }
      case 'incdec':{
        const lv=lval(n.l,fr);
        if(lv.t.d)throw new CErr('++ และ -- ใช้กับอาร์เรย์ทั้งก้อนไม่ได้',n.line,'run');
        const cur=readVal(lv.addr,lv.t,n.line,lv.desc);
        const nw=arith(n.op==='++'?'+':'-',cur,{v:1,t:TI},n.line);
        const val=coerceTo(lv.t,nw,n.line);
        writeVal(lv.addr,lv.t,val,n.line);
        return n.pre?{v:val,t:lv.t}:cur;
      }
      case 'cond':return evd(n.c,fr).v?evd(n.a,fr):evd(n.b,fr);
      case 'call':return callFn(n,fr);
    }
    throw new CErr('นิพจน์ที่ตัวจำลองยังไม่รองรับ',n.line,'run');
  }
  function callFn(n,fr){
    if(n.builtin)return builtin(n,fr);
    const fn=funcs.get(n.name);
    if(!fn.body)throw new CErr(`ฟังก์ชัน '${n.name}' ประกาศไว้แต่ยังไม่ได้เขียนเนื้อหา`,n.line,'run');
    if(++depth>250){depth--;throw new CErr('เรียกฟังก์ชันซ้อนกันลึกเกินไป (recursion ไม่มีเงื่อนไขหยุด)',n.line,'run');}
    const sp0=sp,bl0=blocks.length;
    try{
      const args=n.args.map(a=>evd(a,fr));
      const nf={scopes:[new Map()],isMain:!!n.isMain};
      fn.params.forEach((p,i)=>{
        const val=coerceTo(p.type,args[i],n.line);
        const b=alloc(sizeOf(p.type),p.name,'stack');
        mem.set(b.base,val);
        nf.scopes[0].set(p.name,{name:p.name,type:p.type,addr:b.base});
      });
      const r=exec(fn.body,nf);
      const rt=fn.ret;
      if(rt.b==='void'&&rt.p===0)return{v:0,t:TI};
      if(r&&r.k==='return'&&r.v)return{v:coerceTo(rt,r.v,n.line),t:rt};
      return{v:0,t:rt.p>0?rt:TI};
    }finally{freeTo(sp0,bl0);depth--;}
  }
  function builtin(n,fr){
    const name=n.name,line=n.line;
    if(name==='printf'){
      const vals=n.args.slice(1);let ai=0;
      const out=n.args[0].v.replace(FMT_RE,(all,fl,w,pr,lg,cv)=>{
        if(cv==='%')return'%';
        const a=vals[ai++];let s;
        const x=evd(a,fr);
        const c=catOf(x.t);
        if(cv==='s'){
          s=readStr(x,line,'printf (%s)');
          if(pr!==undefined)s=s.slice(0,+pr);
        }else if(cv==='d'||cv==='i'||cv==='u'){
          if(c==='d'){warn(`${all} ใช้กับจำนวนเต็ม แต่ค่าที่ส่งมาเป็นทศนิยม ควรใช้ %f`,line);s='0';}
          else{
            if(c==='p')warn(`${all} ใช้กับจำนวนเต็ม แต่ค่านี้เป็นแอดเดรส ควรใช้ %p`,line);
            s=String(x.v);if(fl.includes('+')&&x.v>=0)s='+'+s;
          }
        }else if(cv==='f'){
          const P=pr===undefined?6:+pr;
          if(c!=='d'){warn(`${all} ใช้กับทศนิยม แต่ค่าที่ส่งมาเป็นจำนวนเต็มหรือแอดเดรส ควรใช้ %d`,line);s=fmtF(0,P);}
          else{s=fmtF(x.v,P);if(fl.includes('+')&&x.v>=0)s='+'+s;}
        }else if(cv==='x'||cv==='X'){
          s=(x.v>>>0).toString(16);if(cv==='X')s=s.toUpperCase();
        }else if(cv==='p'){
          s=x.v===0?'(nil)':hex(x.v);
        }else{
          if(c==='d')warn('%c ใช้กับตัวอักษรหรือจำนวนเต็ม ไม่ใช่ทศนิยม',line);
          s=String.fromCharCode(x.v&255);
        }
        if(w&&s.length<+w){
          const W=+w;
          if(fl.includes('-'))s=s.padEnd(W);
          else if(fl.includes('0')&&cv!=='s'&&cv!=='c'&&cv!=='p'){const sg=/^[+-]/.test(s)?s[0]:'';s=sg+s.slice(sg.length).padStart(W-sg.length,'0');}
          else s=s.padStart(W);
        }
        return s;
      });
      emit(out);
      return{v:out.length,t:TI};
    }
    if(name==='scanf'){
      const specs=[...n.args[0].v.matchAll(/%(ld|lf|[dfcs])/g)].map(m=>m[1]);
      const WANT={d:'int',ld:'long',f:'float',lf:'double',c:'char',s:'char'};
      let cnt=0;
      for(let i=0;i<specs.length;i++){
        const spc=specs[i];
        const p=evd(n.args[i+1],fr);
        if(!(p.t.p===1&&p.t.b===WANT[spc]))throw new CErr(spc==='s'?`%s ต้องใช้กับ char array หรือ char * แต่ได้ ${tName(p.t)}`:`%${spc} ต้องการแอดเดรสของตัวแปรชนิด ${WANT[spc]} (เช่น &x) แต่ได้ ${tName(p.t)}`,line,'run');
        if(tp>=toks.length)throw new CErr('ไม่มีข้อมูลให้ scanf อ่าน ให้พิมพ์ค่าในช่อง "ข้อมูลที่ต้องพิมพ์ให้โปรแกรม" ให้ครบก่อนกดรัน',line,'run');
        const tok=toks[tp++];
        res.shown.push('<i>'+esc(tok)+(i===specs.length-1?'\n':' ')+'</i>');
        if(spc==='s')writeStr(p.v,tok,line);
        else if(spc==='c')writeVal(p.v,mkT('char'),(tok.charCodeAt(0)<<24)>>24,line);
        else if(spc==='d'||spc==='ld'){
          if(!/^[+-]?\d+$/.test(tok))throw new CErr(`ข้อมูล '${tok}' ไม่ใช่จำนวนเต็ม แต่ %${spc} ต้องการจำนวนเต็ม`,line,'run');
          writeVal(p.v,mkT(WANT[spc]),convNum(WANT[spc],parseInt(tok,10)),line);
        }else{
          if(!isFinite(Number(tok)))throw new CErr(`ข้อมูล '${tok}' ไม่ใช่ตัวเลข`,line,'run');
          writeVal(p.v,mkT(WANT[spc]),convNum(WANT[spc],Number(tok)),line);
        }
        cnt++;
      }
      return{v:cnt,t:TI};
    }
    const a=n.args.map(x=>evd(x,fr));
    const num=x=>{if(catOf(x.t)==='p')throw new CErr(`${name} ต้องการตัวเลขหรือตัวอักษร แต่ได้ข้อความ/แอดเดรส`,line,'run');return x.v;};
    switch(name){
      case 'strlen':return{v:readStr(a[0],line,name).length,t:TI};
      case 'strcpy':{const s=readStr(a[1],line,name);if(a[0].t.p===0)throw new CErr('ปลายทางของ strcpy ต้องเป็น char array',line,'run');writeStr(a[0].v,s,line);return a[0];}
      case 'strcat':{const d=readStr(a[0],line,name),s=readStr(a[1],line,name);writeStr(a[0].v,d+s,line);return a[0];}
      case 'strncpy':{
        const s=readStr(a[1],line,name),m=num(a[2]);
        const b=chk(a[0].v,1,line,true);
        if(m>b.base+b.size-a[0].v)throw new CErr('strncpy เขียนเกินขนาดปลายทาง (buffer overflow)',line,'run');
        for(let k=0;k<m;k++)mem.set(a[0].v+k,k<s.length?s.charCodeAt(k):0);
        return a[0];
      }
      case 'strcmp':{
        const s1=readStr(a[0],line,name),s2=readStr(a[1],line,name);
        const L=Math.max(s1.length,s2.length);
        for(let k=0;k<=L;k++){
          const c1=k<s1.length?s1.charCodeAt(k):0,c2=k<s2.length?s2.charCodeAt(k):0;
          if(c1!==c2)return{v:c1-c2,t:TI};
        }
        return{v:0,t:TI};
      }
      case 'puts':emit(readStr(a[0],line,name)+'\n');return{v:1,t:TI};
      case 'putchar':emit(String.fromCharCode(num(a[0])&255));return{v:num(a[0]),t:TI};
      case 'toupper':{const c=num(a[0]);return{v:(c>=97&&c<=122)?c-32:c,t:TI};}
      case 'tolower':{const c=num(a[0]);return{v:(c>=65&&c<=90)?c+32:c,t:TI};}
      case 'isalpha':{const c=num(a[0]);return{v:((c>=65&&c<=90)||(c>=97&&c<=122))?1:0,t:TI};}
      case 'isdigit':{const c=num(a[0]);return{v:(c>=48&&c<=57)?1:0,t:TI};}
      case 'isupper':{const c=num(a[0]);return{v:(c>=65&&c<=90)?1:0,t:TI};}
      case 'islower':{const c=num(a[0]);return{v:(c>=97&&c<=122)?1:0,t:TI};}
      case 'isspace':{const c=num(a[0]);return{v:(c===32||(c>=9&&c<=13))?1:0,t:TI};}
      case 'isalnum':{const c=num(a[0]);return{v:((c>=48&&c<=57)||(c>=65&&c<=90)||(c>=97&&c<=122))?1:0,t:TI};}
      case 'sqrt':return{v:Math.sqrt(num(a[0])),t:TD};
      case 'pow':return{v:Math.pow(num(a[0]),num(a[1])),t:TD};
      case 'fabs':return{v:Math.abs(num(a[0])),t:TD};
      case 'abs':return{v:Math.abs(num(a[0]))|0,t:TI};
    }
    throw new CErr(`ไม่รู้จักฟังก์ชัน ${name}`,line,'run');
  }

  function target(all,addr){
    if(addr===0)return 'NULL';
    for(const v of all){
      const sz=sizeOf(v.type);
      if(addr>=v.addr&&addr<v.addr+sz){
        if(!v.type.d)return v.name;
        const es=sizeOf(mkT(v.type.b,v.type.p));
        const idx=Math.floor((addr-v.addr)/es);
        if(v.type.d.length===1)return `${v.name}[${idx}]`;
        const cols=v.type.d[1];
        return `${v.name}[${Math.floor(idx/cols)}][${idx%cols}]`;
      }
    }
    for(const b of sblocks)if(b.ro&&addr>=b.base&&addr<b.base+b.size)return `ข้อความ "${b.text}"`;
    return 'ที่ไม่ใช่ตัวแปรใดๆ';
  }
  function takeSnap(map){
    const loc=[...map.values()],glob=[...globals.values()];
    const all=loc.concat(glob);
    const mk=(v,g)=>{
      const T=v.type,et=mkT(T.b,T.p),es=sizeOf(et),dims=T.d||[];
      const cols=dims.length===2?dims[1]:(dims.length===1?dims[0]:1);
      const nr=dims.length===2?dims[0]:1;
      const rows=[];
      if(cols*nr<=300){
        for(let r=0;r<nr;r++){
          const row=[];
          for(let c=0;c<cols;c++){
            const a=v.addr+(r*cols+c)*es,init=mem.has(a),val=init?mem.get(a):0;
            row.push({i:init,v:val,a,l:dims.length===2?`[${r}][${c}]`:dims.length===1?`[${c}]`:'',t:(et.p>0&&init)?target(all,val):''});
          }
          rows.push(row);
        }
      }
      const o={name:v.name,type:tName(T),addr:v.addr,size:sizeOf(T),base:T.b,ptr:T.p>0,rows,g};
      if(dims.length===1&&T.b==='char'&&T.p===0&&rows.length){
        let s='',ended=false;
        for(const c of rows[0]){if(!c.i)break;if(c.v===0){ended=true;break;}s+=String.fromCharCode(c.v<0?c.v+256:c.v);}
        if(ended)o.str=s;else if(s!=='')o.nonul=true;
        if(rows[0].length>12){
          const k=rows[0].findIndex(c=>c.i&&c.v===0);
          const keep=k>=0?Math.max(k+3,6):12;
          if(keep<rows[0].length){o.more=rows[0].length-keep;rows[0]=rows[0].slice(0,keep);}
        }
      }
      return o;
    };
    return loc.map(v=>mk(v,false)).concat(glob.map(v=>mk(v,true)));
  }

  function exec(s,fr){
    tick(s.line);curLine=s.line;
    if(s.k!=='block'&&s.k!=='empty'&&s.k!=='while'&&s.k!=='for'&&s.k!=='do')hit(s.line);
    switch(s.k){
      case 'block':{
        fr.scopes.push(new Map());
        const sp0=sp,bl0=blocks.length;
        try{for(const st of s.body){const r=exec(st,fr);if(r)return r;}}
        finally{
          if(s.fnBody&&fr.isMain&&!res.snap){try{res.snap=takeSnap(fr.scopes[fr.scopes.length-1]);}catch(e){}}
          freeTo(sp0,bl0);fr.scopes.pop();
        }
        return;
      }
      case 'empty':return;
      case 'decl':for(const d of s.decls)execDecl(d,fr,false);return;
      case 'expr':ev(s.e,fr);return;
      case 'if':{
        if(evd(s.cond,fr).v)return exec(s.then,fr);
        if(s.els)return exec(s.els,fr);
        return;
      }
      case 'while':{
        while(true){
          tick(s.line);hit(s.line);
          if(!evd(s.cond,fr).v)break;
          const r=exec(s.body,fr);
          if(r){if(r.k==='break')break;if(r.k!=='continue')return r;}
        }
        return;
      }
      case 'do':{
        while(true){
          tick(s.line);hit(s.line);
          const r=exec(s.body,fr);
          if(r){if(r.k==='break')break;if(r.k!=='continue')return r;}
          hit(s.cline);
          if(!evd(s.cond,fr).v)break;
        }
        return;
      }
      case 'for':{
        fr.scopes.push(new Map());
        const sp0=sp,bl0=blocks.length;
        try{
          if(s.init){if(s.init.k==='decl')s.init.decls.forEach(d=>execDecl(d,fr,false));else s.init.list.forEach(e=>ev(e,fr));}
          while(true){
            tick(s.line);hit(s.line);
            if(s.cond&&!evd(s.cond,fr).v)break;
            const r=exec(s.body,fr);
            if(r){if(r.k==='break')break;if(r.k!=='continue')return r;}
            if(s.step)s.step.forEach(e=>ev(e,fr));
          }
        }finally{freeTo(sp0,bl0);fr.scopes.pop();}
        return;
      }
      case 'switch':{
        const x=evd(s.e,fr);
        fr.scopes.push(new Map());
        try{
          let start=-1;
          for(let i=0;i<s.cases.length;i++){const c=s.cases[i];if(c.test&&evd(c.test,fr).v===x.v){start=i;break;}}
          if(start<0)start=s.cases.findIndex(c=>!c.test);
          if(start>=0){
            for(let i=start;i<s.cases.length;i++){
              for(const st of s.cases[i].body){
                const r=exec(st,fr);
                if(r){if(r.k==='break')return;return r;}
              }
            }
          }
        }finally{fr.scopes.pop();}
        return;
      }
      case 'break':return{k:'break'};
      case 'continue':return{k:'continue'};
      case 'return':return{k:'return',v:s.e?evd(s.e,fr):null};
    }
  }
  for(const d of globalDecls)for(const x of d.decls)execDecl(x,gf,true);
  const main=funcs.get('main');
  const r=callFn({name:'main',args:[],line:main.line,builtin:false,isMain:true},gf);
  res.exit=r.v;
}

function runC(src,stdin){
  const res={shown:[],raw:'',warns:[],error:null,exit:0,hits:new Map(),snap:null};
  try{
    const {toks,inc}=lex(src);
    const ps=new Parser(toks,inc);
    const g=ps.parseProgram();
    ps.warns.forEach(w=>res.warns.push(w));
    interpret(ps,g,stdin||'',res);
  }catch(e){
    if(e instanceof CErr){
      res.error={msg:e.message,line:e.line,kind:e.kind};
      if(e.kind==='compile'){res.shown=[];res.raw='';res.hits=new Map();res.snap=null;}
    }else if(e instanceof RangeError){
      res.error={msg:'เรียกฟังก์ชันซ้อนกันลึกเกินไป (recursion ไม่มีเงื่อนไขหยุด)',line:0,kind:'run'};
    }else res.error={msg:'ข้อผิดพลาดภายในระบบ: '+e.message,line:0,kind:'compile'};
  }
  return res;
}

function renderMem(snap){
  const cell=(c,v)=>{
    let big,small='',cls='';
    if(!c.i){big='?';small='ขยะ';cls=' un';}
    else if(v.ptr){big=c.v===0?'NULL':hex(c.v);small='→ '+esc(c.t);}
    else if(v.base==='char'){
      if(c.v===0){big="'\\0'";cls=' nul';}
      else if(c.v>=32&&c.v<127)big="'"+esc(String.fromCharCode(c.v))+"'";
      else big=String(c.v);
      small='รหัส '+c.v;
    }else if(v.base==='float'||v.base==='double')big=String(Number(Number(c.v).toPrecision(7)));
    else big=String(c.v);
    return `<div class="mc${cls}">${c.l?`<div class="mi">${c.l}</div>`:''}<div class="mb">${big}</div>${small?`<div class="ms">${small}</div>`:''}<div class="ma">${hex(c.a)}</div></div>`;
  };
  return '<div class="memv">'+snap.map(v=>{
    const head=`<div class="mvh"><b>${esc(v.name)}</b> <code>${esc(v.type)}</code> <span class="mva">ที่อยู่ ${hex(v.addr)} · ${v.size} ไบต์${v.g?' · ตัวแปรโกลบอล':''}</span></div>`;
    const more=v.more?`<div class="mc un"><div class="mb">…</div><div class="ms">อีก ${v.more} ช่อง</div></div>`:'';
    const rows=v.rows.length?v.rows.map((r,ri)=>`<div class="mrow">${r.map(c=>cell(c,v)).join('')}${ri===0?more:''}</div>`).join(''):'<div class="mva">(อาร์เรย์ใหญ่เกินจะแสดงภาพ)</div>';
    let cap='';
    if(v.str!==undefined)cap=`<div class="mcap">อ่านเป็นข้อความได้ว่า "${esc(v.str)}" (ยาว ${v.str.length} ตัวอักษร ใช้ ${v.str.length+1} ช่องรวม \\0)</div>`;
    else if(v.nonul)cap='<div class="mcap" style="color:#b91c1c">ไม่มี \\0 ปิดท้าย จึงยังไม่ใช่สตริงที่สมบูรณ์</div>';
    return `<div class="mv">${head}${rows}${cap}</div>`;
  }).join('')+'</div>';
}
function showRes(r,src,openTrace){
  let h='';
  const compileErr=r.error&&r.error.kind==='compile';
  if(compileErr){
    h+=`<div class="box err"><b>❌ คอมไพล์ไม่ผ่าน</b><br>${r.error.line?'บรรทัดที่ '+r.error.line+': ':''}${esc(r.error.msg)}</div>`;
  }else{
    h+=`<div class="tlabel">ผลลัพธ์บนหน้าจอ (ตัวอักษรสีเหลืองคือสิ่งที่ผู้ใช้พิมพ์)</div><div class="term mono">${r.shown.join('')||'(ยังไม่มีข้อความแสดง)'}</div>`;
    if(r.error)h+=`<div class="box err"><b>❌ โปรแกรมหยุดทำงาน</b><br>${r.error.line?'บรรทัดที่ '+r.error.line+': ':''}${esc(r.error.msg)}</div>`;
    else h+=`<div class="box good">✅ โปรแกรมทำงานสำเร็จ</div>`;
  }
  if(r.warns.length)h+=`<div class="box warn"><b>⚠️ ข้อสังเกต</b><ul>${r.warns.map(w=>`<li>บรรทัดที่ ${w.line}: ${esc(w.msg)}</li>`).join('')}</ul></div>`;
  if(!compileErr&&r.snap&&r.snap.length)h+=`<details class="trace" open><summary>🧠 ดูหน่วยความจำ (ตัวแปรใน main ${r.error?'ณ จุดที่โปรแกรมหยุด':'ตอนจบโปรแกรม'})</summary>${renderMem(r.snap)}</details>`;
  if(!compileErr&&r.hits.size){
    const lines=src.split('\n');
    h+=`<details class="trace" ${openTrace?'open':''}><summary>🔍 ดูว่าแต่ละบรรทัดทำงานกี่ครั้ง</summary><div class="tlabel">แถบสีเขียว = บรรทัดที่ทำงาน (×จำนวนครั้ง)</div><div class="tr">${lines.map((l,i)=>{const c=r.hits.get(i+1)||0;return `<div class="trl ${c?'on':'off'}"><span class="tn">${i+1}</span><span class="tc">${c?'×'+c:''}</span><code>${esc(l)||' '}</code></div>`;}).join('')}</div></details>`;
  }
  return h;
}

function mkEditor(host,cfg){
  host.innerHTML=`<textarea class="code" spellcheck="false" wrap="off"></textarea>${cfg.input!==undefined?'<label class="lab">ข้อมูลที่ต้องพิมพ์ให้โปรแกรม (สำหรับ scanf คั่นด้วยเว้นวรรค)<input class="inp"></label>':''}<div class="btns"><button class="btn go">▶ รันโปรแกรม</button><button class="btn rs">↺ เริ่มใหม่</button></div><div class="res"></div>`;
  const ta=$('textarea',host),inp=$('.inp',host),res=$('.res',host);
  ta.value=cfg.code;ta.rows=Math.min(28,cfg.code.split('\n').length+1);
  if(inp)inp.value=cfg.input;
  const run=()=>{const src=ta.value;res.innerHTML=showRes(runC(src,inp?inp.value:''),src,!!cfg.trace);};
  $('.go',host).onclick=run;
  $('.rs',host).onclick=()=>{ta.value=cfg.code;if(inp)inp.value=cfg.input;res.innerHTML='';};
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end');}
    if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run();}
  });
  (cfg.tries||[]).forEach(t=>{
    const b=document.createElement('button');b.className='btn';b.textContent=t.label;
    b.onclick=()=>{ta.value=t.fn(ta.value);run();};

}
const norm=s=>s.replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').trim();
function mkMission(host,cfg,stepId,onDone){
  const hasIn=cfg.tests.some(t=>t.input!==undefined);
  host.innerHTML=`<h3 style="margin-top:0">🎯 ภารกิจ: ${cfg.title}</h3>${cfg.task}
  <div class="tw"><table><tr>${hasIn?'<th>พิมพ์ให้โปรแกรม</th>':''}<th>ต้องได้ผลลัพธ์</th></tr>${cfg.tests.map(t=>`<tr>${hasIn?`<td><code>${esc(t.input||'')}</code></td>`:''}<td><pre style="margin:0" class="mono">${t.expected===''?'(ไม่แสดงอะไรเลย)':esc(t.expected)}</pre></td></tr>`).join('')}</table></div>
  <div class="ed"></div>
  <div class="btns"><button class="btn ok chk">✔ ตรวจคำตอบ</button><button class="btn hint">💡 ขอคำใบ้</button><button class="btn sol">👀 ดูเฉลย</button></div>
  <div class="hb"></div><div class="cr"></div>`;
  const ed=mkEditor($('.ed',host),{code:cfg.code,input:hasIn?cfg.tests[0].input:undefined});
  $('.hint',host).onclick=()=>{$('.hb',host).innerHTML=`<div class="box warn">💡 ${cfg.hint}</div>`;};
  $('.sol',host).onclick=()=>{$('.hb',host).innerHTML='<div class="box warn">เฉลย (ลองทำเองก่อน แล้วค่อยเทียบนะ)<pre class="show"></pre></div>';$('.hb pre',host).textContent=cfg.solution;};
  $('.chk',host).onclick=()=>{
    const code=ed.get();let all=true,h='<ul>';
    (cfg.requires||[]).forEach(q=>{const ok=q.re.test(code);if(!ok)all=false;h+=`<li>${ok?'✅':'❌'} ${q.msg}</li>`;});
    cfg.tests.forEach((t,i)=>{
      const r=runC(code,t.input||'');
      if(r.error){all=false;h+=`<li>❌ ชุดทดสอบที่ ${i+1}: ${r.error.kind==='compile'?'คอมไพล์ไม่ผ่าน':'โปรแกรมหยุดทำงาน'} ${r.error.line?'(บรรทัด '+r.error.line+') ':''}${esc(r.error.msg)}</li>`;return;}
      const ok=norm(r.raw)===norm(t.expected);if(!ok)all=false;
      h+=`<li>${ok?'✅':'❌'} ชุดทดสอบที่ ${i+1}${t.input?` (พิมพ์ <code>${esc(t.input)}</code>)`:''}`;
      if(!ok)h+=`<br>ต้องได้:<pre class="show">${esc(t.expected)||'(ไม่แสดงอะไรเลย)'}</pre>แต่ได้:<pre class="show">${esc(r.raw)||'(ว่างเปล่า)'}</pre>`;
      h+='</li>';
    });
    h+='</ul>';
    if(all){progress[stepId]=true;saveP();onDone();h='<div class="box good"><b>🎉 ผ่านแล้ว เก่งมาก!</b></div>'+h;}
    else h='<div class="box err"><b>ยังไม่ผ่าน ไม่เป็นไร ลองดูผลเปรียบเทียบแล้วแก้อีกนิด</b></div>'+h;
    $('.cr',host).innerHTML=h;
  };
  if(progress[stepId])$('.cr',host).innerHTML='<div class="box good">✅ คุณเคยทำภารกิจนี้ผ่านแล้ว</div>';
}

function mkPtrArith(host){
  let st,msg,bad;
  const reset=()=>{st={a:[10,20,30,40,50],pos:0};msg='เริ่มต้น: int *p = a; ชี้ที่ช่องแรก a[0]';bad=false;};
  const inR=()=>st.pos>=0&&st.pos<5;
  const acts=[
    {code:'p++;',ok:()=>st.pos<5,fn:()=>{st.pos++;return 'p เลื่อนไป 1 ช่อง (แอดเดรสเพิ่ม 4 ไบต์ เพราะ int ใหญ่ 4 ไบต์ ไม่ใช่เพิ่มทีละ 1)';}},
    {code:'p--;',ok:()=>st.pos>-1,fn:()=>{st.pos--;return 'p ถอยหลัง 1 ช่อง (แอดเดรสลด 4 ไบต์)';}},
    {code:'p += 2;',ok:()=>st.pos+2<=5,fn:()=>{st.pos+=2;return 'p เลื่อนไป 2 ช่อง (แอดเดรสเพิ่ม 8 ไบต์)';}},
    {code:'p = a;',ok:()=>true,fn:()=>{st.pos=0;return 'ชื่ออาร์เรย์ a คือแอดเดรสของช่องแรก จึงกำหนดให้ p ได้เลย (ไม่ต้องมี &)';}},
    {code:'*p = 99;',need:1,fn:()=>{st.a[st.pos]=99;return `เขียน 99 ลงช่องที่ p ชี้ คือ a[${st.pos}]`;}},
    {code:'*p = *p + 1;',need:1,fn:()=>{st.a[st.pos]+=1;return `อ่านค่าช่องที่ p ชี้ บวก 1 แล้วเขียนกลับ a[${st.pos}] = ${st.a[st.pos]}`;}}
  ];
  host.innerHTML=`<h3 style="margin-top:0">🧪 ลองเล่น: เดินไปตามอาร์เรย์ด้วยพอยน์เตอร์</h3><p>ตอนนี้ <code>int a[5] = {10, 20, 30, 40, 50};</code> และ <code>int *p = a;</code> กดปุ่มเพื่อเลื่อน p แล้วดูว่า <code>p</code> และ <code>*p</code> เปลี่ยนอย่างไร ลองเดินออกนอกอาร์เรย์แล้วกด <code>*p = 99;</code> ดู</p><div class="btns pb"></div><div class="pv"></div>`;
  const bar=$('.pb',host);
  const draw=()=>{
    let cells='',marks='';
    for(let s=-1;s<=5;s++){
      const out=s<0||s>4;
      cells+=out?`<div class="mc un"><div class="mi">[${s}]</div><div class="mb">นอก</div><div class="ma">${hex(0x2000+4*s)}</div></div>`:`<div class="mc ${st.pos===s?'hl':''}"><div class="mi">[${s}]</div><div class="mb">${st.a[s]}</div><div class="ma">${hex(0x2000+4*s)}</div></div>`;
      marks+=`<div class="mk">${st.pos===s?'▲ p':''}</div>`;
    }
    const addr=0x2000+4*st.pos;
    let h=`<div class="tw"><div class="mrow">${cells}</div><div class="mrow">${marks}</div></div><div class="box ${bad?'err':'good'}">${bad?'❌ ':'💬 '}${msg}</div>`;
    h+=`<table><tr><th>นิพจน์</th><th>ค่า</th></tr><tr><td><code>p</code></td><td>${hex(addr)}</td></tr><tr><td><code>p - a</code> (ห่างจากช่องแรกกี่ช่อง)</td><td>${st.pos}</td></tr><tr><td><code>*p</code></td><td>${inR()?st.a[st.pos]:'อ่านไม่ได้ (p ชี้นอกอาร์เรย์)'}</td></tr><tr><td><code>*(a + ${st.pos})</code> เท่ากับ <code>a[${st.pos}]</code></td><td>${inR()?st.a[st.pos]:'นอกอาร์เรย์'}</td></tr></table>`;
    $('.pv',host).innerHTML=h;
    bar.querySelectorAll('button[data-ok]').forEach(b=>{b.disabled=!acts[+b.dataset.ok].ok();});
  };
  acts.forEach((a,i)=>{
    const b=document.createElement('button');b.className='btn mono';b.textContent=a.code;
    if(a.ok)b.dataset.ok=i;
    b.onclick=()=>{
      if(a.need&&!inR()){bad=true;msg=`ใช้ ${a.code} ไม่ได้ เพราะ p ชี้นอกอาร์เรย์ (แอดเดรสนี้ไม่ใช่ของ a) โปรแกรมจริงอาจ crash หรือเขียนทับตัวแปรอื่นโดยไม่รู้ตัว`;}
      else{bad=false;msg=a.fn();}
      draw();
    };
    bar.appendChild(b);
  });
  const rb=document.createElement('button');rb.className='btn';rb.textContent='↺ เริ่มใหม่';rb.onclick=()=>{reset();draw();};bar.appendChild(rb);
  reset();draw();
}

 learn:C`<p>สมมติต้องเก็บคะแนนสอบของเพื่อน 5 คน ถ้าใช้ตัวแปรธรรมดาต้องประกาศ <code>score1, score2, score3, score4, score5</code> แล้วถ้ามี 40 คนทั้งห้องล่ะ? 😵 เขียนไม่ไหวแน่นอน</p>

 learn:C`<p>พลังที่แท้จริงของอาร์เรย์จะออกมาเมื่อใช้คู่กับ <code>for</code> loop เพราะ index เป็นตัวแปรได้ ให้ <code>i</code> วิ่งจาก 0 ถึง ขนาด−1 ก็เข้าถึงได้ครบทุกช่อง ไม่ว่าจะมี 5 หรือ 500 ช่อง ✨</p>
 <pre class="show">#define N 5                  // ตั้งชื่อให้ค่าคงที่ แก้ที่เดียวเปลี่ยนทั้งโปรแกรม

for (i = 0; i &lt; N; i++) {    // i = 0, 1, 2, 3, 4
    ... a[i] ...
}</pre>
 <h3>สูตรสำเร็จที่ใช้บ่อย</h3>
 <div class="tw"><table><tr><th>งาน</th><th>แนวคิด</th></tr>

{name:'3 อาร์เรย์ 2 มิติ',title:'ขั้นที่ 3: อาร์เรย์ 2 มิติ (ตาราง)',widget:'grid',
 learn:C`<p>ถ้าอาร์เรย์ 1 มิติคือ <b>แถวของตู้</b> อาร์เรย์ 2 มิติก็คือ <b>ตาราง</b> 📊 ที่มีทั้ง <b>แถว (row)</b> และ <b>คอลัมน์ (column)</b> เช่น ตารางคะแนนที่แต่ละแถวเป็นนักเรียน แต่ละคอลัมน์เป็นวิชา หรือที่นั่งในโรงหนัง</p>
 <pre class="show">int m[2][3] = {
    {1, 2, 3},     // แถว 0
    {4, 5, 6}      // แถว 1
};
// m[0][2] คือ แถว 0 คอลัมน์ 2 = 3
// m[1][0] คือ แถว 1 คอลัมน์ 0 = 4</pre>
 <ul><li>ตัวเลขแรกคือ <b>จำนวนแถว</b> ตัวที่สองคือ <b>จำนวนคอลัมน์</b> <code>int m[2][3]</code> จึงมี 2 × 3 = 6 ช่อง</li>
 <li>เข้าถึงช่องด้วย <code>m[แถว][คอลัมน์]</code> ทั้งสองตัวเริ่มนับจาก 0</li>
 <li>ใช้ <b>loop ซ้อน loop</b>: loop นอกวนแถว loop ในวนคอลัมน์</li>
 <li>ในหน่วยความจำจริง ข้อมูลถูกวาง <b>ต่อกันเป็นเส้นเดียว ทีละแถว</b> ช่อง <code>m[r][c]</code> อยู่ลำดับที่ <code>r × จำนวนคอลัมน์ + c</code></li></ul>
 <pre class="show">for (r = 0; r &lt; 2; r++) {        // วนแถว
    for (c = 0; c &lt; 3; c++) {    // วนคอลัมน์ในแถวนั้น
        printf("%d ", m[r][c]);
    }
    printf("\n");                 // จบแถวแล้วขึ้นบรรทัดใหม่
}</pre>`,

 mission:{title:'ผลรวมของแต่ละแถว',task:C`<p>รับจำนวนเต็ม 6 ค่าเก็บลงอาร์เรย์ <code>int m[2][3]</code> ทีละแถว (3 ค่าแรกเป็นแถว 0, 3 ค่าหลังเป็นแถว 1) แล้วแสดงผลรวมของแต่ละแถวในรูปแบบ <code>Row r: ผลรวม</code></p>`,
  hint:C`รับค่า: loop ซ้อน loop แล้ว scanf("%d", &m[r][c]); หาผลรวม: ในแต่ละแถวให้ sum = 0 ก่อนเริ่ม loop ใน แล้วพิมพ์หลังจบ loop ใน`,

  solution:C`#include <stdio.h>

 <pre class="show">char name[20];

 mission:{title:'ตรวจคำพาลินโดรม',task:C`<p><b>พาลินโดรม (palindrome)</b> คือคำที่อ่านจากหน้าไปหลังกับหลังไปหน้าแล้วเหมือนกัน เช่น <code>radar</code>, <code>noon</code>, <code>level</code> ให้รับคำ 1 คำ แล้วตรวจว่าเป็นพาลินโดรมหรือไม่</p>`,
  hint:C`เทียบตัวที่ i กับตัวที่ len - 1 - i โดยวน i จาก 0 ถึง len / 2 ถ้าเจอคู่ไหนไม่เท่ากันให้ isPal = 0; แล้ว break;`,
  code:C`#include <stdio.h>
#include <string.h>

int main(void)
{
    char word[50];
    int i, len, isPal = 1;

    scanf("%s", word);
    len = strlen(word);

    /* เทียบตัวอักษรคู่หน้า-หลัง ถ้าไม่เท่ากันให้ isPal = 0 */

    if (isPal) {
        printf("Palindrome\n");
    } else {
        printf("Not palindrome\n");
    }
    return 0;
}`,tests:[{input:'radar',expected:'Palindrome\n'},{input:'hello',expected:'Not palindrome\n'},{input:'noon',expected:'Palindrome\n'},{input:'a',expected:'Palindrome\n'},{input:'ab',expected:'Not palindrome\n'}],
  requires:[{re:/(for|while)\s*\(/,msg:'ใช้ loop เทียบตัวอักษร'}],
  solution:C`#include <stdio.h>
#include <string.h>

int main(void)
{
    char word[50];
    int i, len, isPal = 1;

    scanf("%s", word);
    len = strlen(word);
    for (i = 0; i < len / 2; i++) {
        if (word[i] != word[len - 1 - i]) {
            isPal = 0;
            break;
        }
    }
    if (isPal) {
        printf("Palindrome\n");
    } else {
        printf("Not palindrome\n");
    }
    return 0;
}`},

{name:'6 พอยน์เตอร์',title:'ขั้นที่ 6: พอยน์เตอร์ (Pointer) ตัวแปรเก็บที่อยู่',widget:'ptrsim',
 learn:C`<p>ตัวแปรทุกตัวถูกเก็บในหน่วยความจำ และทุกตำแหน่งของหน่วยความจำมี <b>แอดเดรส (address)</b> หรือ "บ้านเลขที่" เช่น <code>0x1000</code></p>
 <p><b>พอยน์เตอร์ (pointer)</b> คือตัวแปรที่ <b>เก็บแอดเดรสของตัวแปรอื่น</b> เหมือน <b>กระดาษจดที่อยู่บ้าน</b> 🏠📝 กระดาษไม่ใช่ตัวบ้าน แต่บอกได้ว่าบ้านอยู่ที่ไหน และถ้าเดินไปตามที่อยู่ ก็เข้าไปดูหรือแก้ของในบ้านได้</p>
 <div class="tw"><table><tr><th>เขียน</th><th>อ่านว่า</th><th>เปรียบเทียบ</th></tr>
 <tr><td><code>int *p;</code></td><td>p เป็นพอยน์เตอร์ไปยัง int</td><td>เตรียมกระดาษไว้จดที่อยู่ของบ้านแบบ int</td></tr>
 <tr><td><code>&amp;x</code></td><td>แอดเดรสของ x</td><td>ถามว่าบ้าน x อยู่เลขที่เท่าไร</td></tr>
 <tr><td><code>p = &amp;x;</code></td><td>ให้ p ชี้ไปที่ x</td><td>จดที่อยู่บ้าน x ลงกระดาษ</td></tr>
 <tr><td><code>*p</code></td><td>ค่าที่ p ชี้อยู่</td><td>เดินไปตามที่อยู่ แล้วเปิดบ้านดูหรือแก้ของ</td></tr>
 <tr><td><code>NULL</code></td><td>ไม่ชี้ที่ใด</td><td>กระดาษเปล่า ยังไม่มีที่อยู่</td></tr></table></div>
 <div class="box warn"><b>เครื่องหมาย * มี 2 ความหมาย:</b> ตอน <b>ประกาศ</b> <code>int *p;</code> แปลว่า "p เป็นพอยน์เตอร์" แต่ตอน <b>ใช้งาน</b> <code>*p = 5;</code> แปลว่า "ค่าในบ้านที่ p ชี้อยู่"</div>
 <p>คลิกแต่ละบรรทัดด้านล่างเพื่อดูว่าเกิดอะไรขึ้นในหน่วยความจำ</p>`,

  {c:'int x = 10;',e:`สร้างตัวแปร x เก็บค่า 10 สมมติว่าอยู่ที่แอดเดรส <code>0x1000</code><pre class="show">x: [ 10 ]  @0x1000</pre>`},

p: [0x1000] ──► x</pre>`},
  {c:'printf("%d\\n", *p);',e:`<code>*p</code> = เดินไปที่ 0x1000 แล้วอ่านค่า ได้ <b>10</b>`},

  {c:'printf("%d\\n", x);',e:`แสดงผล <b>20</b> ยืนยันว่า x เปลี่ยนผ่านพอยน์เตอร์จริง`}],
 learn2:C`<h3>พอยน์เตอร์มีไว้ทำอะไร?</h3>
 <p>จำได้ไหมว่าฟังก์ชันได้รับ <b>สำเนา</b> ของค่า (pass by value) จึงแก้ตัวแปรของผู้เรียกไม่ได้ ถ้าส่ง <b>แอดเดรส</b> ไปแทน ฟังก์ชันจะ "เดินไปที่บ้าน" แล้วแก้ของจริงได้ นี่คือเหตุผลที่ <code>scanf("%d", &amp;x)</code> ต้องมี <code>&amp;</code> เพราะ scanf ต้องเขียนค่าลงตัวแปรของเรา</p>
 <ul><li>ให้ฟังก์ชันแก้ค่าตัวแปรของผู้เรียกได้ เช่น <code>swap(&amp;a, &amp;b)</code></li>
 <li>ให้ฟังก์ชัน "ส่งค่ากลับ" ได้หลายค่าพร้อมกัน ผ่านพอยน์เตอร์หลายตัว</li>
 <li>ส่งอาร์เรย์ใหญ่ๆ เข้าฟังก์ชันได้โดยไม่ต้องคัดลอก (เรียนในขั้นถัดไป)</li></ul>
 <div class="box err"><b>อันตราย:</b> ห้ามใช้ <code>*p</code> ถ้า p ยังไม่ได้ชี้ไปที่ตัวแปรใด (ยังไม่กำหนดค่า หรือเป็น NULL) โปรแกรมจริงจะ crash ด้วย <i>Segmentation fault</i></div>`,

   code:C`#include <stdio.h>

void swapWrong(int a, int b)
{
    int t = a;
    a = b;
    b = t;
}

void swapRight(int *a, int *b)
{
    int t = *a;
    *a = *b;
    *b = t;
}

int main(void)
{
    int x = 1, y = 2;

    swapWrong(x, y);
    printf("After swapWrong: x = %d, y = %d\n", x, y);

}`,tries:[{label:'😈 ลืม & ตอนเรียก swapRight',fn:c=>c.replace('swapRight(&x, &y)','swapRight(x, y)')}]}],
 mission:{title:'ส่งค่ากลับ 2 ค่าด้วยพอยน์เตอร์',task:C`<p>เขียนเนื้อหาฟังก์ชัน <code>void minMax(int a, int b, int c, int *mn, int *mx)</code> ให้หาค่าน้อยสุดของ a, b, c เก็บลงใน <code>*mn</code> และค่ามากสุดเก็บลงใน <code>*mx</code> (main เขียนไว้ให้แล้ว)</p>`,
  hint:C`เริ่ม *mn = a; *mx = a; แล้วเทียบกับ b และ c เช่น if (b &lt; *mn) *mn = b; ทำแบบเดียวกันกับ *mx`,
  code:C`#include <stdio.h>

void minMax(int a, int b, int c, int *mn, int *mx)
{
    /* หาค่าน้อยสุดเก็บใน *mn และค่ามากสุดเก็บใน *mx */

}

int main(void)
{
    int a, b, c, low, high;

    scanf("%d %d %d", &a, &b, &c);
    minMax(a, b, c, &low, &high);
    printf("Min=%d Max=%d\n", low, high);
    return 0;
}`,tests:[{input:'7 2 9',expected:'Min=2 Max=9\n'},{input:'5 5 5',expected:'Min=5 Max=5\n'},{input:'-1 0 -8',expected:'Min=-8 Max=0\n'},{input:'3 10 1',expected:'Min=1 Max=10\n'}],
  requires:[{re:/void\s+minMax\s*\(/,msg:'มีฟังก์ชัน minMax'},{re:/\*\s*mn\s*=/,msg:'เขียนค่าผ่าน *mn'},{re:/\*\s*mx\s*=/,msg:'เขียนค่าผ่าน *mx'}],
  solution:C`#include <stdio.h>

void minMax(int a, int b, int c, int *mn, int *mx)
{
    *mn = a;
    *mx = a;
    if (b < *mn) *mn = b;
    if (c < *mn) *mn = c;
    if (b > *mx) *mx = b;
    if (c > *mx) *mx = c;
}

int main(void)
{
    int a, b, c, low, high;

    scanf("%d %d %d", &a, &b, &c);
    minMax(a, b, c, &low, &high);
    printf("Min=%d Max=%d\n", low, high);
    return 0;
}`},

 learn:C`<h3>ความลับ: ชื่ออาร์เรย์คือแอดเดรสของช่องแรก</h3>
 <p>เมื่อเขียนชื่ออาร์เรย์ <code>a</code> เฉยๆ ภาษาซีจะแปลงเป็นแอดเดรสของ <code>a[0]</code> ให้อัตโนมัติ จึงเขียน <code>int *p = a;</code> ได้เลยไม่ต้องมี <code>&amp;</code></p>
 <h3>เลขคณิตของพอยน์เตอร์ (pointer arithmetic)</h3>
 <p><code>p + 1</code> <b>ไม่ใช่</b> แอดเดรสบวก 1 ไบต์ แต่คือ <b>ช่องถัดไป</b> ภาษาซีคูณขนาดของชนิดข้อมูลให้เอง</p>
 <div class="tw"><table><tr><th>ชนิด</th><th>ขนาด</th><th>ถ้า p = 0x1000 แล้ว p + 1 =</th></tr>
 <tr><td><code>char *</code></td><td>1 ไบต์</td><td>0x1001</td></tr>
 <tr><td><code>int *</code></td><td>4 ไบต์</td><td>0x1004</td></tr>
 <tr><td><code>double *</code></td><td>8 ไบต์</td><td>0x1008</td></tr></table></div>
 <h3>เขียนได้หลายแบบ ความหมายเดียวกัน</h3>
 <div class="tw"><table><tr><th>แบบอาร์เรย์</th><th>แบบพอยน์เตอร์</th><th>ความหมาย</th></tr>
 <tr><td><code>a[i]</code></td><td><code>*(a + i)</code></td><td>ค่าในช่องที่ i</td></tr>
 <tr><td><code>&amp;a[i]</code></td><td><code>a + i</code></td><td>แอดเดรสของช่องที่ i</td></tr>
 <tr><td><code>p[i]</code></td><td><code>*(p + i)</code></td><td>ถ้า p = a ก็คือ a[i]</td></tr></table></div>
 <h3>ส่งอาร์เรย์เข้าฟังก์ชัน</h3>
 <pre class="show">int sumArray(int *arr, int n)   // หรือเขียน int arr[] ก็ได้ ความหมายเหมือนกัน
...
total = sumArray(data, 6);      // ส่งแค่ชื่ออาร์เรย์ (= แอดเดรสช่องแรก)</pre>
 <ul><li>ฟังก์ชันได้รับ <b>แอดเดรส</b> ไม่ใช่สำเนา ถ้าฟังก์ชันแก้ <code>arr[i]</code> อาร์เรย์ตัวจริงใน main ก็เปลี่ยนด้วย</li>
 <li>ฟังก์ชันไม่รู้ว่าอาร์เรย์มีกี่ช่อง จึง <b>ต้องส่งขนาด n ไปด้วยเสมอ</b> (ยกเว้นสตริง ที่ใช้ <code>\0</code> บอกจุดจบแทน)</li></ul>
 <h3>เดินไปตามสตริงด้วยพอยน์เตอร์</h3>
 <pre class="show">while (*s != '\0') {   // ยังไม่ถึงจุดจบ
    ... *s ...         // ตัวอักษรปัจจุบัน
    s++;               // เลื่อนไปตัวถัดไป
}</pre>`,

   code:C`#include <stdio.h>

int sumArray(int *arr, int n)
{
    int i, total = 0;
    for (i = 0; i < n; i++) {
        total += arr[i];
    }
    return total;
}

void addOne(int arr[], int n)
{
    int i;
    for (i = 0; i < n; i++) {
        arr[i]++;
    }
}

int countChar(char *s, char ch)
{
    int count = 0;
    while (*s != '\0') {
        if (*s == ch) {
            count++;
        }
        s++;
    }
    return count;
}

int main(void)
{
    int data[5] = {3, 8, 1, 6, 2};
    char text[] = "banana";

    printf("Sum = %d\n", sumArray(data, 5));
    addOne(data, 5);
    printf("After addOne: data[0] = %d, Sum = %d\n", data[0], sumArray(data, 5));
    printf("'a' appears %d times in %s\n", countChar(text, 'a'), text);
    return 0;
}`}],

  solution:C`#include <stdio.h>

void fillSquares(int *arr, int n)
{
    int i;
    for (i = 0; i < n; i++) {
        *(arr + i) = (i + 1) * (i + 1);
    }
}

int main(void)
{
    int a[10];
    int n, i;

    scanf("%d", &n);
    fillSquares(a, n);
    for (i = 0; i < n; i++) {
        printf("%d ", a[i]);
    }
    printf("\n");
    return 0;
}`},

{name:'8 โจทย์รวม',title:'ขั้นที่ 8: รวมพลัง อาร์เรย์ + สตริง + พอยน์เตอร์',last:true,
 learn:C`<p>ถึงขั้นสุดท้ายแล้ว 🎉 ขั้นนี้รวมทุกอย่างเข้าด้วยกัน คือ อาร์เรย์ + loop + ฟังก์ชัน + สตริง + พอยน์เตอร์</p>
 <h3>สรุปทั้งบท</h3>
 <div class="tw"><table><tr><th>เรื่อง</th><th>จำไว้ว่า</th></tr>
 <tr><td>อาร์เรย์</td><td>index เริ่ม 0 ถึง ขนาด−1 ภาษาซีไม่ตรวจขอบให้</td></tr>
 <tr><td>อาร์เรย์ 2 มิติ</td><td><code>m[แถว][คอลัมน์]</code> ใช้ loop ซ้อน loop</td></tr>
 <tr><td>สตริง</td><td>char array + <code>\0</code> จองเผื่อ 1 ช่องเสมอ</td></tr>
 <tr><td>ฟังก์ชันสตริง</td><td>คัดลอกใช้ <code>strcpy</code> เทียบใช้ <code>strcmp(...) == 0</code></td></tr>
 <tr><td>พอยน์เตอร์</td><td><code>&amp;</code> = เอาแอดเดรส, <code>*</code> = ไปที่แอดเดรสนั้น</td></tr>
 <tr><td>พอยน์เตอร์ + อาร์เรย์</td><td><code>a[i]</code> เท่ากับ <code>*(a + i)</code> ส่งอาร์เรย์เข้าฟังก์ชันต้องส่งขนาดด้วย</td></tr></table></div>
 <h3>Bubble Sort เรียงลำดับข้อมูล</h3>
 <p>เทียบช่องที่ติดกันทีละคู่ ถ้าตัวหน้ามากกว่าตัวหลังให้สลับ ทำซ้ำหลายรอบ แต่ละรอบค่าที่มากที่สุดจะ "ลอย" ไปอยู่ท้ายสุดเหมือนฟองอากาศ 🫧</p>
 <h3>รหัสซีซาร์ (Caesar Cipher)</h3>
 <p>วิธีเข้ารหัสแบบโบราณ เลื่อนตัวอักษรไปข้างหน้า n ตำแหน่ง เช่น เลื่อน 3: A→D, B→E, … X→A, Y→B, Z→C ใช้สูตร <code>'A' + (c - 'A' + shift) % 26</code></p>
 <h3>เช็กลิสต์ก่อนส่งงาน ✅</h3>
 <ul><li>loop ใช้ <code>i &lt; N</code> ไม่ใช่ <code>i &lt;= N</code></li><li>char array ใหญ่พอสำหรับข้อความ + <code>\0</code></li><li><code>scanf</code> ตัวแปรธรรมดาต้องใส่ <code>&amp;</code> แต่ char array ไม่ต้องใส่</li><li>พอยน์เตอร์ต้องชี้ไปที่ตัวแปรจริงก่อนใช้ <code>*p</code></li><li>ส่งอาร์เรย์เข้าฟังก์ชันพร้อมขนาด</li></ul>`,
 labs:[
  {tip:'Bubble Sort ผ่านฟังก์ชันที่รับพอยน์เตอร์ ดูใน 🔍 ว่าบรรทัดเปรียบเทียบทำงานกี่ครั้ง ลองเปลี่ยนตัวเลขในช่องข้อมูล',trace:true,input:'64 34 25 12 22 11',
   code:C`#include <stdio.h>
#define N 6

void printArray(int *a, int n)
{
    int i;
    for (i = 0; i < n; i++) {
        printf("%d ", a[i]);
    }
    printf("\n");
}

void bubbleSort(int *a, int n)
{
    int i, j, temp;
    for (i = 0; i < n - 1; i++) {
        for (j = 0; j < n - 1 - i; j++) {
            if (a[j] > a[j + 1]) {
                temp = a[j];
                a[j] = a[j + 1];
                a[j + 1] = temp;
            }
        }
    }
}

int main(void)
{
    int data[N];
    int i;

    for (i = 0; i < N; i++) {
        scanf("%d", &data[i]);
    }
    printf("Before: ");
    printArray(data, N);
    bubbleSort(data, N);
    printf("After:  ");
    printArray(data, N);
    return 0;
}`},
  {tip:'รหัสซีซาร์: พิมพ์คำแล้วตามด้วยจำนวนตำแหน่งที่จะเลื่อน เช่น Hello 3 หรือ Zebra 1',trace:true,input:'Hello 3',
   code:C`#include <stdio.h>
#include <ctype.h>

void caesar(char *s, int shift)
{
    while (*s != '\0') {
        if (isupper(*s)) {
            *s = 'A' + (*s - 'A' + shift) % 26;
        } else if (islower(*s)) {
            *s = 'a' + (*s - 'a' + shift) % 26;
        }
        s++;
    }
}

int main(void)
{
    char msg[50];
    int shift;

    scanf("%s %d", msg, &shift);
    caesar(msg, shift);
    printf("Encrypted: %s\n", msg);
    return 0;
}`}],
 mission:{title:'กลับด้านข้อความด้วยพอยน์เตอร์',task:C`<p>เขียนฟังก์ชัน <code>void reverseStr(char *s)</code> ไว้เหนือ main ให้กลับด้านข้อความ <b>ในอาร์เรย์เดิม</b> เช่น <code>hello</code> → <code>olleh</code> (main เขียนไว้ให้แล้ว)</p>`,
  hint:C`ใช้พอยน์เตอร์ 2 ตัว: char *left = s; char *right = s + strlen(s) - 1; แล้ว while (left &lt; right) สลับ *left กับ *right จากนั้น left++; right--; (อย่าลืม #include &lt;string.h&gt;)`,
  code:C`#include <stdio.h>
#include <string.h>

/* เขียนฟังก์ชัน reverseStr ที่นี่ */

int main(void)
{
    char word[50];

    scanf("%s", word);
    reverseStr(word);
    printf("%s\n", word);
    return 0;
}`,tests:[{input:'hello',expected:'olleh\n'},{input:'abc',expected:'cba\n'},{input:'x',expected:'x\n'},{input:'programming',expected:'gnimmargorp\n'}],
  requires:[{re:/void\s+reverseStr\s*\(\s*char\s*\*\s*\w+\s*\)/,msg:'มีฟังก์ชัน void reverseStr(char *s)'}],
  solution:C`#include <stdio.h>
#include <string.h>

void reverseStr(char *s)
{
    char *left = s;
    char *right = s + strlen(s) - 1;
    char temp;

    while (left < right) {
        temp = *left;
        *left = *right;
        *right = temp;
        left++;
        right--;
    }
}

int main(void)
{
    char word[50];

    scanf("%s", word);
    reverseStr(word);
    printf("%s\n", word);
    return 0;
}`},
